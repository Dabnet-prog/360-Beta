<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ELIT MAN</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding: 27px 22px 22px;

      position: relative;
    }


    /* ================================
       BRAND
    ================================= */

    .brand {
      text-align: center;

      position: relative;
      z-index: 5;
    }

    .brand span {
      display: inline-block;

      padding: 8px 17px;

      border: 1px solid #111;

      border-radius: 30px;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 2.2px;
    }


    /* ================================
       CENTER
    ================================= */

    .center {
      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      z-index: 2;
    }

    .content {
      width: 100%;

      max-width: 430px;

      text-align: center;
    }


    /* ================================
       SMALL LINE
    ================================= */

    .intro {
      font-size: 13px;

      color: #999;

      margin-bottom: 30px;

      opacity: 0;

      animation:
        appear .6s ease forwards;

      animation-delay: .1s;
    }


    /* ================================
       MAIN
    ================================= */

    .main {
      font-size: clamp(29px, 7vw, 38px);

      line-height: 1.45;

      font-weight: 700;

      letter-spacing: -.5px;

      opacity: 0;

      transform: translateY(8px);

      animation:
        appearUp .65s ease forwards;

      animation-delay: .2s;
    }

    .main .light {
      font-weight: 400;

      color: #777;
    }

    .main strong {
      display: inline-block;

      font-weight: 800;

      position: relative;
    }

    .main strong::after {
      content: "";

      position: absolute;

      right: 7%;
      left: 7%;

      bottom: -5px;

      height: 1px;

      background: #111;

      transform: scaleX(0);

      animation:
        underline .45s ease forwards;

      animation-delay: .65s;
    }


    /* ================================
       SUPPORT
    ================================= */

    .support {
      max-width: 320px;

      margin: 27px auto 0;

      font-size: 14px;

      line-height: 1.9;

      color: #999;

      opacity: 0;

      transform: translateY(7px);

      animation:
        appearUp .6s ease forwards;

      animation-delay: .4s;
    }

    .support strong {
      color: #555;

      font-weight: 700;
    }


    /* ================================
       BOTTOM
    ================================= */

    .bottom {
      width: 100%;

      max-width: 350px;

      margin: 0 auto;

      text-align: center;

      position: relative;

      z-index: 5;

      opacity: 0;

      transform: translateY(8px);

      animation:
        appearUp .6s ease forwards;

      animation-delay: .65s;
    }

    .next-btn {
      width: 100%;

      border: 0;

      outline: 0;

      background: #111;

      color: #fff;

      padding: 16px 22px;

      border-radius: 14px;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .18s ease;
    }

    .next-btn:active {
      transform: scale(.985);
    }

    .micro {
      margin-top: 14px;

      font-size: 11px;

      color: #aaa;
    }


    /* ================================
       AMBIENT
    ================================= */

    .ambient {
      position: absolute;

      border-radius: 50%;

      pointer-events: none;

      background:
        rgba(0, 0, 0, .014);

      filter: blur(2px);
    }

    .ambient.one {
      width: 270px;
      height: 270px;

      top: -190px;
      right: -120px;
    }

    .ambient.two {
      width: 300px;
      height: 300px;

      bottom: -220px;
      left: -140px;
    }


    /* ================================
       ANIMATIONS
    ================================= */

    @keyframes appear {

      to {
        opacity: 1;
      }

    }

    @keyframes appearUp {

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @keyframes underline {

      to {
        transform: scaleX(1);
      }

    }


    /* ================================
       SMALL HEIGHT
    ================================= */

    @media (max-height: 650px) {

      .page {
        padding-top: 20px;
        padding-bottom: 18px;
      }

      .intro {
        margin-bottom: 21px;
      }

      .support {
        margin-top: 19px;
      }

    }

  </style>

</head>


<body>

  <!-- ==================================
       HIDDEN TRACKING FRAME
  =================================== -->

  <iframe
    name="trackingFrame"
    style="display:none;">
  </iframe>


  <div class="page">

    <div class="ambient one"></div>
    <div class="ambient two"></div>


    <!-- ================================
         BRAND
    ================================= -->

    <div class="brand">
      <span>ELIT MAN</span>
    </div>


    <!-- ================================
         CENTER
    ================================= -->

    <main class="center">

      <div class="content">

        <div class="intro">
          اختيارك للوقت ليس عشوائيًا.
        </div>


        <div class="main">

          <span class="light">
            الوقت الذي اخترته
          </span>

          <br>

          <strong>
            مهم.
          </strong>

        </div>


        <div class="support">

          لأنه يحدد
          <strong>متى تحتاج هذا العطر.</strong>

        </div>

      </div>

    </main>


    <!-- ================================
         BOTTOM
    ================================= -->

    <div class="bottom">

      <button
        class="next-btn"
        id="nextButton">

        نكمل ←

      </button>

      <div class="micro">
        ننتقل للخطوة التالية
      </div>

    </div>

  </div>


  <script>

    /* ==================================
       TRACKING CONFIG
    ================================== */

    const TRACKING_URL =
      "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


    /* ==================================
       GET SAME BROWSER ID
    ================================== */

    function getBrowserId() {

      let browserId =
        localStorage.getItem(
          "closing_layer_browser_id"
        );

      if (!browserId) {

        browserId =
          "browser_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2, 10);

        localStorage.setItem(
          "closing_layer_browser_id",
          browserId
        );
      }

      return browserId;
    }


    /* ==================================
       SEND TRACKING
    ================================== */

    function sendTracking(data) {

      const form =
        document.createElement("form");

      form.method = "POST";

      form.target = "trackingFrame";

      form.action = TRACKING_URL;

      form.style.display = "none";


      const payload = {
        browser_id: getBrowserId(),
        ...data
      };


      Object.keys(payload).forEach(
        function (key) {

          const input =
            document.createElement("input");

          input.type = "hidden";

          input.name = key;

          const value =
            payload[key];

          input.value =
            typeof value === "object"
              ? JSON.stringify(value)
              : String(value ?? "");

          form.appendChild(input);

        }
      );


      document.body.appendChild(form);

      form.submit();


      setTimeout(
        function () {

          if (form.parentNode) {
            form.parentNode.removeChild(form);
          }

        },
        1000
      );
    }


    /* ==================================
       PREVIOUS DATA
    ================================== */

    const selectedProduct =
      localStorage.getItem(
        "selected_product"
      ) || "";

    const selectedProducts =
      localStorage.getItem(
        "selected_products"
      ) || "";

    const selectedIntent =
      localStorage.getItem(
        "selected_intent"
      ) || "";

    const selectedIntentText =
      localStorage.getItem(
        "selected_intent_text"
      ) || "";

    const selectedContext =
      localStorage.getItem(
        "selected_context"
      ) || "";

    const selectedContextText =
      localStorage.getItem(
        "selected_context_text"
      ) || "";


    /* ==================================
       ENTRY
    ================================== */

    const enteredAt =
      Date.now();

    localStorage.setItem(
      "page7_entered_at",
      enteredAt
    );


    /* ==================================
       DECISION STATE
    ================================== */

    const previousState =
      JSON.parse(
        localStorage.getItem(
          "decision_state"
        ) || "{}"
      );

    const decisionState = {

      ...previousState,

      product:
        selectedProduct,

      products:
        selectedProducts,

      intent:
        selectedIntent,

      intent_text:
        selectedIntentText,

      context:
        selectedContext,

      context_text:
        selectedContextText,

      page:
        "page7",

      page7_entered_at:
        enteredAt

    };

    localStorage.setItem(
      "decision_state",
      JSON.stringify(
        decisionState
      )
    );


    /* ==================================
       PAGE 7 ENTRY TRACKING
    ================================== */

    sendTracking({

      event:
        "page_view",

      page:
        "page7",

      product:
        selectedProduct,

      selected_products:
        selectedProducts,

      intent:
        selectedIntent,

      intent_text:
        selectedIntentText,

      context:
        selectedContext,

      context_text:
        selectedContextText,

      timestamp:
        enteredAt

    });


    /* ==================================
       BUTTON
    ================================== */

    document
      .getElementById("nextButton")
      .addEventListener(
        "click",
        function () {

          const completedAt =
            Date.now();

          const timeOnPage =
            completedAt -
            enteredAt;


          /* ==============================
             SAVE LOCAL DATA
          ============================== */

          localStorage.setItem(
            "page7_completed_at",
            completedAt
          );

          localStorage.setItem(
            "page7_time_on_page",
            timeOnPage
          );


          /* ==============================
             FINAL STATE
          ============================== */

          const finalState = {

            ...decisionState,

            page:
              "page7",

            page7_completed_at:
              completedAt,

            page7_time_on_page:
              timeOnPage

          };

          localStorage.setItem(
            "decision_state",
            JSON.stringify(
              finalState
            )
          );


          /* ==============================
             LOCAL EVENTS
          ============================== */

          const events =
            JSON.parse(
              localStorage.getItem(
                "events"
              ) || "[]"
            );

          events.push({

            event:
              "page7_completed",

            page:
              "page7",

            product:
              selectedProduct,

            intent:
              selectedIntent,

            context:
              selectedContext,

            time_on_page:
              timeOnPage,

            timestamp:
              completedAt

          });

          localStorage.setItem(
            "events",
            JSON.stringify(events)
          );


          /* ==============================
             SERVER TRACKING
             PAGE 7 → PAGE 8
          ============================== */

          sendTracking({

            event:
              "page7_completed",

            page:
              "page7",

            product:
              selectedProduct,

            selected_products:
              selectedProducts,

            intent:
              selectedIntent,

            intent_text:
              selectedIntentText,

            context:
              selectedContext,

            context_text:
              selectedContextText,

            time_on_page:
              timeOnPage,

            next_page:
              "page8",

            timestamp:
              completedAt

          });


          /* ==============================
             NEXT PAGE
          ============================== */

          window.location.href =
            "page8.html";

        }
      );

  </script>

</body>

</html>
