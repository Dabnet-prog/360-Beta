<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ELIT MAN</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 27px 22px 22px;
      position: relative;
    }

    .brand {
      text-align: center;
      position: relative;
      z-index: 5;
    }

    .brand span {
      display: inline-block;
      padding: 8px 17px;
      border: 1px solid #111;
      border-radius: 30px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.2px;
    }

    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .content {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .intro {
      font-size: 13px;
      color: #999;
      margin-bottom: 30px;
      opacity: 0;
      animation: appear .6s ease forwards;
      animation-delay: .1s;
    }

    .main {
      font-size: clamp(29px, 7vw, 38px);
      line-height: 1.45;
      font-weight: 700;
      letter-spacing: -.5px;
      opacity: 0;
      transform: translateY(8px);
      animation: appearUp .65s ease forwards;
      animation-delay: .2s;
    }

    .main .light {
      font-weight: 400;
      color: #777;
    }

    .main strong {
      display: inline-block;
      font-weight: 800;
      position: relative;
    }

    .main strong::after {
      content: "";
      position: absolute;
      right: 7%;
      left: 7%;
      bottom: -5px;
      height: 1px;
      background: #111;
      transform: scaleX(0);
      animation: underline .45s ease forwards;
      animation-delay: .65s;
    }

    .support {
      max-width: 320px;
      margin: 27px auto 0;
      font-size: 14px;
      line-height: 1.9;
      color: #999;
      opacity: 0;
      transform: translateY(7px);
      animation: appearUp .6s ease forwards;
      animation-delay: .4s;
    }

    .support strong {
      color: #555;
      font-weight: 700;
    }

    .bottom {
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 5;
      opacity: 0;
      transform: translateY(8px);
      animation: appearUp .6s ease forwards;
      animation-delay: .65s;
    }

    .next-btn {
      width: 100%;
      border: 0;
      outline: 0;
      background: #111;
      color: #fff;
      padding: 16px 22px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease;
    }

    .next-btn:active {
      transform: scale(.985);
    }

    .micro {
      margin-top: 14px;
      font-size: 11px;
      color: #aaa;
    }

    .ambient {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(0, 0, 0, .014);
      filter: blur(2px);
    }

    .ambient.one {
      width: 270px;
      height: 270px;
      top: -190px;
      right: -120px;
    }

    .ambient.two {
      width: 300px;
      height: 300px;
      bottom: -220px;
      left: -140px;
    }

    @keyframes appear {
      to {
        opacity: 1;
      }
    }

    @keyframes appearUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes underline {
      to {
        transform: scaleX(1);
      }
    }

    @media (max-height: 650px) {

      .page {
        padding-top: 20px;
        padding-bottom: 18px;
      }

      .intro {
        margin-bottom: 21px;
      }

      .support {
        margin-top: 19px;
      }

    }

  </style>

</head>

<body>

  <div class="page">

    <div class="ambient one"></div>
    <div class="ambient two"></div>

    <div class="brand">
      <span>ELIT MAN</span>
    </div>

    <main class="center">

      <div class="content">

        <div class="intro">
          اختيارك للوقت ليس عشوائيًا.
        </div>

        <div class="main">

          <span class="light">
            الوقت الذي اخترته
          </span>

          <br>

          <strong>
            مهم.
          </strong>

        </div>

        <div class="support">

          لأنه يحدد
          <strong>متى تحتاج هذا العطر.</strong>

        </div>

      </div>

    </main>

    <div class="bottom">

      <button
        class="next-btn"
        id="nextButton">

        نكمل ←

      </button>

      <div class="micro">
        ننتقل للخطوة التالية
      </div>

    </div>

  </div>

  <script>

    /* ==================================
       TRACKING CONFIG
    ================================== */

    const TRACKING_URL =
      "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


    /* ==================================
       CLIENT ID
    ================================== */

    const CLIENT_KEY =
      "closing_layer_client_id";


    let clientId =
      localStorage.getItem(
        CLIENT_KEY
      );


    if (!clientId) {

      clientId =
        "CL-" +
        crypto.randomUUID();

      localStorage.setItem(
        CLIENT_KEY,
        clientId
      );

    }


    /* ==================================
       SESSION ID
    ================================== */

    const SESSION_KEY =
      "closing_layer_session_id";


    const LAST_SESSION_KEY =
      "closing_layer_last_session_id";


    let sessionId =
      sessionStorage.getItem(
        SESSION_KEY
      );


    let isNewSession = false;


    if (!sessionId) {

      sessionId =
        "S-" +
        crypto.randomUUID();

      sessionStorage.setItem(
        SESSION_KEY,
        sessionId
      );

      isNewSession = true;

    }


    /* ==================================
       RETURNED LATER
    ================================== */

    const previousSessionId =
      localStorage.getItem(
        LAST_SESSION_KEY
      );


    const returnedLater =
      isNewSession &&
      previousSessionId &&
      previousSessionId !== sessionId;


    localStorage.setItem(
      LAST_SESSION_KEY,
      sessionId
    );


    /* ==================================
       CURRENT PAGE
    ================================== */

    const CURRENT_PAGE =
      "الصفحة 7";


    const enteredAt =
      Date.now();


    let pageExitSent = false;


    /* ==================================
       U — FULL PATH
       تسجيل الصفحة لحظة الخروج
    ================================== */

    let pathExitSent = false;


    function sendPathExit() {

      if (pathExitSent) {
        return;
      }


      pathExitSent = true;


      const payload = {

        client_id:
          clientId,

        session_id:
          sessionId,

        event:
          "path_page_exit",

        page:
          CURRENT_PAGE,

        path_page:
          CURRENT_PAGE,

        timestamp:
          new Date().toISOString()

      };


      const body =
        JSON.stringify(payload);


      try {

        if (navigator.sendBeacon) {

          const blob =
            new Blob(
              [body],
              {
                type:
                  "text/plain;charset=UTF-8"
              }
            );

          if (
            navigator.sendBeacon(
              TRACKING_URL,
              blob
            )
          ) {

            return;

          }

        }

      } catch (error) {}


      fetch(

        TRACKING_URL,

        {

          method:
            "POST",

          headers:
            {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },

          body:
            body,

          mode:
            "no-cors",

          keepalive:
            true,

          cache:
            "no-store"

        }

      ).catch(function () {});

    }


    /* ==================================
       SEND TRACKING
    ================================== */

    function sendTracking(data) {

      const payload = {

        client_id:
          clientId,

        session_id:
          sessionId,

        ...data

      };


      fetch(

        TRACKING_URL,

        {

          method:
            "POST",

          headers:
            {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },

          body:
            JSON.stringify(payload),

          mode:
            "no-cors",

          keepalive:
            true,

          cache:
            "no-store"

        }

      ).catch(function () {});

    }


    /* ==================================
       SESSION START
    ================================== */

    if (isNewSession) {

      sendTracking({

        event:
          "session_start",

        page:
          CURRENT_PAGE,

        path:
          CURRENT_PAGE,

        returned_later:
          returnedLater
            ? "نعم"
            : "لا",

        timestamp:
          new Date().toISOString()

      });

    }


    /* ==================================
       PREVIOUS DATA
    ================================== */

    const selectedProduct =
      localStorage.getItem(
        "selected_product"
      ) || "";


    const selectedProducts =
      localStorage.getItem(
        "selected_products"
      ) || "";


    const selectedIntent =
      localStorage.getItem(
        "selected_intent"
      ) || "";


    const selectedIntentText =
      localStorage.getItem(
        "selected_intent_text"
      ) || "";


    const selectedContext =
      localStorage.getItem(
        "selected_context"
      ) || "";


    const selectedContextText =
      localStorage.getItem(
        "selected_context_text"
      ) || "";


    /* ==================================
       DECISION STATE
    ================================== */

    let previousState = {};

    try {

      previousState =
        JSON.parse(
          localStorage.getItem(
            "decision_state"
          ) || "{}"
        );

    } catch (error) {

      previousState = {};

    }


    const decisionState = {

      ...previousState,

      product:
        selectedProduct,

      products:
        selectedProducts,

      intent:
        selectedIntent,

      intent_text:
        selectedIntentText,

      context:
        selectedContext,

      context_text:
        selectedContextText,

      page:
        CURRENT_PAGE,

      page7_entered_at:
        enteredAt

    };


    localStorage.setItem(

      "decision_state",

      JSON.stringify(
        decisionState
      )

    );


    /* ==================================
       PAGE VIEW
    ================================== */

    sendTracking({

      event:
        "page_view",

      page:
        CURRENT_PAGE,

      path:
        CURRENT_PAGE,

      selected_product:
        selectedProduct,

      selected_products:
        selectedProducts,

      selected_intent:
        selectedIntent,

      selected_intent_text:
        selectedIntentText,

      selected_context:
        selectedContext,

      selected_context_text:
        selectedContextText,

      entered_at:
        new Date(
          enteredAt
        ).toISOString()

    });


    /* ==================================
       BACK NAVIGATION
    ================================== */

    window.addEventListener(
      "pageshow",
      function () {

        const navigation =
          performance.getEntriesByType(
            "navigation"
          )[0];


        if (
          navigation &&
          navigation.type ===
            "back_forward"
        ) {

          sendTracking({

            event:
              "back_navigation",

            page:
              CURRENT_PAGE,

            path:
              CURRENT_PAGE,

            went_back:
              true,

            back_count:
              1,

            interaction:
              "رجع إلى الصفحة 7",

            timestamp:
              new Date().toISOString()

          });

        }

      }
    );


    /* ==================================
       PAGE EXIT
    ================================== */

    function sendPageExit() {

      if (pageExitSent) {

        return;

      }


      pageExitSent = true;


      const durationMs =
        Date.now() -
        enteredAt;


      const durationSeconds =
        Math.round(
          durationMs / 1000
        );


      sendTracking({

        event:
          "page_exit",

        page:
          CURRENT_PAGE,

        path:
          CURRENT_PAGE,

        duration:
          durationSeconds,

        timestamp:
          new Date().toISOString()

      });

    }


    /* ==================================
       BUTTON
    ================================== */

    document
      .getElementById(
        "nextButton"
      )
      .addEventListener(
        "click",
        function () {

          const completedAt =
            Date.now();


          const timeOnPage =
            completedAt -
            enteredAt;


          /* ==============================
             SAVE LOCAL DATA
          ============================== */

          localStorage.setItem(

            "page7_completed_at",

            completedAt

          );


          localStorage.setItem(

            "page7_time_on_page",

            timeOnPage

          );


          /* ==============================
             FINAL STATE
          ============================== */

          const finalState = {

            ...decisionState,

            page:
              CURRENT_PAGE,

            page7_completed_at:
              completedAt,

            page7_time_on_page:
              timeOnPage

          };


          localStorage.setItem(

            "decision_state",

            JSON.stringify(
              finalState
            )

          );


          /* ==============================
             OBSERVABLE INTERACTION
          ============================== */

          sendTracking({

            event:
              "interaction",

            page:
              CURRENT_PAGE,

            path:
              CURRENT_PAGE,

            interaction:
              "ضغط على زر: نكمل",

            timestamp:
              new Date().toISOString()

          });


          /* ==============================
             PAGE COMPLETION
          ================================= */

          sendTracking({

            event:
              "page7_completed",

            page:
              CURRENT_PAGE,

            path:
              CURRENT_PAGE,

            selected_product:
              selectedProduct,

            selected_products:
              selectedProducts,

            selected_intent:
              selectedIntent,

            selected_intent_text:
              selectedIntentText,

            selected_context:
              selectedContext,

            selected_context_text:
              selectedContextText,

            time_on_page:
              timeOnPage,

            completed:
              true,

            next_page:
              "الصفحة 8",

            timestamp:
              new Date(
                completedAt
              ).toISOString()

          });


          /* ==============================
             U — PATH EXIT
          ================================= */

          sendPathExit();


          /* ==============================
             PAGE EXIT
          ================================= */

          sendPageExit();


          /* ==============================
             NEXT PAGE
          ================================= */

          setTimeout(
            function () {

              window.location.href =
                "page8.html";

            },
            250
          );

        }
      );


    /* ==================================
       PAGE HIDE
    ================================== */

    window.addEventListener(
      "pagehide",
      function () {

        sendPathExit();

        sendPageExit();

      }
    );

  </script>

</body>

</html>
