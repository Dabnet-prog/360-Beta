<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>360¹</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    background: #ffffff;

    color: #000000;

    font-family: Arial, sans-serif;
}


body {

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}


.container {

    width: 100%;

    max-width: 520px;

    padding: 30px;
}


.logo {

    direction: ltr;

    font-size: 78px;

    font-weight: 800;

    line-height: 1;

    letter-spacing: -4px;

    margin-bottom: 45px;
}


.logo .one {

    font-size: 0.38em;

    vertical-align: super;

    position: relative;

    top: -0.18em;

}


.message {

    font-size: 22px;

    color: #222222;

    line-height: 1.6;

}


.submessage {

    margin-top: 12px;

    font-size: 16px;

    color: #666666;
}


.finish {

    width: 100%;

    height: 52px;

    margin-top: 35px;

    border: none;

    border-radius: 8px;

    background: #000000;

    color: #ffffff;

    font-size: 17px;

    cursor: pointer;
}

</style>

</head>


<body>


<div class="container">


<div class="logo">

360<span class="one">1</span>

</div>


<div class="message">

تم استلام بياناتك بنجاح.

</div>


<div class="submessage">

سنتواصل معك في أقرب وقت.

</div>


<button
    class="finish"
    id="finish"
>

إنهاء

</button>


</div>


<script>


const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx-leQ-ZWuA4LVjz-spCAhyY84_3YQer9vVgFPuHSYAiESgmGvnc9GMhAjXFYaWhtfNXw/exec";


const params =
    new URLSearchParams(
        window.location.search
    );


const entryRow =
    params.get("row") ||
    sessionStorage.getItem(
        "entryRow"
    );


/* =========================
   تسجيل الخروج
   ========================= */

if (entryRow) {

    fetch(
        SCRIPT_URL,
        {

            method: "POST",

            body: JSON.stringify({

                type: "exit",

                row: entryRow

            })

        }
    );

}


/* =========================
   إنهاء
   ========================= */

document
    .getElementById("finish")
    .addEventListener(
        "click",
        function() {

            sessionStorage.removeItem(
                "entryRow"
            );

            window.location.replace(
                "about:blank"
            );

        }
    );

</script>

</body>

</html>
