<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تمت العملية بنجاح</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background: #f7f7f5;
      color: #111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;

      opacity: 0;

      animation: pageIn 0.7s ease forwards;
    }


    /* =========================
       PAGE
    ========================= */

    .page {

      width: 100%;
      max-width: 520px;

      min-height: 100vh;

      margin: 0 auto;

      padding: 40px 24px 28px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }


    /* =========================
       SUCCESS ICON
    ========================= */

    .success-icon {

      margin-top: 35px;

      width: 68px;
      height: 68px;

      border: 1.5px solid #111;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: 400;

      flex-shrink: 0;

      position: relative;

      opacity: 0;

      transform: scale(0.85);

      animation:
        iconIn 0.6s ease 0.15s forwards;
    }


    /*
      دائرة خفيفة جدًا حول علامة النجاح.
      لا تظهر مباشرة؛ تظهر بعد اكتمال العلامة.
    */

    .success-icon::after {

      content: "";

      position: absolute;

      inset: -7px;

      border: 1px solid rgba(17, 17, 17, 0.08);

      border-radius: 50%;

      opacity: 0;

      animation:
        softPulse 2.8s ease 0.8s infinite;
    }


    /* =========================
       MAIN MESSAGE
    ========================= */

    .message {

      max-width: 440px;

      margin-top: 125px;

      font-size:
        clamp(19px, 4.8vw, 25px);

      font-weight: 500;

      line-height: 1.85;

      color: #222;

      opacity: 0;

      transform: translateY(10px);

      animation:
        textIn 0.65s ease 0.35s forwards;
    }


    .message strong {

      display: block;

      font-size:
        clamp(23px, 5.5vw, 29px);

      font-weight: 600;

      margin-bottom: 18px;

      position: relative;
    }


    /*
      خط صغير يظهر تحت عبارة النجاح
      بعد ظهورها، كإشارة بصرية هادئة لاكتمال الخطوة.
    */

    .message strong::after {

      content: "";

      display: block;

      width: 0;

      height: 1px;

      background: #111;

      opacity: 0.18;

      margin:
        9px auto 0;

      animation:
        lineAppear 0.7s ease 0.95s forwards;
    }


    /* =========================
       BOTTOM AREA
    ========================= */

    .bottom {

      width: 100%;

      margin-top: auto;

      padding-top: 70px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================
       EXIT BUTTON
    ========================= */

    .exit-button {

      width: 100%;
      max-width: 500px;

      height: 56px;

      border: none;

      border-radius: 999px;

      background: #111;

      color: #fff;

      font-size: 16px;

      font-weight: 500;

      cursor: pointer;

      position: relative;

      overflow: hidden;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;

      -webkit-tap-highlight-color: transparent;

      opacity: 0;

      transform: translateY(10px);

      animation:
        buttonIn 0.65s ease 0.55s forwards;
    }


    .exit-button:hover {
      transform: translateY(-2px);
    }


    .exit-button:active {
      transform: scale(0.975);
    }


    /*
      انعكاس صغير يمر على الزر مرة واحدة.
      يعطي إحساسًا بالحياة دون لفت الانتباه.
    */

    .exit-button::after {

      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 45%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.08),
          transparent
        );

      animation:
        buttonShine 1.1s ease 1.25s 1;
    }


    .exit-button.loading {

      opacity: 0.7;

      cursor: default;

      transform: none;
    }


    .exit-button.loading::after {
      display: none;
    }


    /* =========================
       FINAL MESSAGE
    ========================= */

    .final-message {

      margin-top: 24px;

      font-size: 14px;

      line-height: 1.7;

      color: #999;

      opacity: 0;

      animation:
        fadeIn 0.7s ease 0.8s forwards;
    }


    /*
      عند ظهور الجملة الأخيرة،
      تتحرك نقطة صغيرة بشكل هادئ.
    */

    .final-message::after {

      content: "•";

      display: inline-block;

      margin-right: 5px;

      color: #c4c4c1;

      animation:
        tinyBreath 2.5s ease 1.5s infinite;
    }


    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes pageIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    @keyframes iconIn {

      0% {
        opacity: 0;
        transform: scale(0.85);
      }

      70% {
        opacity: 1;
        transform: scale(1.04);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }


    @keyframes softPulse {

      0% {
        opacity: 0;
        transform: scale(0.96);
      }

      25% {
        opacity: 1;
      }

      60% {
        opacity: 0;
        transform: scale(1.06);
      }

      100% {
        opacity: 0;
        transform: scale(1.06);
      }
    }


    @keyframes textIn {

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    @keyframes lineAppear {

      from {
        width: 0;
      }

      to {
        width: 32px;
      }
    }


    @keyframes buttonIn {

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    @keyframes buttonShine {

      from {
        left: -100%;
      }

      to {
        left: 140%;
      }
    }


    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    @keyframes tinyBreath {

      0%,
      100% {
        opacity: 0.35;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.15);
      }
    }


    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 768px) {

      .page {

        padding:
          40px 40px 32px;
      }

      .success-icon {

        margin-top: 30px;

        width: 76px;
        height: 76px;

        font-size: 34px;
      }

      .message {

        margin-top: 135px;

        max-width: 500px;

        font-size: 21px;

        line-height: 1.9;
      }

      .message strong {

        font-size: 29px;

        margin-bottom: 20px;
      }

      .bottom {

        padding-top: 80px;
      }

      .exit-button {

        height: 58px;
      }

      .final-message {

        margin-top: 27px;

        font-size: 14px;
      }
    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 360px) {

      .page {

        padding:
          30px 20px 22px;
      }

      .success-icon {

        margin-top: 25px;

        width: 60px;
        height: 60px;

        font-size: 27px;
      }

      .message {

        margin-top: 95px;

        font-size: 17px;

        line-height: 1.85;
      }

      .message strong {

        font-size: 22px;

        margin-bottom: 15px;
      }

      .bottom {

        padding-top: 55px;
      }

      .exit-button {

        height: 53px;

        font-size: 15px;
      }

      .final-message {

        margin-top: 21px;

        font-size: 13px;
      }
    }


    /* =========================
       REDUCE MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;
      }

      body,
      .success-icon,
      .message,
      .exit-button,
      .final-message {

        opacity: 1;

        transform: none;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <!-- علامة النجاح -->

    <div
      class="success-icon"
      aria-hidden="true"
    >
      ✓
    </div>


    <!-- الرسالة الرئيسية -->

    <p class="message">

      <strong>
        تمت العملية بنجاح.
      </strong>

      سنراجع ما كتبته ونتواصل معك قريبًا
      <br>

      لمناقشة فكرتك وما يمكن أن تكون عليه
      خطوتك التالية.

    </p>


    <!-- الجزء السفلي -->

    <div class="bottom">

      <button
        class="exit-button"
        id="exitButton"
        type="button"
      >
        خروج
      </button>


      <p class="final-message">

        القرار يبدأ بخطوة،
        والآن أصبحت لديك خطوة.

      </p>

    </div>

  </main>


  <script>

    /* =========================
       SESSION
    ========================= */

    try {

      sessionStorage.setItem(
        "formCompleted",
        "true"
      );

      sessionStorage.setItem(
        "completedAt",
        new Date().toISOString()
      );

    } catch (error) {

      console.warn(
        "Session storage is unavailable."
      );

    }


    /* =========================
       TRACKING
       W → X → Y
    ========================= */

    const API_URL =
      "https://script.google.com/macros/s/AKfycby4Bh4LqFrAH0igKlMdHyrYPpXbQL2NpbkUbzg8Ah6U0AtF4I1FgDqGBrGmr4r7HBW36g/exec";


    const sessionId =
      sessionStorage.getItem(
        "sessionId"
      );


    /*
      الصفحة الثانية تحفظ وقت
      الانتقال إلى الصفحة الثالثة.
    */

    let page3EntryTimestamp =
      sessionStorage.getItem(
        "page3EntryTimestamp"
      );


    /*
      إذا لم يكن موجودًا بسبب تجربة
      مباشرة للصفحة الثالثة، نبدأ
      من لحظة فتحها.
    */

    if (!page3EntryTimestamp) {

      page3EntryTimestamp =
        new Date().toISOString();

      sessionStorage.setItem(
        "page3EntryTimestamp",
        page3EntryTimestamp
      );

    }


    /* =========================
       FORMAT DATE
    ========================= */

    function formatDateTime(date) {

      const hours =
        String(
          date.getHours()
        ).padStart(2, "0");

      const minutes =
        String(
          date.getMinutes()
        ).padStart(2, "0");

      const seconds =
        String(
          date.getSeconds()
        ).padStart(2, "0");

      const day =
        String(
          date.getDate()
        ).padStart(2, "0");

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      const year =
        date.getFullYear();


      return (
        hours +
        ":" +
        minutes +
        ":" +
        seconds +
        " " +
        day +
        "/" +
        month +
        "/" +
        year
      );

    }


    /* =========================
       DURATION
    ========================= */

    function getDuration(
      startTimestamp
    ) {

      if (!startTimestamp) {
        return "";
      }


      const start =
        new Date(
          startTimestamp
        );

      const now =
        new Date();


      let totalSeconds =
        Math.floor(
          (
            now.getTime() -
            start.getTime()
          ) / 1000
        );


      if (totalSeconds < 0) {
        totalSeconds = 0;
      }


      const hours =
        Math.floor(
          totalSeconds / 3600
        );


      totalSeconds =
        totalSeconds % 3600;


      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const seconds =
        totalSeconds % 60;


      return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0") +
        " sec"
      );

    }


    /* =========================
       SEND TRACKING
    ========================= */

    function sendTracking(data) {

      if (!sessionId) {
        return Promise.resolve(false);
      }


      return fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(data),

          keepalive: true
        }
      )
      .then(function () {
        return true;
      })
      .catch(function (error) {

        console.error(
          "Tracking error:",
          error
        );

        return false;

      });

    }


    /* =========================
       EXIT BUTTON
    ========================= */

    const exitButton =
      document.getElementById(
        "exitButton"
      );


    let exitClicked = false;


    exitButton.addEventListener(
      "click",
      async function () {

        if (exitClicked) {
          return;
        }


        exitClicked = true;


        /*
          وقت الخروج
        */

        const exitDate =
          new Date();


        const exitTime =
          formatDateTime(
            exitDate
          );


        /*
          مدة البقاء في الصفحة 3
        */

        const duration3 =
          getDuration(
            page3EntryTimestamp
          );


        /*
          حفظ محليًا أيضًا
        */

        sessionStorage.setItem(
          "page3Duration",
          duration3
        );


        sessionStorage.setItem(
          "exitTime",
          exitTime
        );


        /*
          نفس الصف في Google Sheets
        */

        await sendTracking({

          sessionId:
            sessionId,

          exited:
            "نعم",

          exitTime:
            exitTime,

          duration3:
            duration3

        });


        /*
          نفس سلوك الزر الأصلي
        */

        exitButton.classList.add(
          "loading"
        );

        exitButton.textContent =
          "تم";


        setTimeout(
          function () {

            if (
              window.history.length > 1
            ) {

              window.history.back();

            } else {

              exitButton.textContent =
                "يمكنك إغلاق الصفحة";

            }

          },
          600
        );

      }
    );


  </script>

</body>

</html>
