<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>360¹</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    background: #ffffff;

    color: #000000;

    font-family: Arial, sans-serif;
}

body {

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}

.container {

    width: 100%;

    max-width: 520px;

    padding: 30px 20px;
}

.logo {

    direction: ltr;

    font-size: 58px;

    font-weight: 800;

    line-height: 1;

    letter-spacing: -3px;

    margin-bottom: 55px;
}

.logo .one {

    font-size: 0.38em;

    vertical-align: super;

    position: relative;

    top: -0.18em;

    letter-spacing: 0;
}

.message {

    font-size: 21px;

    line-height: 1.8;

    color: #111111;

    margin-bottom: 12px;
}

.sub {

    font-size: 16px;

    line-height: 1.7;

    color: #555555;

    margin-bottom: 45px;
}

.finish {

    width: 100%;

    max-width: 360px;

    height: 52px;

    border: none;

    border-radius: 8px;

    background: #000000;

    color: #ffffff;

    font-size: 16px;

    cursor: pointer;
}

</style>

</head>


<body>

<main class="container">


<div class="logo">

360<span class="one">1</span>

</div>


<div class="message">

تم استلام بياناتك بنجاح.

</div>


<div class="sub">

سنتواصل معك في أقرب وقت.

</div>


<button
    class="finish"
    id="finish"
>

إنهاء

</button>


</main>


<script>

const scriptURL =
    "https://script.google.com/macros/s/AKfycbx-leQ-ZWuA4LVjz-spCAhyY84_3YQer9vVgFPuHSYAiESgmGvnc9GMhAjXFYaWhtfNXw/exec";


const sessionId =
    sessionStorage.getItem(
        "sessionId"
    );


let exitSent = false;


function sendExit() {

    if (
        exitSent ||
        !sessionId
    ) {

        return;

    }


    exitSent = true;


    /*
     * تسجيل الخروج.
     */

    fetch(
        scriptURL,
        {

            method: "POST",

            body: JSON.stringify({

                type: "exit",

                sessionId:
                    sessionId

            })

        }
    )
    .catch(
        function() {}
    );

}


/*
 * نسجل الخروج بمجرد الوصول
 * إلى صفحة النجاح.
 */

sendExit();


document
    .getElementById("finish")
    .addEventListener(
        "click",
        function() {

            sessionStorage.removeItem(
                "sessionId"
            );

            window.location.href =
                "about:blank";

        }
    );

</script>

</body>

</html>
