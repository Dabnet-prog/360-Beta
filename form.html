<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ابدأ من هنا</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            background: #f7f7f5;
            color: #111;

            font-family: Arial, "Tajawal", sans-serif;

            overflow-x: hidden;
        }


        /* =========================
           PAGE
        ========================= */

        .page {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            flex-direction: column;

            position: relative;

            padding: 28px 20px 30px;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .background-shape {
            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            background: #eeeeea;

            top: -150px;
            left: -130px;

            opacity: 0.65;

            pointer-events: none;

            transition:
                transform 1s ease;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: relative;

            z-index: 5;
        }


        .brand {
            font-size: 11px;

            color: #92928d;

            letter-spacing: 0.5px;
        }


        .progress {
            font-size: 11px;

            color: #92928d;

            direction: ltr;

            transition:
                opacity 0.2s ease;
        }


        /* =========================
           PROGRESS BAR
        ========================= */

        .progress-line {
            width: 100%;

            height: 2px;

            background: #e5e5e1;

            margin-top: 15px;

            position: relative;

            overflow: hidden;

            z-index: 5;
        }


        .progress-fill {
            position: absolute;

            top: 0;
            right: 0;

            height: 100%;

            width: 9.09%;

            background: #111;

            transition:
                width 0.45s cubic-bezier(.4,0,.2,1);
        }


        /* =========================
           MAIN
        ========================= */

        .form-area {
            width: 100%;

            max-width: 620px;

            margin: auto;

            position: relative;

            z-index: 2;
        }


        /* =========================
           QUESTION
        ========================= */

        .question-screen {
            width: 100%;

            animation:
                questionIn 0.38s ease both;
        }


        .question-number {
            font-size: 12px;

            color: #999994;

            margin-bottom: 16px;

            direction: ltr;

            text-align: right;

            transition:
                color 0.25s ease;
        }


        .question {
            font-size: 30px;

            line-height: 1.45;

            font-weight: 600;

            letter-spacing: -0.5px;

            margin-bottom: 12px;

            transition:
                opacity 0.25s ease;
        }


        .question-description {
            font-size: 14px;

            line-height: 1.8;

            color: #777771;

            margin-bottom: 30px;
        }


        /* =========================
           INPUT
        ========================= */

        .text-input {
            width: 100%;

            border: none;

            border-bottom: 1px solid #cfcfca;

            background: transparent;

            padding: 14px 2px;

            font-family: inherit;

            font-size: 18px;

            color: #111;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }


        .text-input:focus {
            border-color: #111;
        }


        .text-input::placeholder {
            color: #aaa9a4;

            transition:
                opacity 0.2s ease;
        }


        .text-input:focus::placeholder {
            opacity: 0.55;
        }


        /* =========================
           OPTIONS
        ========================= */

        .options {
            display: flex;

            flex-direction: column;

            gap: 10px;

            width: 100%;
        }


        .option {
            width: 100%;

            border: 1px solid #deded9;

            background: rgba(255, 255, 255, 0.35);

            border-radius: 14px;

            padding: 17px 18px;

            font-family: inherit;

            font-size: 15px;

            color: #222;

            text-align: right;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .option:hover {
            border-color: #aaa;

            transform:
                translateY(-1px);
        }


        .option:active {
            transform:
                scale(0.985);
        }


        .option.selected {
            background: #111;

            color: #fff;

            border-color: #111;

            box-shadow:
                0 5px 16px rgba(0,0,0,0.08);
        }


        /*
         * حركة صغيرة عند الاختيار
         */

        .option.selected::after {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.08),
                    transparent
                );

            animation:
                optionShine 0.45s ease;
        }


        /* =========================
           CHECKBOX OPTIONS
        ========================= */

        .option.multiple {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .check {
            width: 18px;

            height: 18px;

            border: 1px solid #aaa;

            border-radius: 5px;

            flex-shrink: 0;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }


        .option.selected .check {
            background: #fff;

            border-color: #fff;

            position: relative;

            transform:
                scale(1.05);
        }


        .option.selected .check::after {
            content: "✓";

            color: #111;

            position: absolute;

            font-size: 12px;

            font-weight: bold;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -55%);
        }


        /* =========================
           TEXTAREA
        ========================= */

        textarea.text-input {
            min-height: 120px;

            resize: none;

            line-height: 1.8;
        }


        /* =========================
           OTHER INPUT
        ========================= */

        .other-input {
            display: none;

            margin-top: 10px;

            animation:
                fadeDown 0.25s ease;
        }


        .other-input.show {
            display: block;
        }


        /* =========================
           ACTIONS
        ========================= */

        .actions {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-top: 27px;
        }


        .back-button,
        .next-button {
            border: none;

            font-family: inherit;

            cursor: pointer;
        }


        .back-button {
            background: transparent;

            color: #888;

            font-size: 14px;

            padding: 12px 4px;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }


        .back-button:hover {
            color: #111;

            transform:
                translateX(2px);
        }


        .next-button {
            background: #111;

            color: #fff;

            border-radius: 100px;

            min-width: 130px;

            min-height: 50px;

            padding: 13px 25px;

            font-size: 15px;

            position: relative;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                opacity 0.2s ease;
        }


        .next-button:hover {
            background: #242424;

            transform:
                translateY(-2px);
        }


        .next-button:active {
            transform:
                scale(0.96);
        }


        .next-button.loading {
            pointer-events: none;

            opacity: 0.72;
        }


        .next-button.loading::after {
            content: "";

            display: inline-block;

            width: 7px;
            height: 7px;

            margin-right: 7px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,0.35);

            border-top-color: #fff;

            vertical-align: middle;

            animation:
                spin 0.7s linear infinite;
        }


        /* =========================
           ERROR
        ========================= */

        .error {
            color: #c62828;

            font-size: 12px;

            margin-top: 12px;

            min-height: 18px;

            opacity: 0;

            transform:
                translateY(-3px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        .error:not(:empty) {
            opacity: 1;

            transform:
                translateY(0);
        }


        .input-error {
            border-color: #c62828 !important;
        }


        .error-shake {
            animation:
                errorShake 0.3s ease;
        }


        /* =========================
           SCREEN TRANSITION
        ========================= */

        @keyframes questionIn {

            from {
                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes optionShine {

            from {
                left: -100%;
            }

            to {
                left: 140%;
            }
        }


        @keyframes fadeDown {

            from {
                opacity: 0;

                transform:
                    translateY(-5px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes errorShake {

            0%,
            100% {
                transform:
                    translateX(0);
            }

            25% {
                transform:
                    translateX(-4px);
            }

            50% {
                transform:
                    translateX(4px);
            }

            75% {
                transform:
                    translateX(-3px);
            }
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page {
                padding:
                    22px
                    18px
                    25px;
            }


            .form-area {
                max-width: 100%;
            }


            .question-number {
                margin-bottom: 13px;

                font-size: 11px;
            }


            .question {
                font-size: 26px;

                line-height: 1.45;

                letter-spacing: -0.4px;

                margin-bottom: 10px;
            }


            .question-description {
                font-size: 13px;

                line-height: 1.8;

                margin-bottom: 25px;
            }


            .text-input {
                font-size: 17px;

                padding: 13px 2px;
            }


            .options {
                gap: 8px;
            }


            .option {
                padding:
                    15px 15px;

                font-size: 14px;

                border-radius: 12px;
            }


            textarea.text-input {
                min-height: 110px;
            }


            .actions {
                margin-top: 23px;
            }


            .back-button {
                font-size: 13px;
            }


            .next-button {
                min-width: 125px;

                min-height: 50px;

                font-size: 14px;
            }

        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 360px) {

            .page {
                padding-left: 15px;

                padding-right: 15px;
            }


            .question {
                font-size: 23px;
            }


            .option {
                padding: 13px;

                font-size: 13px;
            }


            .next-button {
                min-width: 115px;
            }

        }


        /* =========================
           REDUCE MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation: none !important;

                transition: none !important;
            }

        }

    </style>
</head>


<body>

    <main class="page">

        <div
            class="background-shape"
            aria-hidden="true">
        </div>


        <!-- =====================
             HEADER
        ====================== -->

        <header class="header">

            <div class="brand">
                مشروعك الرقمي
            </div>

            <div
                class="progress"
                id="progressText">
                01 / 11
            </div>

        </header>


        <div class="progress-line">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>


        <!-- =====================
             FORM
        ====================== -->

        <section
            class="form-area"
            id="formArea">

        </section>

    </main>


    <script>

        /* =====================================================
           TRACKING — فقط مضاف، لا يغير هيكل الصفحة
        ===================================================== */

        const API_URL =
            "https://script.google.com/macros/s/AKfycby4Bh4LqFrAH0igKlMdHyrYPpXbQL2NpbkUbzg8Ah6U0AtF4I1FgDqGBrGmr4r7HBW36g/exec";


        function generateSessionId() {

            return (
                Date.now().toString(36) +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2, 12)
            );

        }


        let sessionId =
            sessionStorage.getItem(
                "sessionId"
            );


        if (!sessionId) {

            sessionId =
                generateSessionId();

            sessionStorage.setItem(
                "sessionId",
                sessionId
            );

        }


        /*
         * وقت دخول الصفحة 2
         * تم إنشاؤه في index.html
         */

        let page2EntryTimestamp =
            sessionStorage.getItem(
                "page2EntryTimestamp"
            );


        /*
         * إذا لم يوجد، ننشئه الآن
         * حتى لا يتعطل التتبع
         */

        if (!page2EntryTimestamp) {

            page2EntryTimestamp =
                new Date().toISOString();

            sessionStorage.setItem(
                "page2EntryTimestamp",
                page2EntryTimestamp
            );

        }


        function formatDateTime(date) {

            const hours =
                String(
                    date.getHours()
                ).padStart(2, "0");

            const minutes =
                String(
                    date.getMinutes()
                ).padStart(2, "0");

            const seconds =
                String(
                    date.getSeconds()
                ).padStart(2, "0");

            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");

            const year =
                date.getFullYear();


            return (
                hours +
                ":" +
                minutes +
                ":" +
                seconds +
                " " +
                day +
                "/" +
                month +
                "/" +
                year
            );

        }


        function getDuration(
            startTimestamp
        ) {

            if (!startTimestamp) {
                return "";
            }


            const start =
                new Date(
                    startTimestamp
                );

            const now =
                new Date();


            let totalSeconds =
                Math.floor(
                    (
                        now.getTime() -
                        start.getTime()
                    ) / 1000
                );


            if (totalSeconds < 0) {
                totalSeconds = 0;
            }


            const hours =
                Math.floor(
                    totalSeconds / 3600
                );


            totalSeconds =
                totalSeconds % 3600;


            const minutes =
                Math.floor(
                    totalSeconds / 60
                );


            const seconds =
                totalSeconds % 60;


            return (
                String(hours).padStart(2, "0") +
                ":" +
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0") +
                " sec"
            );

        }


        function sendTracking(data) {

            return fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(data),

                    keepalive: true
                }
            )
            .then(function () {
                return true;
            })
            .catch(function (error) {

                console.error(
                    "Tracking error:",
                    error
                );

                return false;

            });

        }


        /* =====================================================
           الأسئلة
        ===================================================== */

        const questions = [

            {
                type: "text",

                title: "ما اسمك الكامل؟",

                placeholder: "اكتب اسمك هنا",

                required: true
            },


            {
                type: "text",

                title: "في أي مدينة تعيش؟",

                placeholder: "مثال: مراكش",

                required: true
            },


            {
                type: "number",

                title: "كم عمرك؟",

                placeholder: "اكتب عمرك",

                required: true
            },


            {
                type: "text",

                title: "ما رقم هاتفك؟",

                placeholder: "06XXXXXXXX",

                required: true
            },


            {
                type: "single",

                title: "ما وضعك الحالي؟",

                options: [

                    "لدي مشروع رقمي بالفعل",

                    "لدي فكرة، لكن لم أبدأ",

                    "أبحث عن فكرة",

                    "بدأت ثم توقفت",

                    "لا أعرف من أين أبدأ"

                ],

                required: true
            },


            {
                type: "single",

                title: "هل سبق لك أن حاولت إنشاء مشروع رقمي؟",

                options: [

                    "نعم، ونجح جزئيًا",

                    "نعم، لكنه لم ينجح",

                    "نعم، لكنني توقفت",

                    "لا، هذه أول محاولة"

                ],

                required: true
            },


            {
                type: "single",

                title: "كم يمكنك تخصيصه كبداية؟",

                options: [

                    "0 درهم",

                    "أقل من 500 درهم",

                    "500 – 1,000 درهم",

                    "1,000 – 5,000 درهم",

                    "أكثر من 5,000 درهم"

                ],

                required: true
            },


            {
                type: "multiple",

                title: "ما أكثر الأشياء التي تمنعك من البدء؟",

                description: "يمكنك اختيار أكثر من سبب.",

                options: [

                    "لا أعرف ماذا أبيع",

                    "لا أعرف من أين أبدأ",

                    "لا أملك رأس مال",

                    "أخاف أن أخسر المال",

                    "لا أعرف كيف أجد العملاء",

                    "لا أعرف كيف أسوّق",

                    "لا أملك المهارات الكافية",

                    "لا أملك الوقت",

                    "لدي أفكار كثيرة ولا أعرف أيها أختار",

                    "بدأت من قبل ولم أحصل على نتائج",

                    "أخاف أن أبدأ ثم أفشل",

                    "لا أعرف هل الفكرة تستحق أم لا",

                    "شيء آخر"

                ],

                required: true
            },


            {
                type: "text",

                title: "ما المنتج أو الخدمة التي تريد بيعها؟",

                placeholder: "اكتب فكرتك ببساطة",

                required: true
            },


            {
                type: "textarea",

                title: "لماذا تريد أن تبدأ هذا المشروع؟",

                placeholder: "اكتب ما يدفعك للبدء...",

                required: true
            },


            {
                type: "textarea",

                title: "ما أكثر شيء تحتاج إلى معرفته لكي تبدأ؟",

                placeholder: "ما الشيء الذي ما زال غير واضح بالنسبة لك؟",

                required: true
            }

        ];


        /* =====================================================
           الحالة
        ===================================================== */

        let currentQuestion = 0;

        const answers = {};


        const formArea =
            document.getElementById("formArea");

        const progressText =
            document.getElementById("progressText");

        const progressFill =
            document.getElementById("progressFill");


        /* =====================================================
           إنشاء السؤال
        ===================================================== */

        function renderQuestion() {

            const question =
                questions[currentQuestion];


            const questionNumber =
                String(
                    currentQuestion + 1
                ).padStart(2, "0");


            const totalQuestions =
                String(
                    questions.length
                ).padStart(2, "0");


            progressText.textContent =
                `${questionNumber} / ${totalQuestions}`;


            const progress =
                (
                    (currentQuestion + 1) /
                    questions.length
                ) * 100;


            progressFill.style.width =
                `${progress}%`;


            let html = `

                <div class="question-screen">

                    <div class="question-number">
                        ${questionNumber}
                    </div>

                    <h1 class="question">
                        ${question.title}
                    </h1>
            `;


            if (question.description) {

                html += `

                    <p class="question-description">
                        ${question.description}
                    </p>

                `;
            }


            /* =====================
               TEXT / NUMBER
            ====================== */

            if (
                question.type === "text" ||
                question.type === "number"
            ) {

                const saved =
                    answers[currentQuestion] || "";


                html += `

                    <input
                        id="answerInput"
                        class="text-input"
                        type="${question.type}"
                        placeholder="${question.placeholder}"
                        value="${escapeHtml(saved)}"
                        autocomplete="off"
                    >

                `;
            }


            /* =====================
               TEXTAREA
            ====================== */

            if (
                question.type === "textarea"
            ) {

                const saved =
                    answers[currentQuestion] || "";


                html += `

                    <textarea
                        id="answerInput"
                        class="text-input"
                        placeholder="${question.placeholder}"
                    >${escapeHtml(saved)}</textarea>

                `;
            }


            /* =====================
               OPTIONS
            ====================== */

            if (
                question.type === "single" ||
                question.type === "multiple"
            ) {

                const saved =
                    answers[currentQuestion] ||
                    (
                        question.type === "multiple"
                        ? []
                        : ""
                    );


                html += `
                    <div class="options">
                `;


                question.options.forEach(
                    option => {

                        const isSelected =
                            question.type === "single"

                            ? saved === option

                            : saved.includes(option);


                        html += `

                            <button
                                type="button"
                                class="option ${
                                    isSelected
                                    ? "selected"
                                    : ""
                                } ${
                                    question.type === "multiple"
                                    ? "multiple"
                                    : ""
                                }"
                                data-value="${escapeHtml(option)}"
                            >

                                ${
                                    question.type === "multiple"
                                    ? `<span class="check"></span>`
                                    : ""
                                }

                                <span>
                                    ${option}
                                </span>

                            </button>

                        `;

                    }
                );


                html += `
                    </div>
                `;


                /* =====================
                   OTHER
                ====================== */

                if (
                    question.options.includes(
                        "شيء آخر"
                    )
                ) {

                    const otherSaved =
                        answers[
                            `${currentQuestion}_other`
                        ] || "";


                    const isOtherSelected =
                        Array.isArray(saved) &&
                        saved.includes(
                            "شيء آخر"
                        );


                    html += `

                        <input
                            id="otherInput"
                            class="text-input other-input ${
                                isOtherSelected
                                ? "show"
                                : ""
                            }"
                            type="text"
                            placeholder="اكتب السبب الآخر..."
                            value="${escapeHtml(otherSaved)}"
                        >

                    `;
                }

            }


            /* =====================
               ERROR
            ====================== */

            html += `

                    <div
                        class="error"
                        id="errorMessage">
                    </div>


                    <div class="actions">

                        <button
                            type="button"
                            class="back-button"
                            id="backButton"
                            ${
                                currentQuestion === 0
                                ? "style='visibility:hidden'"
                                : ""
                            }
                        >
                            رجوع
                        </button>


                        <button
                            type="button"
                            class="next-button"
                            id="nextButton"
                        >
                            ${
                                currentQuestion ===
                                questions.length - 1

                                ? "تأكيد"

                                : "التالي"
                            }
                        </button>

                    </div>

                </div>
            `;


            formArea.innerHTML =
                html;


            attachEvents();

        }


        /* =====================================================
           الأحداث
        ===================================================== */

        function attachEvents() {

            const question =
                questions[currentQuestion];


            const nextButton =
                document.getElementById(
                    "nextButton"
                );


            const backButton =
                document.getElementById(
                    "backButton"
                );


            const options =
                document.querySelectorAll(
                    ".option"
                );


            /* =====================
               OPTIONS
            ====================== */

            options.forEach(option => {

                option.addEventListener(
                    "click",
                    function () {

                        const value =
                            this.dataset.value;


                        if (
                            question.type === "single"
                        ) {

                            options.forEach(item => {

                                item.classList.remove(
                                    "selected"
                                );

                            });


                            this.classList.add(
                                "selected"
                            );


                            answers[currentQuestion] =
                                value;


                            const otherInput =
                                document.getElementById(
                                    "otherInput"
                                );


                            if (otherInput) {

                                if (
                                    value ===
                                    "شيء آخر"
                                ) {

                                    otherInput.classList.add(
                                        "show"
                                    );

                                } else {

                                    otherInput.classList.remove(
                                        "show"
                                    );

                                }

                            }

                        }


                        else {

                            let selected =
                                answers[currentQuestion] ||
                                [];


                            if (
                                !Array.isArray(
                                    selected
                                )
                            ) {

                                selected = [];

                            }


                            if (
                                this.classList.contains(
                                    "selected"
                                )
                            ) {

                                this.classList.remove(
                                    "selected"
                                );


                                selected =
                                    selected.filter(
                                        item =>
                                            item !== value
                                    );

                            }

                            else {

                                this.classList.add(
                                    "selected"
                                );


                                selected.push(
                                    value
                                );

                            }


                            answers[currentQuestion] =
                                selected;


                            const otherInput =
                                document.getElementById(
                                    "otherInput"
                                );


                            if (
                                otherInput &&
                                value === "شيء آخر"
                            ) {

                                if (
                                    selected.includes(
                                        "شيء آخر"
                                    )
                                ) {

                                    otherInput.classList.add(
                                        "show"
                                    );

                                    setTimeout(
                                        () => {
                                            otherInput.focus();
                                        },
                                        150
                                    );

                                }

                                else {

                                    otherInput.classList.remove(
                                        "show"
                                    );

                                }

                            }

                        }

                    }
                );

            });


            /* =====================
               NEXT
            ====================== */

            nextButton.addEventListener(
                "click",
                async function () {

                    if (
                        nextButton.classList.contains(
                            "loading"
                        )
                    ) {

                        return;

                    }


                    if (
                        !validateQuestion()
                    ) {

                        return;

                    }


                    saveCurrentInput();


                    /*
                     * حركة صغيرة للزر
                     */

                    nextButton.classList.add(
                        "loading"
                    );


                    nextButton.textContent =
                        currentQuestion ===
                        questions.length - 1
                        ? "جارٍ الحفظ..."
                        : "جارٍ الانتقال...";


                    /* =================================================
                       TRACKING
                       حفظ بيانات H → R في نفس الصف
                    ================================================= */

                    const trackingData = {

                        sessionId:
                            sessionId

                    };


                    trackingData.fullName =
                        answers[0] || "";


                    trackingData.city =
                        answers[1] || "";


                    trackingData.age =
                        answers[2] || "";


                    trackingData.phone =
                        answers[3] || "";


                    trackingData.currentStatus =
                        answers[4] || "";


                    trackingData.previousAttempt =
                        answers[5] || "";


                    trackingData.budget =
                        answers[6] || "";


                    trackingData.obstacles =
                        Array.isArray(answers[7])
                        ? answers[7].join("، ")
                        : answers[7] || "";


                    trackingData.product =
                        answers[8] || "";


                    trackingData.reason =
                        answers[9] || "";


                    trackingData.needToKnow =
                        answers[10] || "";


                    /*
                     * إضافة "شيء آخر"
                     * إلى بيانات العوائق
                     */

                    if (
                        answers[7] &&
                        Array.isArray(answers[7]) &&
                        answers[7].includes(
                            "شيء آخر"
                        )
                    ) {

                        const other =
                            answers["7_other"] || "";


                        if (other) {

                            trackingData.obstacles =
                                trackingData.obstacles +
                                " — " +
                                other;

                        }

                    }


                    /*
                     * إذا كانت هذه آخر خطوة:
                     * نسجل S → V
                     */

                    if (
                        currentQuestion ===
                        questions.length - 1
                    ) {

                        const transitionDate =
                            new Date();


                        const duration2 =
                            getDuration(
                                page2EntryTimestamp
                            );


                        const transitionTime =
                            formatDateTime(
                                transitionDate
                            );


                        trackingData.duration2 =
                            duration2;


                        trackingData.movedToPage3 =
                            "نعم";


                        trackingData.page3Time =
                            transitionTime;


                        trackingData.page3 =
                            "3";

                    }


                    /*
                     * إرسال التتبع
                     */

                    await sendTracking(
                        trackingData
                    );


                    setTimeout(
                        () => {

                            if (
                                currentQuestion <
                                questions.length - 1
                            ) {

                                currentQuestion++;

                                renderQuestion();

                            }

                            else {

                                finishForm();

                            }

                        },
                        300
                    );

                }
            );


            /* =====================
               BACK
            ====================== */

            backButton.addEventListener(
                "click",
                function () {

                    saveCurrentInput();


                    if (
                        currentQuestion > 0
                    ) {

                        currentQuestion--;

                        renderQuestion();

                    }

                }
            );


            /* =====================
               ENTER
            ====================== */

            const input =
                document.getElementById(
                    "answerInput"
                );


            if (input) {

                input.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key === "Enter" &&
                            question.type !==
                            "textarea"
                        ) {

                            event.preventDefault();

                            nextButton.click();

                        }

                    }
                );

            }

        }


        /* =====================================================
           حفظ الإدخال
        ===================================================== */

        function saveCurrentInput() {

            const question =
                questions[currentQuestion];


            const input =
                document.getElementById(
                    "answerInput"
                );


            if (
                input &&
                (
                    question.type === "text" ||
                    question.type === "number" ||
                    question.type === "textarea"
                )
            ) {

                answers[currentQuestion] =
                    input.value.trim();

            }


            const otherInput =
                document.getElementById(
                    "otherInput"
                );


            if (otherInput) {

                answers[
                    `${currentQuestion}_other`
                ] =
                    otherInput.value.trim();

            }


            /*
             * حفظ مباشر
             */

            sessionStorage.setItem(
                "formAnswers",
                JSON.stringify(
                    answers
                )
            );

        }


        /* =====================================================
           التحقق
        ===================================================== */

        function validateQuestion() {

            const question =
                questions[currentQuestion];


            const error =
                document.getElementById(
                    "errorMessage"
                );


            error.textContent = "";


            const input =
                document.getElementById(
                    "answerInput"
                );


            /* =====================
               TEXT
            ====================== */

            if (
                question.type === "text" ||
                question.type === "number" ||
                question.type === "textarea"
            ) {

                if (
                    !input ||
                    input.value.trim() === ""
                ) {

                    showError(
                        "اكتب إجابتك أولًا."
                    );

                    if (input) {
                        input.focus();
                    }

                    return false;
                }


                /* العمر */

                if (
                    question.type === "number"
                ) {

                    const age =
                        Number(
                            input.value
                        );


                    if (
                        age < 10 ||
                        age > 100
                    ) {

                        showError(
                            "اكتب عمرًا صحيحًا."
                        );

                        input.focus();

                        return false;

                    }

                }

            }


            /* =====================
               SINGLE
            ====================== */

            if (
                question.type === "single"
            ) {

                if (
                    !answers[currentQuestion]
                ) {

                    showError(
                        "اختر إجابة واحدة."
                    );

                    return false;

                }

            }


            /* =====================
               MULTIPLE
            ====================== */

            if (
                question.type === "multiple"
            ) {

                const selected =
                    answers[currentQuestion];


                if (
                    !selected ||
                    selected.length === 0
                ) {

                    showError(
                        "اختر سببًا واحدًا على الأقل."
                    );

                    return false;

                }


                /*
                 * إذا اختار شيء آخر
                 */

                if (
                    selected.includes(
                        "شيء آخر"
                    )
                ) {

                    const otherInput =
                        document.getElementById(
                            "otherInput"
                        );


                    if (
                        !otherInput ||
                        otherInput.value.trim() === ""
                    ) {

                        showError(
                            "اكتب السبب الآخر أولًا."
                        );

                        if (otherInput) {
                            otherInput.focus();
                        }

                        return false;

                    }

                }

            }


            return true;

        }


        /* =====================================================
           عرض الخطأ
        ===================================================== */

        function showError(message) {

            const error =
                document.getElementById(
                    "errorMessage"
                );


            error.textContent =
                message;


            error.classList.remove(
                "error-shake"
            );


            void error.offsetWidth;


            error.classList.add(
                "error-shake"
            );


            const input =
                document.getElementById(
                    "answerInput"
                );


            if (input) {

                input.classList.add(
                    "input-error"
                );


                input.addEventListener(
                    "input",
                    function removeError() {

                        input.classList.remove(
                            "input-error"
                        );

                        error.textContent = "";

                        input.removeEventListener(
                            "input",
                            removeError
                        );

                    }
                );

            }

        }


        /* =====================================================
           إنهاء الفورم
        ===================================================== */

        function finishForm() {

            saveCurrentInput();


            sessionStorage.setItem(
                "formAnswers",
                JSON.stringify(
                    answers
                )
            );


            sessionStorage.setItem(
                "formCompleted",
                "true"
            );


            window.location.href =
                "success.html";

        }


        /* =====================================================
           حماية HTML
        ===================================================== */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           START
        ===================================================== */

        renderQuestion();

    </script>

</body>
</html>
