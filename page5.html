<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>نكمل | ELIT MAN</title>


<style>

/* ==================================================
   RESET
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* ==================================================
   BODY
================================================== */

body {

    min-height: 100vh;

    font-family:
        Arial,
        "Tahoma",
        sans-serif;

    background: #fafafa;

    color: #111;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 22px;

    overflow: hidden;
}


/* ==================================================
   MAIN
================================================== */

.container {

    width: 100%;

    max-width: 430px;

    min-height: 620px;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;
}


/* ==================================================
   BRAND — TOP
================================================== */

.brand {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding: 8px 17px;

    border: 1px solid #e6e6e6;

    border-radius: 30px;

    background: rgba(255,255,255,.5);

    font-size: 12px;

    letter-spacing: 1px;

    color: #222;

    flex-shrink: 0;

    animation:
        brandIn .8s ease both;
}


/* ==================================================
   UPPER PSYCHOLOGICAL SPACE
================================================== */

.upper-space {

    flex: 1;

    min-height: 105px;
}


/* ==================================================
   CENTER MESSAGE
================================================== */

.message-area {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


/* ==================================================
   SMALL LINE
================================================== */

.small-line {

    font-size: 12px;

    color: #999;

    margin-bottom: 16px;

    opacity: 0;

    animation:
        fadeUp .7s .2s ease forwards;
}


/* ==================================================
   MAIN MESSAGE
================================================== */

.main-line {

    font-size: 27px;

    font-weight: 400;

    line-height: 1.55;

    color: #111;

    opacity: 0;

    animation:
        fadeUp .8s .35s ease forwards;
}


.main-line strong {

    font-weight: 600;

    position: relative;
}


/* خط نفسي خفيف */

.main-line strong::after {

    content: "";

    position: absolute;

    right: 4%;

    left: 4%;

    bottom: -5px;

    height: 1px;

    background: #111;

    opacity: .12;

    transform:
        scaleX(0);

    animation:
        lineReveal .8s 1s ease forwards;
}


/* ==================================================
   SUPPORTING MESSAGE
================================================== */

.support-line {

    max-width: 295px;

    margin-top: 21px;

    font-size: 13px;

    line-height: 1.9;

    color: #777;

    opacity: 0;

    animation:
        fadeUp .8s .55s ease forwards;
}


/* ==================================================
   LOWER PSYCHOLOGICAL SPACE
================================================== */

.lower-space {

    flex: 1;

    min-height: 105px;
}


/* ==================================================
   BUTTON
================================================== */

.button-area {

    width: 100%;

    flex-shrink: 0;

    opacity: 0;

    animation:
        buttonIn .8s .75s ease forwards;
}


.main-button {

    width: 100%;

    height: 54px;

    border: none;

    border-radius: 16px;

    background: #111;

    color: #fff;

    font-size: 14px;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


.main-button:active {

    transform:
        scale(.985);

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);
}


/* ==================================================
   MICRO LINE
================================================== */

.micro-line {

    margin-top: 14px;

    font-size: 10px;

    color: #aaa;

    opacity: 0;

    animation:
        fadeUp .7s 1s ease forwards;
}


/* ==================================================
   AMBIENT
================================================== */

.ambient {

    position: fixed;

    width: 360px;

    height: 360px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,0,0,.025),
            transparent 68%
        );

    filter: blur(12px);

    pointer-events: none;

    animation:
        breathe 8s ease-in-out infinite alternate;
}


/* ==================================================
   ANIMATIONS
================================================== */

@keyframes brandIn {

    from {

        opacity: 0;

        transform:
            translateY(-8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }
}


@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(9px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }
}


@keyframes buttonIn {

    from {

        opacity: 0;

        transform:
            translateY(12px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }
}


@keyframes lineReveal {

    to {

        transform:
            scaleX(1);

    }
}


@keyframes breathe {

    from {

        transform:
            translate(
                -15px,
                -8px
            );

    }

    to {

        transform:
            translate(
                15px,
                10px
            );

    }

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width:480px) {

    .container {

        min-height: 590px;

    }


    .upper-space {

        min-height: 85px;

    }


    .lower-space {

        min-height: 85px;

    }


    .main-line {

        font-size: 24px;

    }


    .support-line {

        font-size: 12px;

        max-width: 275px;

    }

}

</style>

</head>


<body>


<div class="ambient"></div>


<div class="container">


    <!-- ==================================================
         TOP
    ================================================== -->

    <div class="brand">

        ELIT MAN

    </div>


    <!-- ==================================================
         PSYCHOLOGICAL SPACE
    ================================================== -->

    <div class="upper-space"></div>


    <!-- ==================================================
         CENTER
    ================================================== -->

    <div class="message-area">


        <div class="small-line">

            الآن الصورة أوضح...

        </div>


        <div class="main-line">

            أنت لا تبحث عن
            <strong>أي عطر</strong>

        </div>


        <div class="support-line">

            أنت تبحث عن شيء يتوافق
            مع السبب الذي جعلك تختاره من البداية.

        </div>


    </div>


    <!-- ==================================================
         PSYCHOLOGICAL SPACE
    ================================================== -->

    <div class="lower-space"></div>


    <!-- ==================================================
         BOTTOM
    ================================================== -->

    <div class="button-area">


        <button
            class="main-button"
            id="continueButton"
        >

            نكمل ←

        </button>


        <div class="micro-line">

            من هنا نقترب أكثر

        </div>


    </div>


</div>



<script>

/* ==================================================
   TRACKING URL
================================================== */

const TRACKING_URL =
    "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


/* ==================================================
   CLIENT ID
   نفس العميل يبقى معروفًا بين الجلسات
================================================== */

const CLIENT_KEY =
    "closing_layer_client_id";

let clientId =
    localStorage.getItem(CLIENT_KEY);


if (!clientId) {

    clientId =
        "CL-" +
        crypto.randomUUID();

    localStorage.setItem(
        CLIENT_KEY,
        clientId
    );

}


/* ==================================================
   SESSION ID
   نفس الجلسة تبقى واحدة بين صفحات الرحلة
================================================== */

const SESSION_KEY =
    "closing_layer_session_id";

const LAST_SESSION_KEY =
    "closing_layer_last_session_id";


let sessionId =
    sessionStorage.getItem(SESSION_KEY);

let isNewSession = false;


if (!sessionId) {

    sessionId =
        "S-" +
        crypto.randomUUID();

    sessionStorage.setItem(
        SESSION_KEY,
        sessionId
    );

    isNewSession = true;

}


/* ==================================================
   RETURNED LATER
================================================== */

const previousSessionId =
    localStorage.getItem(
        LAST_SESSION_KEY
    );


const returnedLater =
    isNewSession &&
    previousSessionId &&
    previousSessionId !== sessionId;


localStorage.setItem(
    LAST_SESSION_KEY,
    sessionId
);


/* ==================================================
   CURRENT PAGE
================================================== */

const CURRENT_PAGE =
    "الصفحة 5";


const pageEnteredAt =
    Date.now();


let pageExitSent = false;


/* ==================================================
   U — FULL PATH EXIT
   تسجيل الصفحة التي خرج منها الزائر لحظيًا
================================================== */

let pathExitSent = false;


function sendPathExit() {

    if (pathExitSent) {
        return;
    }

    pathExitSent = true;


    const payload = {

        client_id:
            clientId,

        session_id:
            sessionId,

        event:
            "path_page_exit",

        page:
            CURRENT_PAGE,

        path_page:
            CURRENT_PAGE,

        timestamp:
            new Date().toISOString()

    };


    const body =
        JSON.stringify(payload);


    try {

        if (navigator.sendBeacon) {

            const blob =
                new Blob(
                    [
                        body
                    ],
                    {
                        type:
                            "text/plain;charset=UTF-8"
                    }
                );


            navigator.sendBeacon(
                TRACKING_URL,
                blob
            );

            return;

        }

    }

    catch (error) {}


    fetch(
        TRACKING_URL,
        {

            method:
                "POST",

            headers: {
                "Content-Type":
                    "text/plain;charset=UTF-8"
            },

            body:
                body,

            mode:
                "no-cors",

            keepalive:
                true,

            cache:
                "no-store"

        }
    )
    .catch(
        function () {}
    );

}


/* ==================================================
   SEND TRACKING
================================================== */

function sendTracking(data) {

    const payload = {

        client_id:
            clientId,

        session_id:
            sessionId,

        ...data

    };


    fetch(

        TRACKING_URL,

        {

            method:
                "POST",

            headers:
                {
                    "Content-Type":
                        "text/plain;charset=UTF-8"
                },

            body:
                JSON.stringify(payload),

            mode:
                "no-cors",

            keepalive:
                true,

            cache:
                "no-store"

        }

    ).catch(function () {});

}


/* ==================================================
   EXISTING CONTEXT
   لا ننشئ بيانات جديدة هنا.
   فقط نحمل ما اختاره العميل سابقًا.
================================================== */

const selectedProduct =
    localStorage.getItem(
        "selected_product"
    ) || "";


const selectedIntent =
    localStorage.getItem(
        "selected_intent"
    ) || "";


function getSelectedProducts() {

    try {

        const stored =
            localStorage.getItem(
                "selected_products"
            );


        if (!stored) {

            return [];

        }


        const products =
            JSON.parse(stored);


        return Array.isArray(products)
            ? products
            : [];


    } catch (error) {

        return [];

    }

}


const selectedProducts =
    getSelectedProducts();


/* ==================================================
   SESSION START
================================================== */

if (isNewSession) {

    sendTracking({

        event:
            "session_start",

        page:
            CURRENT_PAGE,

        path:
            CURRENT_PAGE,

        returned_later:
            returnedLater
                ? "نعم"
                : "لا",

        timestamp:
            new Date().toISOString()

    });

}


/* ==================================================
   PAGE VIEW
================================================== */

sendTracking({

    event:
        "page_view",

    page:
        CURRENT_PAGE,

    path:
        CURRENT_PAGE,

    selected_product:
        selectedProduct,

    selected_intent:
        selectedIntent,

    selected_products:
        selectedProducts
            .map(product => product.name || product.id)
            .join(", "),

    selected_count:
        selectedProducts.length,

    entered_at:
        new Date().toISOString()

});


/* ==================================================
   BACK NAVIGATION
================================================== */

window.addEventListener(
    "pageshow",
    function () {

        const navigation =
            performance.getEntriesByType(
                "navigation"
            )[0];


        if (
            navigation &&
            navigation.type ===
                "back_forward"
        ) {

            sendTracking({

                event:
                    "back_navigation",

                page:
                    CURRENT_PAGE,

                path:
                    CURRENT_PAGE,

                went_back:
                    true,

                back_count:
                    1,

                interaction:
                    "رجع إلى الصفحة 5",

                timestamp:
                    new Date().toISOString()

            });

        }

    }
);


/* ==================================================
   PAGE EXIT
================================================== */

function sendPageExit() {

    if (pageExitSent) {

        return;

    }


    pageExitSent = true;


    const durationMs =
        Date.now() -
        pageEnteredAt;


    const durationSeconds =
        Math.round(
            durationMs / 1000
        );


    sendTracking({

        event:
            "page_exit",

        page:
            CURRENT_PAGE,

        path:
            CURRENT_PAGE,

        duration:
            durationSeconds,

        timestamp:
            new Date().toISOString()

    });

}


/* ==================================================
   CONTINUE BUTTON
================================================== */

const continueButton =
    document.getElementById(
        "continueButton"
    );


continueButton.addEventListener(
    "click",
    function () {

        /* ==========================================
           OBSERVABLE INTERACTION
        ========================================== */

        sendTracking({

            event:
                "interaction",

            page:
                CURRENT_PAGE,

            path:
                CURRENT_PAGE,

            interaction:
                "ضغط على زر: نكمل",

            timestamp:
                new Date().toISOString()

        });


        /* ==========================================
           COMPLETION
        ========================================== */

        sendTracking({

            event:
                "page5_completed",

            page:
                CURRENT_PAGE,

            path:
                CURRENT_PAGE,

            completed:
                true,

            next_page:
                "الصفحة 6",

            timestamp:
                new Date().toISOString()

        });


        /* ==========================================
           U — تسجيل الخروج قبل الانتقال
        ========================================== */

        sendPathExit();


        /* ==========================================
           PAGE EXIT
        ========================================== */

        sendPageExit();


        /* ==========================================
           NEXT PAGE
        ========================================== */

        setTimeout(
            function () {

                window.location.href =
                    "page6.html";

            },
            250
        );

    }
);


/* ==================================================
   PAGE HIDE
================================================== */

window.addEventListener(
    "pagehide",
    function () {

        sendPathExit();

        sendPageExit();

    }
);

</script>


</body>

</html>
