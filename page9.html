<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نكمل من اختيارك</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;

      padding: 0 24px 30px;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 25px;
      color: #111;
    }


    /* =========================
       INTRO
    ========================= */

    .intro {
      margin-top: 42px;
      text-align: center;
    }

    .intro p {
      font-size: 15px;
      color: #777;
      line-height: 1.8;
    }


    /* =========================
       PRICE
    ========================= */

    .price-area {
      width: 100%;
      height: 122px;

      margin-top: 28px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      flex-shrink: 0;
    }

    .price-label {
      height: 26px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      color: #777;

      margin-bottom: 11px;
    }

    .price-display {
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      direction: ltr;
      gap: 4px;
    }

    .digit-box {
      position: relative;

      width: 40px;
      height: 56px;

      overflow: hidden;

      border-radius: 9px;

      background: #f4f4f4;

      border: 1px solid #dedede;

      box-shadow:
        inset 0 2px 5px rgba(0,0,0,.07),
        0 2px 5px rgba(0,0,0,.04);
    }

    .digit-box::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 16px;

      z-index: 5;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(244,244,244,1),
          rgba(244,244,244,0)
        );
    }

    .digit-box::after {
      content: "";

      position: absolute;

      bottom: 0;
      left: 0;

      width: 100%;
      height: 16px;

      z-index: 5;

      pointer-events: none;

      background:
        linear-gradient(
          to top,
          rgba(244,244,244,1),
          rgba(244,244,244,0)
        );
    }

    .digit {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 35px;
      line-height: 1;
      font-weight: 700;

      color: #111;

      opacity: 1;
    }

    .currency {
      margin-left: 5px;

      font-size: 18px;
      font-weight: 600;

      color: #222;

      white-space: nowrap;
    }


    /* =========================
       QUESTION
    ========================= */

    .question {
      margin-top: 34px;
      text-align: center;
    }

    .question h1 {
      font-size: 24px;
      line-height: 1.5;
      font-weight: 700;
    }

    .question p {
      margin-top: 9px;

      font-size: 14px;
      line-height: 1.8;

      color: #777;
    }


    /* =========================
       INPUT
    ========================= */

    .input-area {
      margin-top: 25px;
    }

    .input-area input {
      width: 100%;
      height: 58px;

      border: 1px solid #dedede;
      border-radius: 14px;

      background: #fafafa;

      padding: 0 18px;

      font-size: 18px;

      text-align: center;

      outline: none;

      transition:
        border-color .2s,
        background .2s;
    }

    .input-area input:focus {
      border-color: #111;
      background: #fff;
    }

    .input-area input::placeholder {
      color: #aaa;
    }


    /* =========================
       RESULT
    ========================= */

    .result {
      margin-top: 18px;

      min-height: 76px;

      padding: 16px;

      border-radius: 15px;

      background: #f7f7f7;

      border: 2px solid transparent;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      font-size: 14px;
      line-height: 1.8;

      color: #555;

      transition:
        border-color .2s,
        color .2s,
        background .2s;
    }

    .result.insufficient {
      border-color: #e53935;
      color: #e53935;
      background: #fff5f5;
    }

    .result.sufficient {
      border-color: #2e9d50;
      color: #2e9d50;
      background: #f4fff7;
    }


    /* =========================
       BUTTON
    ========================= */

    .bottom {
      margin-top: auto;
      padding-top: 35px;
    }

    .continue-btn {
      width: 100%;
      height: 56px;

      border: none;
      border-radius: 16px;

      background: #111;
      color: #fff;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform .15s,
        opacity .15s;
    }

    .continue-btn:active {
      transform: scale(.98);
    }

    .continue-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

  </style>
</head>


<body>

  <div class="page">


    <div class="brand">
      ELIT MAN
    </div>


    <div class="intro">

      <p>
        نكمل من اختيارك
      </p>

    </div>


    <!-- =========================
         PRICE
    ========================= -->

    <div class="price-area">

      <div class="price-label">
        هذا سعر المنتجات التي اخترتها
      </div>


      <div
        class="price-display"
        aria-label="ثمن المنتجات التي اخترتها"
      >

        <div class="digit-box">

          <div
            class="digit"
            id="digit1"
          >
            0
          </div>

        </div>


        <div class="digit-box">

          <div
            class="digit"
            id="digit2"
          >
            0
          </div>

        </div>


        <div class="digit-box">

          <div
            class="digit"
            id="digit3"
          >
            0
          </div>

        </div>


        <span class="currency">
          DH
        </span>

      </div>

    </div>


    <!-- =========================
         QUESTION
    ========================= -->

    <div class="question">

      <h1>
        كم لديك الآن؟
      </h1>

      <p>
        اكتب المبلغ الموجود معك الآن.
      </p>

    </div>


    <!-- =========================
         INPUT
    ========================= -->

    <div class="input-area">

      <input
        type="number"
        id="moneyInput"
        inputmode="numeric"
        min="0"
        placeholder="اكتب المبلغ هنا"
        autocomplete="off"
      >

    </div>


    <!-- =========================
         RESULT
    ========================= -->

    <div
      class="result"
      id="result"
    >
      اكتب المبلغ الموجود معك لنكمل.
    </div>


    <!-- =========================
         BUTTON
    ========================= -->

    <div class="bottom">

      <button
        class="continue-btn"
        id="continueBtn"
        disabled
      >
        نكمل ←
      </button>

    </div>

  </div>


  <!-- Tracking -->

  <iframe
    name="trackingFrame"
    style="display:none;"
  ></iframe>


  <script>

    /* =====================================================
       TRACKING URL
    ===================================================== */

    const TRACKING_URL =
      "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


    /* =====================================================
       BROWSER ID
    ===================================================== */

    function getBrowserId() {

      let id =
        localStorage.getItem(
          "closing_layer_browser_id"
        );


      if (!id) {

        id =
          "browser_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2, 10);


        localStorage.setItem(
          "closing_layer_browser_id",
          id
        );

      }


      return id;

    }


    /* =====================================================
       SEND TRACKING
    ===================================================== */

    function sendTracking(data) {

      try {

        const form =
          document.createElement("form");


        form.method =
          "POST";


        form.action =
          TRACKING_URL;


        form.target =
          "trackingFrame";


        form.style.display =
          "none";


        const payload = {

          browser_id:
            getBrowserId(),

          ...data

        };


        Object.keys(payload).forEach(
          key => {

            const input =
              document.createElement("input");


            input.type =
              "hidden";


            input.name =
              key;


            const value =
              payload[key];


            input.value =
              typeof value === "object"

                ? JSON.stringify(value)

                : String(
                    value === undefined ||
                    value === null
                      ? ""
                      : value
                  );


            form.appendChild(input);

          }
        );


        document.body.appendChild(form);

        form.submit();


        setTimeout(() => {

          if (form.parentNode) {

            form.parentNode.removeChild(form);

          }

        }, 1000);

      }

      catch (error) {

        console.error(
          "Tracking error:",
          error
        );

      }

    }


    /* =====================================================
       READ PRODUCT COUNT FROM PAGE 2
       السعر يعتمد على عدد المنتجات المختارة في الصفحة 2
    ===================================================== */

    const savedProductCount =
      localStorage.getItem(
        "selected_products_count"
      );


    if (
      savedProductCount === null
    ) {

      console.error(
        "selected_products_count is missing."
      );

    }


    const productCount =
      Number(
        savedProductCount
      );


    /* =====================================================
       PRICE TABLE
       السعر مرتبط مباشرة بعدد المنتجات المختارة
    ===================================================== */

    const prices = {

      2: 100,

      3: 129,

      4: 159,

      5: 179,

      6: 199

    };


    /* =====================================================
       GET PRICE FROM PRODUCT COUNT
    ===================================================== */

    const productPrice =
      prices[productCount];


    if (
      productPrice === undefined
    ) {

      console.error(
        "No price exists for product count:",
        productCount
      );

    }


    /* =====================================================
       SAVE THE PRICE
    ===================================================== */

    if (
      productPrice !== undefined
    ) {

      localStorage.setItem(
        "product_price",
        String(productPrice)
      );


      localStorage.setItem(
        "productPrice",
        String(productPrice)
      );

    }


    localStorage.setItem(
      "product_count",
      String(productCount)
    );


    /* =====================================================
       DIGITS
    ===================================================== */

    function setDigit(
      id,
      value
    ) {

      const element =
        document.getElementById(id);


      if (element) {

        element.textContent =
          String(value);

      }

    }


    /* =====================================================
       PRICE REVEAL
    ===================================================== */

    function spinDigit(
      id,
      finalNumber,
      duration,
      delay
    ) {

      setTimeout(() => {

        const start =
          performance.now();


        let lastNumber =
          -1;


        function animate(now) {

          const elapsed =
            now - start;


          const progress =
            Math.min(
              elapsed / duration,
              1
            );


          const eased =
            1 -
            Math.pow(
              1 - progress,
              4
            );


          if (
            progress < 1
          ) {

            const number =
              Math.floor(
                eased * 40
              ) % 10;


            if (
              number !== lastNumber
            ) {

              setDigit(
                id,
                number
              );


              lastNumber =
                number;

            }


            requestAnimationFrame(
              animate
            );

          }

          else {

            setDigit(
              id,
              finalNumber
            );

          }

        }


        requestAnimationFrame(
          animate
        );

      }, delay);

    }


    function revealPrice(
      price
    ) {

      /*
       * لا نسمح بأي حركة إذا لم يوجد سعر.
       */

      if (
        !Number.isFinite(price)
      ) {

        return;

      }


      const digits =
        String(price)
          .padStart(3, "0")
          .split("")
          .map(Number);


      setDigit(
        "digit1",
        0
      );

      setDigit(
        "digit2",
        0
      );

      setDigit(
        "digit3",
        0
      );


      /*
       * توقف متتابع:
       * المئات
       * ثم العشرات
       * ثم الوحدات
       */

      spinDigit(
        "digit1",
        digits[0],
        850,
        0
      );


      spinDigit(
        "digit2",
        digits[1],
        1000,
        250
      );


      spinDigit(
        "digit3",
        digits[2],
        1150,
        500
      );


      /*
       * تأكيد نهائي.
       */

      setTimeout(() => {

        setDigit(
          "digit1",
          digits[0]
        );

        setDigit(
          "digit2",
          digits[1]
        );

        setDigit(
          "digit3",
          digits[2]
        );

      }, 1800);

    }


    /* =====================================================
       MONEY
    ===================================================== */

    const moneyInput =
      document.getElementById(
        "moneyInput"
      );


    const result =
      document.getElementById(
        "result"
      );


    const continueBtn =
      document.getElementById(
        "continueBtn"
      );


    let currentMoney =
      0;


    let financialGap =
      Number(productPrice) -
      currentMoney;


    function calculateMoney() {

      const value =
        Number(
          moneyInput.value
        );


      if (
        !Number.isFinite(value) ||
        value < 0
      ) {

        currentMoney =
          0;


        financialGap =
          Number(productPrice);


        continueBtn.disabled =
          true;


        result.classList.remove(
          "insufficient",
          "sufficient"
        );


        result.textContent =
          "اكتب المبلغ الموجود معك لنكمل.";


        return;

      }


      currentMoney =
        value;


      financialGap =
        Math.max(
          Number(productPrice) -
          currentMoney,
          0
        );


      continueBtn.disabled =
        false;


      if (
        currentMoney >=
        Number(productPrice)
      ) {

        result.classList.remove(
          "insufficient"
        );

        result.classList.add(
          "sufficient"
        );


        result.textContent =
          "المبلغ الموجود معك يكفي لهذا الاختيار.";

      }

      else {

        result.classList.remove(
          "sufficient"
        );

        result.classList.add(
          "insufficient"
        );


        result.textContent =
          "باقي لك " +
          financialGap +
          " DH للوصول إلى المبلغ المطلوب.";

      }

    }


    moneyInput.addEventListener(
      "input",
      calculateMoney
    );


    /* =====================================================
       PAGE VIEW
    ===================================================== */

    sendTracking({

      event:
        "page_view",

      page:
        9,

      product_count:
        productCount,

      product_price:
        productPrice

    });


    /* =====================================================
       START
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        revealPrice(
          productPrice
        );

      }
    );


    /* =====================================================
       CONTINUE
    ===================================================== */

    continueBtn.addEventListener(
      "click",
      () => {

        if (
          continueBtn.disabled
        ) {

          return;

        }


        const now =
          new Date().toISOString();


        /* =================================================
           NEXT PAGE
           أقل من السعر = 13
           نفس السعر أو أكثر = 11
        ================================================= */

        const nextPage =
          currentMoney >=
          Number(productPrice)
            ? 11
            : 13;


        /* =================================================
           SAVE DATA
        ================================================= */

        localStorage.setItem(
          "current_money",
          String(currentMoney)
        );


        localStorage.setItem(
          "financial_gap",
          String(financialGap)
        );


        localStorage.setItem(
          "product_price",
          String(productPrice)
        );


        localStorage.setItem(
          "product_count",
          String(productCount)
        );


        /* =====================
           PAGE 9 COMPLETED
        ===================== */

        sendTracking({

          event:
            "page9_completed",

          page:
            9,

          current_money:
            currentMoney,

          product_count:
            productCount,

          product_price:
            productPrice,

          financial_gap:
            financialGap,

          completed_at:
            now,

          next_page:
            nextPage

        });


        /* =====================
           TRANSITION
        ===================== */

        sendTracking({

          event:
            "page9_to_next",

          from_page:
            9,

          to_page:
            nextPage,

          transitioned:
            "نعم",

          transition_at:
            now

        });


        /* =====================
           GO TO NEXT PAGE
        ===================== */

        window.location.href =
          nextPage === 11
            ? "page11.html"
            : "page10.html";

      }

    );

  </script>

</body>

</html>
