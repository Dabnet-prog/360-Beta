<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سؤال بسيط</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            line-height: 1.5;
            font-weight: 700;
            margin-bottom: 45px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 15px 45px;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s ease;
        }

        button.clicked {
            background: #000000;
            color: #ffffff;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 30px;
            }

            button {
                padding: 13px 30px;
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            هل كل شخص يسأل عن منتج يشتريه؟
        </h1>

        <div class="buttons">

            <button id="yesButton">
                نعم
            </button>

            <button id="noButton">
                لا
            </button>

        </div>

    </div>

    <script>

        const trackerURL =
            "https://script.google.com/macros/s/AKfycbzpcGySNVeu3mKM2ROvO03Z1KUXWLJdGqD2Kw8wtA6A0u8zyZJspy8UBJ5qUtqeXI34gA/exec";


        let sessionId =
            sessionStorage.getItem("session_id");


        if (!sessionId) {

            sessionId =
                Math.random()
                .toString(36)
                .substring(2, 10);

            sessionStorage.setItem(
                "session_id",
                sessionId
            );
        }


        function track(step, answer = "") {

            const params =
                new URLSearchParams({

                    session_id: sessionId,
                    step: step,
                    answer: answer

                });


            fetch(
                trackerURL + "?" + params.toString(),
                {
                    method: "GET",
                    mode: "no-cors",
                    keepalive: true
                }
            );
        }


        // تسجيل دخول الصفحة الأولى
        track("page1_view");


        // نعم
        document
            .getElementById("yesButton")
            .addEventListener("click", function () {

                this.classList.add("clicked");

                track("answer", "yes");

                sessionStorage.setItem(
                    "answer",
                    "yes"
                );

                setTimeout(function () {

                    window.location.href =
                        "page3.html";

                }, 250);

            });


        // لا
        document
            .getElementById("noButton")
            .addEventListener("click", function () {

                this.classList.add("clicked");

                track("answer", "no");

                sessionStorage.setItem(
                    "answer",
                    "no"
                );

                setTimeout(function () {

                    window.location.href =
                        "page2.html";

                }, 250);

            });

    </script>

</body>

</html>
