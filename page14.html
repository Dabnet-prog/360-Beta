<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ELIT MAN</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 45%,
            #ffffff 0%,
            #f8f8f6 45%,
            #f3f3f0 100%
        );

    color:#171717;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    overflow-x:hidden;
}


/* =========================================
   AMBIENT LIGHT
========================================= */

body::before{
    content:"";

    position:fixed;

    width:360px;
    height:360px;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.9),
            rgba(255,255,255,0) 70%
        );

    pointer-events:none;

    animation:
        breathe 8s ease-in-out infinite;
}

@keyframes breathe{

    0%,
    100%{
        opacity:.5;

        transform:
            translate(-50%,-50%)
            scale(.94);
    }

    50%{
        opacity:.9;

        transform:
            translate(-50%,-50%)
            scale(1.07);
    }

}


/* =========================================
   PAGE
========================================= */

.page{
    width:100%;
    max-width:520px;

    min-height:100vh;

    margin:auto;

    padding:
        28px 22px
        24px;

    display:flex;
    flex-direction:column;

    position:relative;

    z-index:2;
}


/* =========================================
   BRAND
========================================= */

.brand{
    align-self:center;

    padding:
        7px 15px;

    border:
        1px solid #deded9;

    border-radius:999px;

    background:
        rgba(255,255,255,.6);

    color:#555;

    font-size:10px;

    font-weight:600;

    letter-spacing:2.2px;

    opacity:0;

    transform:
        translateY(-8px);

    animation:
        fadeDown .8s
        cubic-bezier(.2,.8,.2,1)
        .15s forwards;
}

@keyframes fadeDown{

    to{
        opacity:1;

        transform:
            translateY(0);
    }

}


/* =========================================
   CONTENT
========================================= */

.content{
    flex:1;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        25px 0
        35px;
}


/* =========================================
   INTRO
========================================= */

.intro{
    color:#999;

    font-size:12px;

    margin-bottom:17px;

    opacity:0;

    transform:
        translateY(10px);

    animation:
        fadeUp .8s
        cubic-bezier(.2,.8,.2,1)
        .55s forwards;
}


/* =========================================
   TITLE
========================================= */

h1{
    max-width:360px;

    font-size:28px;

    font-weight:450;

    line-height:1.55;

    letter-spacing:-.8px;

    opacity:0;

    transform:
        translateY(13px)
        scale(.985);

    animation:
        titleIn 1s
        cubic-bezier(.2,.8,.2,1)
        .72s forwards;
}

h1 strong{
    font-weight:780;
}

@keyframes titleIn{

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================
   SELECTED PATH
========================================= */

.path-display{

    margin-top:19px;

    padding:
        8px 15px;

    border:
        1px solid #e2e2dd;

    border-radius:999px;

    background:#fff;

    color:#555;

    font-size:11px;

    opacity:0;

    transform:
        scale(.94)
        translateY(8px);

    animation:
        pathIn .7s
        cubic-bezier(.2,.8,.2,1)
        1.05s forwards;
}

@keyframes pathIn{

    to{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }

}


/* =========================================
   QUESTION AREA
========================================= */

.question-area{

    width:100%;

    max-width:390px;

    margin-top:30px;

    opacity:0;

    transform:
        translateY(15px);

    animation:
        fadeUp .8s
        cubic-bezier(.2,.8,.2,1)
        1.3s forwards;
}

.question{

    font-size:17px;

    font-weight:680;

    line-height:1.7;
}

.hint{

    margin-top:6px;

    color:#999;

    font-size:11px;

    line-height:1.7;
}


/* =========================================
   INPUT
========================================= */

textarea{

    width:100%;

    min-height:125px;

    margin-top:15px;

    padding:16px;

    border:
        1px solid #dcdcd7;

    border-radius:15px;

    outline:none;

    resize:none;

    background:
        rgba(255,255,255,.9);

    color:#171717;

    font-family:inherit;

    font-size:14px;

    line-height:1.8;

    text-align:center;

    transition:
        border .3s ease,
        box-shadow .4s ease,
        transform .3s ease;
}

textarea::placeholder{
    color:#b0b0ad;
}

textarea:focus{

    border-color:#999;

    box-shadow:
        0 0 0 4px
        rgba(0,0,0,.035),
        0 12px 30px
        rgba(0,0,0,.035);

    transform:
        translateY(-1px);
}


/* =========================================
   BOTTOM
========================================= */

.bottom{

    padding-top:18px;

    opacity:0;

    transform:
        translateY(10px);

    animation:
        fadeUp .8s
        cubic-bezier(.2,.8,.2,1)
        1.8s forwards;
}

.next-btn{

    width:100%;

    padding:
        16px 20px;

    border:none;

    border-radius:14px;

    background:#171717;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    opacity:.28;

    transition:
        opacity .35s ease,
        transform .25s ease,
        box-shadow .4s ease;
}

.next-btn.active{
    opacity:1;
}

.next-btn.active:hover{

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.14);
}

.next-btn:active{
    transform:
        scale(.985);
}

.micro{

    margin-top:11px;

    text-align:center;

    color:#aaa;

    font-size:10px;
}


/* =========================================
   ANIMATIONS
========================================= */

@keyframes fadeUp{

    to{
        opacity:1;

        transform:
            translateY(0);
    }

}


/* =========================================
   SMALL SCREENS
========================================= */

@media(max-height:700px){

    .content{

        padding-top:18px;
        padding-bottom:22px;

    }

    h1{
        font-size:24px;
    }

    .question-area{
        margin-top:23px;
    }

    textarea{
        min-height:105px;
    }

}

</style>
</head>


<body>


<!-- =====================================
     TRACKING FRAME
====================================== -->

<iframe
    name="trackingFrame"
    style="display:none;"
></iframe>


<main class="page">


    <!-- =====================================
         BRAND
    ====================================== -->

    <div class="brand">
        ELIT MAN
    </div>


    <!-- =====================================
         CONTENT
    ====================================== -->

    <section class="content">


        <div class="intro">
            الآن نريد أن نفهم اختيارك أكثر.
        </div>


        <h1>
            كيف تتصور أن
            <br>
            <strong>تبدأ بهذا الطريق؟</strong>
        </h1>


        <div
            class="path-display"
            id="pathDisplay"
        >
            الطريق الذي اخترته
        </div>


        <div class="question-area">


            <div
                class="question"
                id="question"
            >
                كيف ستبدأ؟
            </div>


            <div
                class="hint"
                id="hint"
            >
                اكتب ما تفكر فيه بطريقتك.
            </div>


            <textarea
                id="answerInput"
                placeholder="اكتب هنا..."
            ></textarea>


        </div>


    </section>


    <!-- =====================================
         BOTTOM
    ====================================== -->

    <div class="bottom">

        <button
            class="next-btn"
            id="nextBtn"
            disabled
        >
            نكمل ←
        </button>

        <div class="micro">
            لا توجد إجابة صحيحة أو خاطئة
        </div>

    </div>


</main>


<script>

/* =====================================================
   TRACKING CONFIG
===================================================== */

const TRACKING_URL =
    "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


/* =====================================================
   PAGE TIMER
===================================================== */

const startedAt =
    Date.now();


/* =====================================================
   BROWSER ID
===================================================== */

function getBrowserId(){

    let browserId =
        localStorage.getItem(
            "closing_layer_browser_id"
        );


    if(!browserId){

        browserId =
            "browser-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2,10);


        localStorage.setItem(
            "closing_layer_browser_id",
            browserId
        );

    }


    return browserId;

}


/* =====================================================
   SEND TRACKING
===================================================== */

function sendTracking(data){

    try{

        const form =
            document.createElement(
                "form"
            );


        form.method =
            "POST";


        form.action =
            TRACKING_URL;


        form.target =
            "trackingFrame";


        form.style.display =
            "none";


        const payload = {

            browser_id:
                getBrowserId(),

            ...data

        };


        Object.keys(payload)
            .forEach(key => {

                const input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "hidden";


                input.name =
                    key;


                const value =
                    payload[key];


                input.value =
                    typeof value === "object"

                        ? JSON.stringify(
                            value
                        )

                        : String(
                            value === undefined ||
                            value === null
                                ? ""
                                : value
                        );


                form.appendChild(
                    input
                );

            });


        document.body.appendChild(
            form
        );


        form.submit();


        setTimeout(() => {

            if(form.parentNode){

                form.parentNode.removeChild(
                    form
                );

            }

        },1000);

    }
    catch(error){

        console.error(
            "Tracking error:",
            error
        );

    }

}


/* =====================================================
   PAGE 14 ENTRY
===================================================== */

const page14EnteredAt =
    new Date().toISOString();


localStorage.setItem(
    "page14_entered_at",
    page14EnteredAt
);


/* =====================================================
   1. RECOVER PAGE 13 DATA
===================================================== */

let selectedPath =
    localStorage.getItem(
        "selected_financial_path"
    );

let customPath =
    localStorage.getItem(
        "selected_financial_path_text"
    ) || "";


/*
   إذا كان المفتاح الأساسي غير موجود،
   نحاول استرجاعه من decision_state.
*/

if(!selectedPath){

    try{

        const state =
            JSON.parse(
                localStorage.getItem(
                    "decision_state"
                ) || "{}"
            );

        selectedPath =
            state.selected_financial_path
            || null;

        customPath =
            state.selected_financial_path_text
            || customPath
            || "";

    }
    catch(error){

        selectedPath = null;

    }

}


/* =====================================================
   2. ELEMENTS
===================================================== */

const pathDisplay =
    document.getElementById(
        "pathDisplay"
    );

const question =
    document.getElementById(
        "question"
    );

const hint =
    document.getElementById(
        "hint"
    );

const answerInput =
    document.getElementById(
        "answerInput"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );


/* =====================================================
   3. PATH CONFIGURATION
===================================================== */

const pathData = {

    sell_asset: {

        label:
            "نبيع شيئًا",

        question:
            "كيف تتصور أن تبدأ؟",

        hint:
            "ما أول شيء ستقوم به؟"

    },


    ask_person: {

        label:
            "نستعين بشخص",

        question:
            "كيف تتصور أن تقوم بذلك؟",

        hint:
            "من أين ستبدأ؟"

    },


    save_wait: {

        label:
            "ننتظر ونجمعه",

        question:
            "كيف تتصور أن تكمل المبلغ؟",

        hint:
            "ماذا ستفعل خلال هذه الفترة؟"

    },


    other: {

        label:
            customPath ||
            "طريق آخر",

        question:
            "كيف ستبدأ بهذا الطريق؟",

        hint:
            "اشرحه بطريقتك."

    }

};


/* =====================================================
   4. APPLY THE PREVIOUS CHOICE
===================================================== */

const data =
    pathData[selectedPath] ||
    pathData.other;


/*
   إذا لم يكن هناك اختيار محفوظ،
   لا نخترع مسارًا جديدًا.
*/

pathDisplay.textContent =
    data.label;

question.textContent =
    data.question;

hint.textContent =
    data.hint;


/* =====================================================
   TRACK PAGE 14 ENTRY
===================================================== */

sendTracking({

    event:
        "page_view",

    page:
        "page14",

    timestamp:
        page14EnteredAt,

    selected_path:
        selectedPath || "",

    selected_financial_path:
        selectedPath || "",

    selected_financial_path_text:
        customPath,

    financial_path:
        customPath ||
        data.label

});


/* =====================================================
   5. INPUT
===================================================== */

function updateButton(){

    const valid =
        answerInput
            .value
            .trim()
            .length >= 2;


    nextBtn.disabled =
        !valid;


    nextBtn.classList.toggle(
        "active",
        valid
    );

}


answerInput.addEventListener(
    "input",
    updateButton
);


/* =====================================================
   6. SAVE PAGE 14
===================================================== */

nextBtn.addEventListener(
    "click",
    function(){

        const answer =
            answerInput
                .value
                .trim();


        if(answer.length < 2){
            return;
        }


        const timestamp =
            new Date()
                .toISOString();


        const timeOnPage =
            Date.now() -
            startedAt;


        /* =====================================
           RAW DATA
        ====================================== */

        localStorage.setItem(
            "financial_path_explanation",
            answer
        );

        localStorage.setItem(
            "page14_answer",
            answer
        );

        localStorage.setItem(
            "page14_completed_at",
            timestamp
        );


        /* =====================================
           RECOVER DECISION STATE
        ====================================== */

        let state = {};


        try{

            state =
                JSON.parse(
                    localStorage.getItem(
                        "decision_state"
                    ) || "{}"
                );

        }
        catch(error){

            state = {};

        }


        /*
           نعيد حفظ اختيار Page 13
           داخل الحالة المركزية حتى لا يضيع.
        */

        state.selected_financial_path =
            selectedPath;

        state.selected_financial_path_text =
            customPath;

        state.financial_path_explanation =
            answer;

        state.page14_completed =
            true;

        state.page14_completed_at =
            timestamp;


        localStorage.setItem(
            "decision_state",
            JSON.stringify(
                state
            )
        );


        /* =====================================
           EVENT LOG
        ====================================== */

        let events = [];


        try{

            events =
                JSON.parse(
                    localStorage.getItem(
                        "decision_events"
                    ) || "[]"
                );

        }
        catch(error){

            events = [];

        }


        events.push({

            event:
                "financial_path_explained",

            page:
                "page14",

            timestamp:
                timestamp,

            selected_path:
                selectedPath,

            selected_path_text:
                customPath,

            explanation:
                answer

        });


        localStorage.setItem(
            "decision_events",
            JSON.stringify(
                events
            )
        );


        /* =====================================
           SERVER TRACKING
           
           AW = EXPLANATION
        ====================================== */

        sendTracking({

            event:
                "financial_path_explained",

            page:
                "page14",

            timestamp:
                timestamp,

            selected_path:
                selectedPath,

            selected_financial_path:
                selectedPath,

            selected_financial_path_text:
                customPath,

            financial_path:
                customPath,

            path_text:
                customPath,

            financial_path_explanation:
                answer,

            path_explanation:
                answer,

            explanation:
                answer,

            answer_text:
                answer,

            time_on_page:
                timeOnPage

        });


        /* =====================================
           PAGE 14 → PAGE 15
           
           AX / AY / AZ
        ====================================== */

        sendTracking({

            event:
                "page14_completed",

            page:
                "page14",

            timestamp:
                timestamp,

            selected_path:
                selectedPath,

            selected_financial_path:
                selectedPath,

            selected_financial_path_text:
                customPath,

            financial_path:
                customPath,

            financial_path_explanation:
                answer,

            path_explanation:
                answer,

            explanation:
                answer,

            answer_text:
                answer,

            time_on_page:
                timeOnPage,

            next_page:
                "page15"

        });


        /* =====================================
           NEXT PAGE
        ====================================== */

        window.location.href =
            "page15.html";

    }
);


/* =====================================================
   7. INITIAL STATE
===================================================== */

updateButton();

</script>

</body>

</html>
