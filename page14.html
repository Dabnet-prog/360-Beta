<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ELIT MAN</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 45%,
            #ffffff 0%,
            #f8f8f6 45%,
            #f3f3f0 100%
        );

    color:#171717;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    overflow-x:hidden;
}


/* =========================================
   AMBIENT LIGHT
========================================= */

body::before{
    content:"";

    position:fixed;

    width:360px;
    height:360px;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.9),
            rgba(255,255,255,0) 70%
        );

    pointer-events:none;

    animation:
        breathe 8s ease-in-out infinite;
}

@keyframes breathe{

    0%,
    100%{
        opacity:.5;

        transform:
            translate(-50%,-50%)
            scale(.94);
    }

    50%{
        opacity:.9;

        transform:
            translate(-50%,-50%)
            scale(1.07);
    }

}


/* =========================================
   PAGE
========================================= */

.page{
    width:100%;
    max-width:520px;

    min-height:100vh;

    margin:auto;

    padding:
        28px 22px
        24px;

    display:flex;
    flex-direction:column;

    position:relative;

    z-index:2;
}


/* =========================================
   BRAND
========================================= */

.brand{
    align-self:center;

    padding:
        7px 15px;

    border:
        1px solid #deded9;

    border-radius:999px;

    background:
        rgba(255,255,255,.6);

    color:#555;

    font-size:10px;

    font-weight:600;

    letter-spacing:2.2px;

    opacity:0;

    transform:
        translateY(-8px);

    animation:
        fadeDown .8s
        cubic-bezier(.2,.8,.2,1)
        .15s forwards;
}

@keyframes fadeDown{

    to{
        opacity:1;

        transform:
            translateY(0);
    }

}


/* =========================================
   CONTENT
========================================= */

.content{
    flex:1;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        25px 0
        35px;
}


/* =========================================
   INTRO
========================================= */

.intro{
    color:#999;

    font-size:12px;

    margin-bottom:17px;

    opacity:0;

    transform:
        translateY(10px);

    animation:
        fadeUp .8s
        cubic-bezier(.2,.8,.2,1)
        .55s forwards;
}


/* =========================================
   TITLE
========================================= */

h1{
    max-width:360px;

    font-size:28px;

    font-weight:450;

    line-height:1.55;

    letter-spacing:-.8px;

    opacity:0;

    transform:
        translateY(13px)
        scale(.985);

    animation:
        titleIn 1s
        cubic-bezier(.2,.8,.2,1)
        .72s forwards;
}

h1 strong{
    font-weight:780;
}

@keyframes titleIn{

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================
   SELECTED PATH
========================================= */

.path-display{

    margin-top:19px;

    padding:
        8px 15px;

    border:
        1px solid #e2e2dd;

    border-radius:999px;

    background:#fff;

    color:#555;

    font-size:11px;

    opacity:0;

    transform:
        scale(.94)
        translateY(8px);

    animation:
        pathIn .7s
        cubic-bezier(.2,.8,.2,1)
        1.05s forwards;
}

@keyframes pathIn{

    to{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }

}


/* =========================================
   QUESTION AREA
========================================= */

.question-area{

    width:100%;

    max-width:390px;

    margin-top:30px;

    opacity:0;

    transform:
        translateY(15px);

    animation:
        fadeUp .8s
        cubic-bezier(.2,.8,.2,1)
        1.3s forwards;
}

.question{

    font-size:17px;

    font-weight:680;

    line-height:1.7;
}

.hint{

    margin-top:6px;

    color:#999;

    font-size:11px;

    line-height:1.7;
}


/* =========================================
   INPUT
========================================= */

textarea{

    width:100%;

    min-height:125px;

    margin-top:15px;

    padding:16px;

    border:
        1px solid #dcdcd7;

    border-radius:15px;

    outline:none;

    resize:none;

    background:
        rgba(255,255,255,.9);

    color:#171717;

    font-family:inherit;

    font-size:14px;

    line-height:1.8;

    text-align:center;

    transition:
        border .3s ease,
        box-shadow .4s ease,
        transform .3s ease;
}

textarea::placeholder{
    color:#b0b0ad;
}

textarea:focus{

    border-color:#999;

    box-shadow:
        0 0 0 4px
        rgba(0,0,0,.035),
        0 12px 30px
        rgba(0,0,0,.035);

    transform:
        translateY(-1px);
}


/* =========================================
   BOTTOM
========================================= */

.bottom{

    padding-top:18px;

    opacity:0;

    transform:
        translateY(10px);

    animation:
        fadeUp .8s
        cubic-bezier(.2,.8,.2,1)
        1.8s forwards;
}

.next-btn{

    width:100%;

    padding:
        16px 20px;

    border:none;

    border-radius:14px;

    background:#171717;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    opacity:.28;

    transition:
        opacity .35s ease,
        transform .25s ease,
        box-shadow .4s ease;
}

.next-btn.active{
    opacity:1;
}

.next-btn.active:hover{

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.14);
}

.next-btn:active{
    transform:
        scale(.985);
}

.micro{

    margin-top:11px;

    text-align:center;

    color:#aaa;

    font-size:10px;
}


/* =========================================
   ANIMATIONS
========================================= */

@keyframes fadeUp{

    to{
        opacity:1;

        transform:
            translateY(0);
    }

}


/* =========================================
   SMALL SCREENS
========================================= */

@media(max-height:700px){

    .content{

        padding-top:18px;
        padding-bottom:22px;

    }

    h1{
        font-size:24px;
    }

    .question-area{
        margin-top:23px;
    }

    textarea{
        min-height:105px;
    }

}

</style>
</head>


<body>


<main class="page">


    <div class="brand">
        ELIT MAN
    </div>


    <section class="content">


        <div class="intro">
            الآن نريد أن نفهم اختيارك أكثر.
        </div>


        <h1>
            كيف تتصور أن
            <br>
            <strong>تبدأ بهذا الطريق؟</strong>
        </h1>


        <div
            class="path-display"
            id="pathDisplay"
        >
            الطريق الذي اخترته
        </div>


        <div class="question-area">


            <div
                class="question"
                id="question"
            >
                كيف ستبدأ؟
            </div>


            <div
                class="hint"
                id="hint"
            >
                اكتب ما تفكر فيه بطريقتك.
            </div>


            <textarea
                id="answerInput"
                placeholder="اكتب هنا..."
            ></textarea>


        </div>


    </section>


    <div class="bottom">

        <button
            class="next-btn"
            id="nextBtn"
            disabled
        >
            نكمل ←
        </button>

        <div class="micro">
            لا توجد إجابة صحيحة أو خاطئة
        </div>

    </div>


</main>


<script>

/* =====================================================
   TRACKING CONFIG
===================================================== */

const TRACKING_URL =
    "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


/* =====================================================
   CLIENT ID
===================================================== */

const CLIENT_KEY =
    "closing_layer_client_id";

let clientId =
    localStorage.getItem(
        CLIENT_KEY
    );


if(!clientId){

    clientId =
        "CL-" +
        crypto.randomUUID();

    localStorage.setItem(
        CLIENT_KEY,
        clientId
    );

}


/* =====================================================
   SESSION ID
===================================================== */

const SESSION_KEY =
    "closing_layer_session_id";

let sessionId =
    sessionStorage.getItem(
        SESSION_KEY
    );


let isNewSession =
    false;


if(!sessionId){

    sessionId =
        "S-" +
        crypto.randomUUID();

    sessionStorage.setItem(
        SESSION_KEY,
        sessionId
    );

    isNewSession =
        true;

}


/* =====================================================
   RETURNED LATER
===================================================== */

const LAST_SESSION_KEY =
    "closing_layer_last_session_id";


const previousSessionId =
    localStorage.getItem(
        LAST_SESSION_KEY
    );


const returnedLater =
    isNewSession &&
    previousSessionId &&
    previousSessionId !== sessionId;


localStorage.setItem(
    LAST_SESSION_KEY,
    sessionId
);


/* =====================================================
   PAGE
===================================================== */

const CURRENT_PAGE =
    "الصفحة 14";


const startedAt =
    Date.now();


const pageEnteredAt =
    new Date().toISOString();


let pageExitSent =
    false;


/* =====================================================
   SEND TRACKING
===================================================== */

function sendTracking(data){

    try{

        const payload = {

            client_id:
                clientId,

            session_id:
                sessionId,

            ...data

        };


        fetch(
            TRACKING_URL,
            {
                method:
                    "POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=UTF-8"
                },

                body:
                    JSON.stringify(payload),

                mode:
                    "no-cors",

                keepalive:
                    true,

                cache:
                    "no-store"
            }
        );

    }
    catch(error){

        console.error(
            "Tracking error:",
            error
        );

    }

}


/* =====================================================
   SESSION START
===================================================== */

if(isNewSession){

    sendTracking({

        event:
            "session_start",

        page:
            CURRENT_PAGE,

        path:
            CURRENT_PAGE,

        returned_later:
            returnedLater
                ? "نعم"
                : "لا",

        timestamp:
            pageEnteredAt

    });

}


/* =====================================================
   PAGE VIEW
===================================================== */

sendTracking({

    event:
        "page_view",

    page:
        CURRENT_PAGE,

    path:
        CURRENT_PAGE,

    entered_at:
        pageEnteredAt,

    timestamp:
        pageEnteredAt

});


/* =====================================================
   BACK NAVIGATION
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        const navigation =
            performance.getEntriesByType(
                "navigation"
            )[0];


        if(
            navigation &&
            navigation.type ===
            "back_forward"
        ){

            sendTracking({

                event:
                    "back_navigation",

                page:
                    CURRENT_PAGE,

                path:
                    CURRENT_PAGE,

                went_back:
                    true,

                back_count:
                    1,

                interaction:
                    "رجع إلى الصفحة 14",

                timestamp:
                    new Date()
                        .toISOString()

            });

        }

    }
);


/* =====================================================
   PAGE EXIT
===================================================== */

function sendPageExit(){

    if(pageExitSent){
        return;
    }


    pageExitSent =
        true;


    const durationSeconds =
        Math.round(
            (
                Date.now() -
                startedAt
            ) / 1000
        );


    sendTracking({

        event:
            "page_exit",

        page:
            CURRENT_PAGE,

        path:
            CURRENT_PAGE,

        duration:
            durationSeconds,

        timestamp:
            new Date()
                .toISOString()

    });

}


/* =====================================================
   1. RECOVER PAGE 13 DATA
===================================================== */

let selectedPath =
    localStorage.getItem(
        "selected_financial_path"
    );


let selectedPathText =
    localStorage.getItem(
        "selected_financial_path_text"
    ) || "";


/* =====================================================
   FALLBACK TO DECISION STATE
===================================================== */

if(!selectedPath){

    try{

        const state =
            JSON.parse(
                localStorage.getItem(
                    "decision_state"
                ) || "{}"
            );


        selectedPath =
            state.selected_financial_path ||
            null;


        selectedPathText =
            state.selected_financial_path_text ||
            selectedPathText ||
            "";

    }
    catch(error){

        selectedPath =
            null;

    }

}


/* =====================================================
   2. ELEMENTS
===================================================== */

const pathDisplay =
    document.getElementById(
        "pathDisplay"
    );


const question =
    document.getElementById(
        "question"
    );


const hint =
    document.getElementById(
        "hint"
    );


const answerInput =
    document.getElementById(
        "answerInput"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


/* =====================================================
   3. PATH CONFIGURATION
===================================================== */

const pathData = {

    sell_asset: {

        label:
            "نبيع شيئًا",

        question:
            "كيف تتصور أن تبدأ؟",

        hint:
            "ما أول شيء ستقوم به؟"

    },


    ask_person: {

        label:
            "نستعين بشخص",

        question:
            "كيف تتصور أن تقوم بذلك؟",

        hint:
            "من أين ستبدأ؟"

    },


    save_wait: {

        label:
            "ننتظر ونجمعه",

        question:
            "كيف تتصور أن تكمل المبلغ؟",

        hint:
            "ماذا ستفعل خلال هذه الفترة؟"

    },


    other: {

        label:
            selectedPathText ||
            "طريق آخر",

        question:
            "كيف ستبدأ بهذا الطريق؟",

        hint:
            "اشرحه بطريقتك."

    }

};


/* =====================================================
   4. APPLY PATH
===================================================== */

let data;


if(
    selectedPath &&
    pathData[selectedPath]
){

    data =
        pathData[selectedPath];

}
else{

    data = {

        label:
            selectedPathText ||
            "الطريق الذي اخترته",

        question:
            "كيف ستبدأ؟",

        hint:
            "اكتب ما تفكر فيه بطريقتك."

    };

}


pathDisplay.textContent =
    data.label;


question.textContent =
    data.question;


hint.textContent =
    data.hint;


/* =====================================================
   TRACK PAGE ENTRY WITH CURRENT PATH
===================================================== */

sendTracking({

    event:
        "page_view",

    page:
        CURRENT_PAGE,

    path:
        CURRENT_PAGE,

    timestamp:
        pageEnteredAt,

    selected_financial_path:
        selectedPath || "",

    selected_financial_path_text:
        selectedPathText,

    financial_path:
        selectedPathText ||
        data.label

});


/* =====================================================
   CHOICE CHANGE TRACKING
   W / X / Y
===================================================== */

/*
   هذا المتغير يحتفظ بآخر قيمة فعلية
   كتبها الزائر داخل الصفحة.
*/

let previousChoice =
    "";


/* =====================================================
   5. INPUT
===================================================== */

function updateButton(){

    const valid =
        answerInput
            .value
            .trim()
            .length >= 2;


    nextBtn.disabled =
        !valid;


    nextBtn.classList.toggle(
        "active",
        valid
    );

}


answerInput.addEventListener(
    "input",
    function(){

        const currentValue =
            answerInput
                .value
                .trim();


        /*
         * إذا كانت هناك قيمة سابقة فعلية
         * ثم غيّرها الزائر إلى قيمة أخرى،
         * نسجل التغيير فورًا.
         */

        if(
            previousChoice !== "" &&
            currentValue !== "" &&
            previousChoice !== currentValue
        ){

            sendTracking({

                event:
                    "choice_changed",

                page:
                    CURRENT_PAGE,

                path:
                    CURRENT_PAGE,

                choice_changed:
                    "نعم",

                choice_previous:
                    previousChoice,

                choice_new:
                    currentValue,

                previous_choice:
                    previousChoice,

                new_choice:
                    currentValue,

                timestamp:
                    new Date()
                        .toISOString()

            });

        }


        /*
         * نحفظ القيمة الحالية
         * كآخر قيمة فعلية.
         */

        if(
            currentValue !== ""
        ){

            previousChoice =
                currentValue;

        }


        updateButton();

    }
);


/* =====================================================
   6. COMPLETE PAGE 14
===================================================== */

nextBtn.addEventListener(
    "click",
    function(){

        const answer =
            answerInput
                .value
                .trim();


        if(answer.length < 2){
            return;
        }


        const timestamp =
            new Date()
                .toISOString();


        const timeOnPage =
            Math.round(
                (
                    Date.now() -
                    startedAt
                ) / 1000
            );


        /* =====================================
           SAVE LOCAL DATA
        ===================================== */

        localStorage.setItem(
            "financial_path_explanation",
            answer
        );


        localStorage.setItem(
            "page14_answer",
            answer
        );


        localStorage.setItem(
            "page14_completed_at",
            timestamp
        );


        /* =====================================
           DECISION STATE
        ===================================== */

        let state = {};


        try{

            state =
                JSON.parse(
                    localStorage.getItem(
                        "decision_state"
                    ) || "{}"
                );

        }
        catch(error){

            state = {};

        }


        state.selected_financial_path =
            selectedPath;


        state.selected_financial_path_text =
            selectedPathText;


        state.financial_path_explanation =
            answer;


        state.page14_completed =
            true;


        state.page14_completed_at =
            timestamp;


        localStorage.setItem(
            "decision_state",
            JSON.stringify(
                state
            )
        );


        /* =====================================
           SERVER:
           360-2 J + K
        ===================================== */

        sendTracking({

            event:
                "financial_path_explained",

            page:
                CURRENT_PAGE,

            path:
                CURRENT_PAGE,

            timestamp:
                timestamp,

            selected_financial_path:
                selectedPathText ||
                data.label,

            financial_path:
                selectedPathText ||
                data.label,

            financial_path_explanation:
                answer,

            explanation:
                answer,

            answer_text:
                answer,

            completed:
                true,

            time_on_page:
                timeOnPage

        });


        /* =====================================
           PAGE COMPLETED
        ===================================== */

        sendTracking({

            event:
                "page14_completed",

            page:
                CURRENT_PAGE,

            path:
                CURRENT_PAGE,

            timestamp:
                timestamp,

            selected_financial_path:
                selectedPathText ||
                data.label,

            financial_path:
                selectedPathText ||
                data.label,

            financial_path_explanation:
                answer,

            completed:
                true,

            time_on_page:
                timeOnPage,

            next_page:
                "الصفحة 15"

        });


        /* =====================================
           EXIT
        ===================================== */

        sendPageExit();


        /* =====================================
           NEXT
        ===================================== */

        setTimeout(
            function(){

                window.location.href =
                    "page15.html";

            },
            150
        );

    }
);


/* =====================================================
   PAGE HIDE
===================================================== */

window.addEventListener(
    "pagehide",
    sendPageExit
);


/* =====================================================
   INITIAL BUTTON STATE
===================================================== */

updateButton();

</script>

</body>

</html>
