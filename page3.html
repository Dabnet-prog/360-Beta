<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أحسنت</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            line-height: 1.5;
            font-weight: 700;
            margin-bottom: 40px;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 15px 50px;
            font-size: 21px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s ease;
        }

        button.clicked {
            background: #000000;
            color: #ffffff;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 32px;
            }

            button {
                padding: 14px 40px;
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            أحسنت... أنت الأفضل 👏
        </h1>

        <button id="exitButton">
            خروج
        </button>

    </div>

    <script>

        const trackerURL =
            "https://script.google.com/macros/s/AKfycbzpcGySNVeu3mKM2ROvO03Z1KUXWLJdGqD2Kw8wtA6A0u8zyZJspy8UBJ5qUtqeXI34gA/exec";


        let sessionId =
            sessionStorage.getItem("session_id");


        function track(step) {

            const params =
                new URLSearchParams({

                    session_id: sessionId,
                    step: step

                });


            fetch(
                trackerURL + "?" + params.toString(),
                {
                    method: "GET",
                    mode: "no-cors",
                    keepalive: true
                }
            );
        }


        // تسجيل دخول الصفحة الثالثة
        track("page3_view");


        // زر الخروج
        document
            .getElementById("exitButton")
            .addEventListener("click", function () {

                this.classList.add("clicked");

                track("page3_exit");

                setTimeout(function () {

                    window.location.href =
                        "about:blank";

                }, 250);

            });

    </script>

</body>

</html>
