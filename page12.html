<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تقييم التجربة</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fdfdfc;
      color: #111;
      font-family: Arial, "Tahoma", sans-serif;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      max-width: 440px;
      margin: auto;
      padding: 30px 22px 28px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .ambient {
      position: fixed;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(0,0,0,.035) 0%,
          rgba(0,0,0,0) 70%
        );
      top: 50%;
      left: 50%;
      transform:
        translate(-50%, -50%)
        scale(.7);
      pointer-events: none;
      opacity: 0;
      animation:
        ambientIn 2s .4s ease forwards,
        ambientBreath 7s 2.4s ease-in-out infinite;
    }

    .brand {
      align-self: center;
      font-size: 10px;
      letter-spacing: 3px;
      font-weight: 700;
      padding: 8px 14px;
      border: 1px solid #111;
      border-radius: 30px;
      opacity: 0;
      transform: translateY(-8px);
      animation:
        appear .8s ease forwards;
    }

    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .content {
      width: 100%;
      max-width: 350px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation:
        contentIn 1s .45s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }

    .intro {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 17px;
      letter-spacing: .2px;
    }

    .title {
      font-size: 28px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: -.8px;
    }

    .title strong {
      display: inline-block;
      position: relative;
    }

    .title strong::after {
      content: "";
      position: absolute;
      right: 5%;
      left: 5%;
      bottom: -8px;
      height: 2px;
      background: #111;
      transform: scaleX(0);
      transform-origin: center;
      animation:
        underlineIn .7s 1.25s ease forwards;
    }

    .description {
      max-width: 290px;
      margin: 27px auto 0;
      font-size: 13px;
      line-height: 1.9;
      color: #888;
    }

    .ratings {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 8px;
      margin-top: 43px;
      opacity: 0;
      transform: translateY(15px);
      animation:
        ratingsIn .9s 1.5s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }

    .rating {
      position: relative;
      min-height: 76px;
      border: 1px solid #e7e7e7;
      border-radius: 15px;
      background: rgba(255,255,255,.8);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #777;
      transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        border-color .35s ease,
        box-shadow .35s ease,
        color .35s ease;
    }

    .rating:hover {
      transform: translateY(-3px);
      color: #111;
    }

    .rating:active {
      transform: scale(.95);
    }

    .rating.selected {
      background: #fff;
      transform:
        translateY(-4px);
      box-shadow:
        0 10px 25px rgba(0,0,0,.055);
    }

    .rating[data-value="ضعيف"].selected {
      border: 2px solid #c96b6b;
      color: #8d3f3f;
    }

    .rating[data-value="متوسط"].selected {
      border: 2px solid #d19a52;
      color: #956727;
    }

    .rating[data-value="جيد"].selected {
      border: 2px solid #6da47d;
      color: #477254;
    }

    .rating[data-value="خيالي"].selected {
      border: 2px solid #7568b3;
      color: #554b8b;
    }

    .rating.selected::before {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      top: 9px;
      right: 9px;
      animation:
        dotIn .35s ease forwards;
    }

    .rating[data-value="ضعيف"].selected::before {
      background: #c96b6b;
    }

    .rating[data-value="متوسط"].selected::before {
      background: #d19a52;
    }

    .rating[data-value="جيد"].selected::before {
      background: #6da47d;
    }

    .rating[data-value="خيالي"].selected::before {
      background: #7568b3;
    }

    .feedback {
      height: 23px;
      margin-top: 19px;
      text-align: center;
      font-size: 11px;
      color: #aaa;
      opacity: 0;
      transform: translateY(5px);
      transition:
        opacity .4s ease,
        transform .4s ease;
    }

    .feedback.show {
      opacity: 1;
      transform: translateY(0);
    }

    .bottom {
      position: relative;
      z-index: 3;
      opacity: 0;
      transform: translateY(12px);
      animation:
        bottomIn .8s 2s ease forwards;
    }

    .finish {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 17px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform .3s ease,
        box-shadow .3s ease,
        background .3s ease;
    }

    .finish:disabled {
      background: #dedede;
      color: #999;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .finish:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 30px rgba(0,0,0,.13);
    }

    .finish:not(:disabled):active {
      transform: scale(.98);
    }

    .micro {
      text-align: center;
      margin-top: 12px;
      font-size: 10px;
      color: #aaa;
    }

    .final-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity .8s ease,
        visibility .8s ease;
    }

    .final-screen.active {
      opacity: 1;
      visibility: visible;
    }

    .final-content {
      width: 90%;
      max-width: 330px;
      transform: translateY(25px);
      transition:
        transform 1s
        cubic-bezier(.2,.8,.2,1);
    }

    .final-screen.active
    .final-content {
      transform: translateY(0);
    }

    .final-circle {
      width: 72px;
      height: 72px;
      margin: 0 auto 27px;
      border: 1px solid #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      opacity: 0;
      transform: scale(.6);
      animation:
        finalCircle .8s .2s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }

    .final-title {
      font-size: 25px;
      font-weight: 700;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(10px);
      animation:
        finalText .7s .65s ease forwards;
    }

    .final-sub {
      margin-top: 15px;
      font-size: 13px;
      color: #888;
      line-height: 1.9;
      opacity: 0;
      transform: translateY(10px);
      animation:
        finalText .7s .9s ease forwards;
    }

    .final-line {
      width: 0;
      height: 1px;
      background: #111;
      margin: 26px auto 0;
      animation:
        finalLine .7s 1.25s ease forwards;
    }

    @keyframes appear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes contentIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ratingsIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bottomIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes underlineIn {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes dotIn {
      from {
        opacity: 0;
        transform: scale(0);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes ambientIn {
      to {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1);
      }
    }

    @keyframes ambientBreath {
      0%,
      100% {
        opacity: .7;
        transform:
          translate(-50%, -50%)
          scale(1);
      }

      50% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1.12);
      }
    }

    @keyframes finalCircle {
      0% {
        opacity: 0;
        transform: scale(.6);
      }

      65% {
        opacity: 1;
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes finalText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes finalLine {
      to {
        width: 55px;
      }
    }

    @media (max-width: 360px) {
      .page {
        padding-left: 17px;
        padding-right: 17px;
      }

      .title {
        font-size: 25px;
      }

      .ratings {
        gap: 5px;
      }

      .rating {
        min-height: 70px;
        font-size: 11px;
      }
    }

  </style>

</head>


<body>

  <iframe
    name="trackingFrame"
    style="display:none;"
  ></iframe>


  <div class="ambient"></div>


  <main class="page">

    <div class="brand">
      ELIT MAN
    </div>


    <section class="center">

      <div class="content">

        <div class="intro">
          قبل أن تغادر...
        </div>


        <div class="title">

          كيف كانت

          <br>

          <strong>تجربتك؟</strong>

        </div>


        <div class="description">

          اختيارك سيساعدنا على معرفة كيف عاش
          شخص آخر هذه التجربة.

        </div>


        <div class="ratings">

          <button
            class="rating"
            data-value="ضعيف"
            type="button"
          >
            ضعيف
          </button>


          <button
            class="rating"
            data-value="متوسط"
            type="button"
          >
            متوسط
          </button>


          <button
            class="rating"
            data-value="جيد"
            type="button"
          >
            جيد
          </button>


          <button
            class="rating"
            data-value="خيالي"
            type="button"
          >
            خيالي
          </button>

        </div>


        <div
          id="feedback"
          class="feedback"
        ></div>

      </div>

    </section>


    <div class="bottom">

      <button
        id="finish"
        class="finish"
        type="button"
        disabled
      >
        إنهاء
      </button>


      <div class="micro">
        شكرًا لأنك منحتنا جزءًا من وقتك
      </div>

    </div>

  </main>


  <div
    id="finalScreen"
    class="final-screen"
  >

    <div class="final-content">

      <div class="final-circle">
        ✓
      </div>


      <div class="final-title">
        انتهت التجربة.
      </div>


      <div class="final-sub">

        شكرًا لاختيارك ELIT MAN.

        <br>

        نترك لك الآن اختيار ما بعد هذه اللحظة.

      </div>


      <div class="final-line"></div>

    </div>

  </div>


  <script>

    /* =========================
       TRACKING CONFIG
    ========================= */

    const TRACKING_URL =
      "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


    /* =========================
       CLIENT ID
    ========================= */

    const CLIENT_KEY =
      "closing_layer_client_id";


    let clientId =
      localStorage.getItem(
        CLIENT_KEY
      );


    if (!clientId) {

      clientId =
        "CL-" +
        crypto.randomUUID();


      localStorage.setItem(
        CLIENT_KEY,
        clientId
      );

    }


    /* =========================
       SESSION ID
    ========================= */

    const SESSION_KEY =
      "closing_layer_session_id";


    let sessionId =
      sessionStorage.getItem(
        SESSION_KEY
      );


    let isNewSession = false;


    if (!sessionId) {

      sessionId =
        "S-" +
        crypto.randomUUID();


      sessionStorage.setItem(
        SESSION_KEY,
        sessionId
      );


      isNewSession = true;

    }


    /* =========================
       RETURNED LATER
    ========================= */

    const LAST_SESSION_KEY =
      "closing_layer_last_session_id";


    const previousSessionId =
      localStorage.getItem(
        LAST_SESSION_KEY
      );


    const returnedLater =
      isNewSession &&
      previousSessionId &&
      previousSessionId !== sessionId;


    localStorage.setItem(
      LAST_SESSION_KEY,
      sessionId
    );


    /* =========================
       CURRENT PAGE
    ========================= */

    const CURRENT_PAGE =
      "الصفحة 12";


    const pageEnteredAt =
      Date.now();


    let pageExitSent =
      false;


    /* =========================
       FULL PATH — U
    ========================= */

    let pathExitSent =
      false;


    function sendPathExit() {

      if (pathExitSent) {
        return;
      }


      pathExitSent = true;


      const payload = {

        client_id:
          clientId,

        session_id:
          sessionId,

        event:
          "path_page_exit",

        page:
          CURRENT_PAGE,

        path_page:
          CURRENT_PAGE,

        timestamp:
          new Date().toISOString()

      };


      const body =
        JSON.stringify(
          payload
        );


      try {

        if (navigator.sendBeacon) {

          const blob =
            new Blob(
              [body],
              {
                type:
                  "text/plain;charset=UTF-8"
              }
            );


          navigator.sendBeacon(
            TRACKING_URL,
            blob
          );

          return;

        }

      } catch (error) {}


      fetch(
        TRACKING_URL,
        {

          method:
            "POST",

          headers:
            {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },

          body:
            body,

          mode:
            "no-cors",

          keepalive:
            true,

          cache:
            "no-store"

        }
      ).catch(
        function () {}
      );

    }


    /* =========================
       SEND TRACKING
    ========================= */

    function sendTracking(data) {

      try {

        const payload = {

          client_id:
            clientId,

          session_id:
            sessionId,

          ...data

        };


        fetch(
          TRACKING_URL,
          {

            method:
              "POST",

            headers:
              {
                "Content-Type":
                  "text/plain;charset=UTF-8"
              },

            body:
              JSON.stringify(payload),

            mode:
              "no-cors",

            keepalive:
              true,

            cache:
              "no-store"

          }
        ).catch(function () {});


      } catch (error) {

        console.error(
          "Tracking error:",
          error
        );

      }

    }


    /* =========================
       SESSION START
    ========================= */

    if (isNewSession) {

      sendTracking({

        event:
          "session_start",

        page:
          CURRENT_PAGE,

        path:
          CURRENT_PAGE,

        returned_later:
          returnedLater
            ? "نعم"
            : "لا",

        timestamp:
          new Date().toISOString()

      });

    }


    /* =========================
       PAGE VIEW
    ========================= */

    const enteredAt =
      new Date().toISOString();


    sendTracking({

      event:
        "page_view",

      page:
        CURRENT_PAGE,

      path:
        CURRENT_PAGE,

      entered_at:
        enteredAt,

      timestamp:
        enteredAt

    });


    /* =========================
       BACK NAVIGATION
    ========================= */

    window.addEventListener(
      "pageshow",
      function () {

        const navigation =
          performance.getEntriesByType(
            "navigation"
          )[0];


        if (
          navigation &&
          navigation.type ===
            "back_forward"
        ) {

          sendTracking({

            event:
              "back_navigation",

            page:
              CURRENT_PAGE,

            path:
              CURRENT_PAGE,

            went_back:
              true,

            back_count:
              1,

            interaction:
              "رجع إلى الصفحة 12",

            timestamp:
              new Date().toISOString()

          });

        }

      }
    );


    /* =========================
       PAGE EXIT
    ========================= */

    function sendPageExit() {

      if (pageExitSent) {
        return;
      }


      pageExitSent = true;


      const durationSeconds =
        Math.round(
          (
            Date.now() -
            pageEnteredAt
          ) / 1000
        );


      sendTracking({

        event:
          "page_exit",

        page:
          CURRENT_PAGE,

        path:
          CURRENT_PAGE,

        duration:
          durationSeconds,

        timestamp:
          new Date().toISOString()

      });

    }


    /* =========================
       ELEMENTS
    ========================= */

    const ratings =
      document.querySelectorAll(
        ".rating"
      );


    const feedback =
      document.getElementById(
        "feedback"
      );


    const finish =
      document.getElementById(
        "finish"
      );


    const finalScreen =
      document.getElementById(
        "finalScreen"
      );


    let selectedRating =
      null;


    /* =========================
       CONTEXT
    ========================= */

    const product =
      localStorage.getItem(
        "selected_product_names"
      ) ||
      localStorage.getItem(
        "selected_product_name"
      ) ||
      localStorage.getItem(
        "selected_product"
      ) ||
      "";


    const selectedProducts =
      localStorage.getItem(
        "selected_product_names"
      ) ||
      localStorage.getItem(
        "selected_products"
      ) ||
      "";


    const selectedIntent =
      localStorage.getItem(
        "selected_intent_text"
      ) ||
      localStorage.getItem(
        "selected_intent"
      ) ||
      "";


    const selectedContext =
      localStorage.getItem(
        "selected_context_text"
      ) ||
      localStorage.getItem(
        "selected_context"
      ) ||
      "";


    /* =========================
       LOCAL PAGE STATE
    ========================= */

    localStorage.setItem(
      "page12_entered_at",
      enteredAt
    );


    localStorage.setItem(
      "final_page_entered_at",
      enteredAt
    );


    /* =========================
       RATING
    ========================= */

    ratings.forEach(
      function (rating) {

        rating.addEventListener(
          "click",
          function () {

            ratings.forEach(
              function (item) {

                item.classList.remove(
                  "selected"
                );

              }
            );


            rating.classList.add(
              "selected"
            );


            selectedRating =
              rating.dataset.value;


            /* =====================
               FEEDBACK
            ===================== */

            const messages = {

              "ضعيف":
                "وصلنا. شكرًا على صراحتك.",

              "متوسط":
                "وصلنا. شكرًا على تقييمك.",

              "جيد":
                "سعدنا بأن التجربة كانت جيدة.",

              "خيالي":
                "سعدنا جدًا بأن التجربة تركت هذا الأثر."

            };


            feedback.textContent =
              messages[
                selectedRating
              ] || "";


            feedback.classList.remove(
              "show"
            );


            requestAnimationFrame(
              function () {

                feedback.classList.add(
                  "show"
                );

              }
            );


            finish.disabled =
              false;


            /* =====================
               SAVE EXACT ANSWER
            ===================== */

            const ratingAt =
              new Date().toISOString();


            localStorage.setItem(
              "experience_rating",
              selectedRating
            );


            localStorage.setItem(
              "experience_rating_at",
              ratingAt
            );


            /* =====================
               LOCAL EVENT
            ===================== */

            addEvent(
              "experience_rating_selected",
              {

                rating:
                  selectedRating

              }
            );


            /* =====================
               SERVER EVENT
            ===================== */

            sendTracking({

              event:
                "experience_rating_selected",

              page:
                CURRENT_PAGE,

              path:
                CURRENT_PAGE,

              timestamp:
                ratingAt,

              rating:
                selectedRating,

              experience_rating:
                selectedRating,

              product:
                product,

              selected_products:
                selectedProducts,

              selected_intent:
                selectedIntent,

              selected_context:
                selectedContext

            });

          }
        );

      }
    );


    /* =========================
       FINISH
    ========================= */

    finish.addEventListener(
      "click",
      function () {

        if (!selectedRating) {
          return;
        }


        const finishedAt =
          new Date().toISOString();


        const timeOnPage =
          Math.round(
            (
              Date.now() -
              pageEnteredAt
            ) / 1000
          );


        /* =====================
           SAVE FINAL STATE
        ===================== */

        localStorage.setItem(
          "experience_completed",
          "true"
        );


        localStorage.setItem(
          "experience_completed_at",
          finishedAt
        );


        localStorage.setItem(
          "final_page_time_on_page",
          timeOnPage
        );


        localStorage.setItem(
          "page12_completed_at",
          finishedAt
        );


        localStorage.setItem(
          "page12_time_on_page",
          timeOnPage
        );


        /* =====================
           DECISION STATE
        ===================== */

        let decisionState = {};


        try {

          decisionState =
            JSON.parse(
              localStorage.getItem(
                "decision_state"
              ) || "{}"
            );

        } catch (error) {

          decisionState = {};

        }


        decisionState.experience_completed =
          true;


        decisionState.experience_rating =
          selectedRating;


        decisionState.experience_completed_at =
          finishedAt;


        localStorage.setItem(
          "decision_state",
          JSON.stringify(
            decisionState
          )
        );


        /* =====================
           LOCAL EVENT
        ===================== */

        addEvent(
          "experience_completed",
          {

            rating:
              selectedRating,

            time_on_page:
              timeOnPage

          }
        );


        /* =====================
           SERVER EVENT
        ===================== */

        sendTracking({

          event:
            "experience_completed",

          page:
            CURRENT_PAGE,

          path:
            CURRENT_PAGE,

          timestamp:
            finishedAt,

          rating:
            selectedRating,

          experience:
            selectedRating,

          experience_rating:
            selectedRating,

          product:
            product,

          selected_products:
            selectedProducts,

          selected_intent:
            selectedIntent,

          selected_context:
            selectedContext,

          time_on_page:
            timeOnPage,

          completed:
            true,

          next_page:
            "completed"

        });


        /* =====================
           FINAL 360-3 DATA
        ===================== */

        sendTracking({

          event:
            "final_experience_data",

          page:
            CURRENT_PAGE,

          path:
            CURRENT_PAGE,

          experience_rating:
            selectedRating,

          rating:
            selectedRating,

          completed:
            true,

          timestamp:
            finishedAt

        });


        /* =====================
           FULL PATH — U
        ===================== */

        sendPathExit();


        /* =====================
           PAGE EXIT
        ===================== */

        sendPageExit();


        /* =====================
           FINAL VISUAL
        ===================== */

        finalScreen.classList.add(
          "active"
        );


        /* =====================
           END
        ===================== */

        setTimeout(
          function () {

            window.location.replace(
              "about:blank"
            );

          },
          2300
        );

      }
    );


    /* =========================
       EVENT SYSTEM
    ========================= */

    function addEvent(
      eventName,
      data = {}
    ) {

      let events = [];


      try {

        events =
          JSON.parse(
            localStorage.getItem(
              "decision_events"
            ) || "[]"
          );

      } catch (error) {

        events = [];

      }


      events.push({

        event:
          eventName,

        page:
          CURRENT_PAGE,

        timestamp:
          new Date().toISOString(),

        ...data

      });


      localStorage.setItem(
        "decision_events",
        JSON.stringify(
          events
        )
      );

    }


    /* =========================
       PAGEHIDE
    ========================= */

    window.addEventListener(
      "pagehide",
      function () {

        sendPathExit();

        sendPageExit();

      }
    );

  </script>

</body>

</html>
