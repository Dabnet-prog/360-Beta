<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إتمام الطلب</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fff;
      color: #111;
      font-family: Arial, "Tahoma", sans-serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      width: 100%;
      max-width: 440px;
      margin: auto;
      padding: 30px 22px 34px;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      align-self: center;
      font-size: 10px;
      letter-spacing: 3px;
      font-weight: 700;
      padding: 8px 14px;
      border: 1px solid #111;
      border-radius: 30px;
      opacity: 0;
      transform: translateY(-8px);
      animation: appear .8s ease forwards;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;
      margin-top: 72px;
      opacity: 0;
      transform: translateY(18px);
      animation: heroIn 1s .35s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .small-title {
      font-size: 12px;
      color: #999;
      margin-bottom: 15px;
      letter-spacing: .3px;
    }

    .congrats {
      font-size: 30px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: -.8px;
    }

    .congrats strong {
      display: inline-block;
      position: relative;
    }

    .congrats strong::after {
      content: "";
      position: absolute;
      right: 4%;
      left: 4%;
      bottom: -7px;
      height: 2px;
      background: #111;
      transform: scaleX(0);
      transform-origin: center;
      animation: lineIn .7s 1.25s ease forwards;
    }

    .hero-sub {
      margin: 22px auto 0;
      max-width: 300px;
      font-size: 13px;
      line-height: 1.8;
      color: #888;
    }

    /* =========================
       FORM
    ========================= */

    .form-section {
      margin-top: 55px;
      opacity: 0;
      transform: translateY(20px);
      animation: formIn .9s 1.55s ease forwards;
    }

    .section-label {
      font-size: 11px;
      color: #999;
      margin-bottom: 17px;
      text-align: right;
    }

    .field {
      position: relative;
      margin-bottom: 15px;
    }

    .field input {
      width: 100%;
      height: 56px;
      border: 1px solid #e5e5e5;
      border-radius: 15px;
      background: #fafafa;
      padding: 0 17px;
      font-size: 14px;
      color: #111;
      outline: none;
      transition:
        border .25s ease,
        background .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
    }

    .field input::placeholder {
      color: #aaa;
    }

    .field input:focus {
      background: #fff;
      border-color: #111;
      box-shadow: 0 7px 24px rgba(0,0,0,.055);
      transform: translateY(-1px);
    }

    /* =========================
       DELIVERY
    ========================= */

    .delivery {
      margin-top: 24px;
      padding: 17px 18px;
      border-radius: 16px;
      background: #111;
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      opacity: 0;
      transform: translateY(15px) scale(.98);
      animation: deliveryIn .8s 2.25s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .delivery-text {
      text-align: right;
    }

    .delivery-main {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .delivery-sub {
      font-size: 10px;
      color: #aaa;
    }

    .delivery-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      color: #111;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;
      flex-shrink: 0;

      animation: softPulse 2.5s 3s ease-in-out infinite;
    }

    /* =========================
       COMPLETE BUTTON
    ========================= */

    .complete-wrap {
      margin-top: 35px;

      opacity: 0;
      transform: translateY(18px);
      animation: buttonIn .9s 2.7s ease forwards;
    }

    .complete-button {
      width: 100%;
      height: 57px;
      border: none;
      border-radius: 17px;
      background: #111;
      color: #fff;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
    }

    .complete-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,0,0,.13);
    }

    .complete-button:active {
      transform: scale(.98);
    }

    .complete-button:disabled {
      background: #d8d8d8;
      color: #999;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .under-button {
      text-align: center;
      margin-top: 12px;
      font-size: 10px;
      color: #aaa;
    }

    /* =========================
       SUCCESS
    ========================= */

    .success {
      position: fixed;
      inset: 0;
      background: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity .5s ease,
        visibility .5s ease;

      z-index: 50;
    }

    .success.active {
      opacity: 1;
      visibility: visible;
    }

    .success-content {
      width: 90%;
      max-width: 350px;
      text-align: center;
      transform: translateY(20px);
      transition: transform .7s cubic-bezier(.2,.8,.2,1);
    }

    .success.active .success-content {
      transform: translateY(0);
    }

    .success-mark {
      width: 66px;
      height: 66px;
      margin: 0 auto 25px;

      border: 1px solid #111;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;

      animation: successScale .7s .15s cubic-bezier(.2,.8,.2,1) both;
    }

    .success-title {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .success-text {
      color: #888;
      font-size: 13px;
      line-height: 1.9;
    }

    .success-line {
      width: 0;
      height: 1px;
      background: #111;
      margin: 25px auto 0;
      transition: width .7s .5s ease;
    }

    .success.active .success-line {
      width: 55px;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes appear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heroIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lineIn {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes formIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes deliveryIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes buttonIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes softPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    @keyframes successScale {
      0% {
        transform: scale(.65);
        opacity: 0;
      }

      70% {
        transform: scale(1.08);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 360px) {

      .page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .hero {
        margin-top: 58px;
      }

      .congrats {
        font-size: 27px;
      }

      .form-section {
        margin-top: 45px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       TRACKING FRAME
  ========================= -->

  <iframe
    name="trackingFrame"
    style="display:none;"
  ></iframe>


  <main class="page">

    <!-- BRAND -->

    <div class="brand">
      ELIT MAN
    </div>


    <!-- HERO -->

    <section class="hero">

      <div class="small-title">
        خطوة أخيرة
      </div>

      <div class="congrats">
        مبروك، لقد وصلت
        <br>
        <strong>إلى اختيارك.</strong>
      </div>

      <div class="hero-sub">
        بقي فقط أن نعرف أين نرسله إليك.
      </div>

    </section>


    <!-- FORM -->

    <section class="form-section">

      <div class="section-label">
        معلومات التوصيل
      </div>


      <div class="field">
        <input
          id="fullName"
          type="text"
          placeholder="الإسم الكامل"
          autocomplete="name"
        >
      </div>


      <div class="field">
        <input
          id="city"
          type="text"
          placeholder="المدينة"
          autocomplete="address-level2"
        >
      </div>


      <div class="field">
        <input
          id="phone"
          type="tel"
          placeholder="رقم الهاتف"
          autocomplete="tel"
          inputmode="tel"
        >
      </div>


      <div class="field">
        <input
          id="address"
          type="text"
          placeholder="عنوان المنزل"
          autocomplete="street-address"
        >
      </div>


      <!-- FREE DELIVERY -->

      <div class="delivery">

        <div class="delivery-text">

          <div class="delivery-main">
            التوصيل مجانًا في المغرب كامل
          </div>

          <div class="delivery-sub">
            لا توجد أي رسوم إضافية للتوصيل
          </div>

        </div>

        <div class="delivery-icon">
          ✓
        </div>

      </div>


      <!-- COMPLETE -->

      <div class="complete-wrap">

        <button
          id="completeButton"
          class="complete-button"
          disabled
        >
          إنهاء الطلب ←
        </button>

        <div class="under-button">
          راجع معلوماتك قبل الإنهاء
        </div>

      </div>

    </section>

  </main>


  <!-- SUCCESS -->

  <div
    id="success"
    class="success"
  >

    <div class="success-content">

      <div class="success-mark">
        ✓
      </div>

      <div class="success-title">
        تم تسجيل طلبك
      </div>

      <div class="success-text">
        شكرًا لاختيارك ELIT MAN.
        <br>
        سنتواصل معك لتأكيد تفاصيل التوصيل.
      </div>

      <div class="success-line"></div>

    </div>

  </div>


  <script>

    /* =========================
       TRACKING
    ========================= */

    const TRACKING_URL =
      "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


    /* =========================
       CLIENT ID
    ========================= */

    const CLIENT_KEY =
      "closing_layer_client_id";

    let clientId =
      localStorage.getItem(CLIENT_KEY);

    if (!clientId) {

      clientId =
        "CL-" +
        crypto.randomUUID();

      localStorage.setItem(
        CLIENT_KEY,
        clientId
      );

    }


    /* =========================
       SESSION ID
    ========================= */

    const SESSION_KEY =
      "closing_layer_session_id";

    let sessionId =
      sessionStorage.getItem(SESSION_KEY);

    let isNewSession = false;

    if (!sessionId) {

      sessionId =
        "S-" +
        crypto.randomUUID();

      sessionStorage.setItem(
        SESSION_KEY,
        sessionId
      );

      isNewSession = true;

    }


    /* =========================
       RETURNED LATER
    ========================= */

    const LAST_SESSION_KEY =
      "closing_layer_last_session_id";

    const previousSessionId =
      localStorage.getItem(
        LAST_SESSION_KEY
      );

    const returnedLater =
      isNewSession &&
      previousSessionId &&
      previousSessionId !== sessionId;

    localStorage.setItem(
      LAST_SESSION_KEY,
      sessionId
    );


    /* =========================
       PAGE DATA
    ========================= */

    const CURRENT_PAGE =
      "الصفحة 11";

    const pageEnteredAt =
      Date.now();

    let pageExitSent = false;

    let pathExitSent = false;


    /* =========================
       SEND TRACKING
    ========================= */

    function sendTracking(data) {

      try {

        const payload = {

          client_id:
            clientId,

          session_id:
            sessionId,

          ...data

        };


        fetch(
          TRACKING_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },

            body:
              JSON.stringify(payload),

            mode:
              "no-cors",

            keepalive:
              true,

            cache:
              "no-store"

          }
        ).catch(function () {});


      } catch (error) {

        console.error(
          "Tracking error:",
          error
        );

      }

    }


    /* =========================
       PATH EXIT — FULL PATH U
    ========================= */

    function sendPathExit() {

      if (pathExitSent) {
        return;
      }

      pathExitSent = true;


      const payload = {

        client_id:
          clientId,

        session_id:
          sessionId,

        event:
          "path_page_exit",

        page:
          CURRENT_PAGE,

        path_page:
          CURRENT_PAGE,

        timestamp:
          new Date().toISOString()

      };


      const body =
        JSON.stringify(payload);


      try {

        if (navigator.sendBeacon) {

          const blob =
            new Blob(
              [body],
              {
                type:
                  "text/plain;charset=UTF-8"
              }
            );


          navigator.sendBeacon(
            TRACKING_URL,
            blob
          );

          return;

        }

      } catch (error) {}


      fetch(
        TRACKING_URL,
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=UTF-8"
          },

          body:
            body,

          mode:
            "no-cors",

          keepalive:
            true,

          cache:
            "no-store"

        }
      ).catch(
        function () {}
      );

    }


    /* =========================
       SESSION START
    ========================= */

    if (isNewSession) {

      sendTracking({

        event:
          "session_start",

        page:
          CURRENT_PAGE,

        path:
          CURRENT_PAGE,

        returned_later:
          returnedLater
            ? "نعم"
            : "لا",

        timestamp:
          new Date().toISOString()

      });

    }


    /* =========================
       PAGE VIEW
    ========================= */

    sendTracking({

      event:
        "page_view",

      page:
        CURRENT_PAGE,

      path:
        CURRENT_PAGE,

      entered_at:
        new Date().toISOString(),

      timestamp:
        new Date().toISOString()

    });


    /* =========================
       BACK NAVIGATION
    ========================= */

    window.addEventListener(
      "pageshow",
      function () {

        const navigation =
          performance.getEntriesByType(
            "navigation"
          )[0];


        if (
          navigation &&
          navigation.type ===
            "back_forward"
        ) {

          sendTracking({

            event:
              "back_navigation",

            page:
              CURRENT_PAGE,

            path:
              CURRENT_PAGE,

            went_back:
              true,

            back_count:
              1,

            interaction:
              "رجع إلى الصفحة 11",

            timestamp:
              new Date().toISOString()

          });

        }

      }
    );


    /* =========================
       PAGE EXIT
    ========================= */

    function sendPageExit() {

      if (pageExitSent) {
        return;
      }

      pageExitSent = true;


      const durationMs =
        Date.now() -
        pageEnteredAt;


      const durationSeconds =
        Math.round(
          durationMs / 1000
        );


      sendTracking({

        event:
          "page_exit",

        page:
          CURRENT_PAGE,

        path:
          CURRENT_PAGE,

        duration:
          durationSeconds,

        timestamp:
          new Date().toISOString()

      });

    }


    /* =========================
       PAGE DATA FROM PREVIOUS PAGES
    ========================= */

    const product =
      localStorage.getItem(
        "selected_product"
      ) || "";


    const productName =
      localStorage.getItem(
        "selected_product_name"
      ) || "";


    const productPrice =
      localStorage.getItem(
        "product_price"
      ) ||
      localStorage.getItem(
        "selected_product_price"
      ) ||
      "130";


    const selectedProducts =
      localStorage.getItem(
        "selected_product_names"
      ) ||
      localStorage.getItem(
        "selected_product"
      ) ||
      "";


    const selectedIntent =
      localStorage.getItem(
        "selected_intent_text"
      ) ||
      localStorage.getItem(
        "selected_intent"
      ) ||
      "";


    const selectedContext =
      localStorage.getItem(
        "selected_context_text"
      ) ||
      localStorage.getItem(
        "selected_context"
      ) ||
      "";


    /* =========================
       ELEMENTS
    ========================= */

    const fullName =
      document.getElementById(
        "fullName"
      );

    const city =
      document.getElementById(
        "city"
      );

    const phone =
      document.getElementById(
        "phone"
      );

    const address =
      document.getElementById(
        "address"
      );

    const completeButton =
      document.getElementById(
        "completeButton"
      );

    const success =
      document.getElementById(
        "success"
      );


    /* =========================
       PAGE ENTER STATE
    ========================= */

    localStorage.setItem(
      "page11_entered_at",
      new Date().toISOString()
    );


    localStorage.setItem(
      "page11_product",
      productName ||
      product
    );


    /* =========================
       FORM CHECK
    ========================= */

    function checkForm() {

      const nameOK =
        fullName.value
          .trim()
          .length >= 3;


      const cityOK =
        city.value
          .trim()
          .length >= 2;


      const phoneOK =
        phone.value
          .replace(/\D/g, "")
          .length >= 9;


      const addressOK =
        address.value
          .trim()
          .length >= 5;


      const valid =
        nameOK &&
        cityOK &&
        phoneOK &&
        addressOK;


      completeButton.disabled =
        !valid;

    }


    [
      fullName,
      city,
      phone,
      address
    ].forEach(function (input) {

      input.addEventListener(
        "input",
        checkForm
      );

    });


    /* =========================
       COMPLETE ORDER
    ========================= */

    completeButton.addEventListener(
      "click",
      function () {

        if (
          completeButton.disabled
        ) {
          return;
        }


        const completedAt =
          new Date().toISOString();


        const timeOnPage =
          Math.round(
            (Date.now() -
              pageEnteredAt) /
              1000
          );


        /* =========================
           CUSTOMER DATA
        ========================= */

        const customerFullName =
          fullName.value.trim();


        const customerCity =
          city.value.trim();


        const customerPhone =
          phone.value.trim();


        const customerAddress =
          address.value.trim();


        /* =========================
           SAVE CUSTOMER DATA
        ========================= */

        localStorage.setItem(
          "customer_full_name",
          customerFullName
        );

        localStorage.setItem(
          "customer_city",
          customerCity
        );

        localStorage.setItem(
          "customer_phone",
          customerPhone
        );

        localStorage.setItem(
          "customer_address",
          customerAddress
        );


        localStorage.setItem(
          "order_completed_at",
          completedAt
        );

        localStorage.setItem(
          "page11_completed_at",
          completedAt
        );

        localStorage.setItem(
          "page11_time_on_page",
          timeOnPage
        );

        localStorage.setItem(
          "order_status",
          "completed"
        );


        /* =========================
           LOCAL DECISION STATE
        ========================= */

        let decisionState = {};

        try {

          decisionState =
            JSON.parse(
              localStorage.getItem(
                "decision_state"
              ) || "{}"
            );

        } catch (error) {

          decisionState = {};

        }


        decisionState.order_completed =
          true;

        decisionState.order_completed_at =
          completedAt;

        decisionState.product =
          productName ||
          product;

        decisionState.price =
          productPrice;

        decisionState.customer_data_completed =
          true;


        localStorage.setItem(
          "decision_state",
          JSON.stringify(
            decisionState
          )
        );


        /* =========================
           EVENT LOG
        ========================= */

        let events = [];

        try {

          events =
            JSON.parse(
              localStorage.getItem(
                "decision_events"
              ) || "[]"
            );

        } catch (error) {

          events = [];

        }


        events.push({

          event:
            "order_completed",

          timestamp:
            completedAt,

          page:
            CURRENT_PAGE,

          product:
            productName ||
            product,

          price:
            productPrice,

          time_on_page:
            timeOnPage,

          customer_data_completed:
            true

        });


        localStorage.setItem(
          "decision_events",
          JSON.stringify(
            events
          )
        );


        /* =========================
           TRACK INTERACTION
        ========================= */

        sendTracking({

          event:
            "interaction",

          page:
            CURRENT_PAGE,

          path:
            CURRENT_PAGE,

          interaction:
            "ضغط على زر: إنهاء الطلب",

          timestamp:
            completedAt

        });


        /* =========================
           FINAL ORDER TRACKING
        ========================= */

        sendTracking({

          event:
            "order_completed",

          page:
            CURRENT_PAGE,

          path:
            CURRENT_PAGE,

          completed:
            true,

          timestamp:
            completedAt,

          time_on_page:
            timeOnPage,


          /* 360-2 context */

          selected_product:
            selectedProducts,

          selected_intent:
            selectedIntent,

          selected_context:
            selectedContext,

          product_price:
            productPrice,


          /* 360-3 */

          full_name:
            customerFullName,

          city:
            customerCity,

          phone:
            customerPhone,

          address:
            customerAddress,

          experience_rating:
            "",

          has_enough_money:
            "نعم",


          /* order */

          product:
            productName ||
            product,

          product_id:
            product,

          product_name:
            productName,

          order_status:
            "completed",

          customer_data_completed:
            true,

          next_page:
            "page12.html"

        });


        /* =========================
           PATH EXIT — U
        ========================= */

        sendPathExit();


        /* =========================
           PAGE EXIT
        ========================= */

        sendPageExit();


        /* =========================
           VISUAL COMPLETION
        ========================= */

        success.classList.add(
          "active"
        );


        /* =========================
           NEXT PAGE
        ========================= */

        setTimeout(function () {

          window.location.href =
            "page12.html";

        }, 1500);

      }
    );


    /* =========================
       PAGEHIDE
    ========================= */

    window.addEventListener(
      "pagehide",
      function () {

        sendPathExit();

        sendPageExit();

      }
    );

  </script>

</body>
