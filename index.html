<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مرحبًا بك</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #f7f7f5;
            color: #111;
            font-family: Arial, "Tajawal", sans-serif;
            overflow: hidden;
        }

        /* =========================
           الصفحة
        ========================= */

        .page {
            width: 100%;
            height: 100vh;
            height: 100svh;

            position: relative;

            display: flex;
            flex-direction: column;

            padding: 34px 20px 38px;
        }

        /* =========================
           الخلفية
        ========================= */

        .background-shape {
            position: absolute;

            width: 270px;
            height: 270px;

            border-radius: 50%;

            background: #eeeeea;

            top: -145px;
            left: -125px;

            opacity: 0.65;

            pointer-events: none;
        }

        /* =========================
           العنوان
        ========================= */

        .top-content {
            position: relative;
            z-index: 2;

            text-align: center;

            animation: fadeUp 0.8s ease forwards;
        }

        .small-label {
            font-size: 11px;

            color: #92928d;

            letter-spacing: 0.8px;

            margin-bottom: 18px;
        }

        h1 {
            font-size: 57px;

            line-height: 1.05;

            font-weight: 700;

            letter-spacing: -2.5px;
        }

        /* =========================
           الجملة في الوسط
        ========================= */

        .middle-content {
            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            z-index: 2;

            text-align: center;
        }

        .message {
            font-size: 16px;

            line-height: 1.9;

            color: #5d5d58;

            max-width: 320px;

            margin: 0 auto;

            animation: fadeUp 0.8s ease 0.15s both;
        }

        .message strong {
            color: #111;

            font-weight: 600;
        }

        /* =========================
           الزر
        ========================= */

        .bottom-action {
            position: relative;

            z-index: 2;

            width: 100%;

            display: flex;

            justify-content: center;

            animation: fadeUp 0.8s ease 0.3s both;
        }

        #startButton {
            border: none;

            background: #111;

            color: #fff;

            width: 100%;

            max-width: 280px;

            min-height: 55px;

            padding: 15px 30px;

            border-radius: 100px;

            font-size: 16px;

            font-family: inherit;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease;

            -webkit-tap-highlight-color: transparent;
        }

        #startButton:hover {
            background: #242424;

            transform: translateY(-3px);
        }

        #startButton:active {
            transform: scale(0.96);
        }

        #startButton.loading {
            background: #333;

            cursor: wait;
        }

        /* =========================
           النص السفلي
        ========================= */

        .bottom-text {
            position: absolute;

            bottom: 13px;

            left: 0;
            right: 0;

            text-align: center;

            font-size: 9px;

            color: #aaa;

            pointer-events: none;
        }

        /* =========================
           الحركة
        ========================= */

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform: translateY(15px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }
        }

        /* =========================
           الحاسوب
        ========================= */

        @media (min-width: 601px) {

            .page {
                padding: 42px 30px 40px;
            }

            .background-shape {
                width: 420px;
                height: 420px;

                top: -190px;
                left: -160px;
            }

            .small-label {
                font-size: 13px;

                margin-bottom: 20px;
            }

            h1 {
                font-size: clamp(60px, 8vw, 90px);

                letter-spacing: -3px;
            }

            .message {
                font-size: 20px;

                max-width: 500px;
            }

            #startButton {
                max-width: 170px;
            }

            .bottom-text {
                font-size: 10px;

                bottom: 15px;
            }
        }

        /* =========================
           الهواتف الصغيرة جدًا
        ========================= */

        @media (max-width: 360px) {

            .page {
                padding-top: 28px;
            }

            h1 {
                font-size: 51px;
            }

            .message {
                font-size: 15px;

                max-width: 290px;
            }

            #startButton {
                max-width: 260px;
            }
        }

        /* =========================
           تقليل الحركة
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;

                transition: none !important;
            }
        }

    </style>

</head>

<body>

    <main class="page">

        <div
            class="background-shape"
            aria-hidden="true">
        </div>


        <!-- العنوان في الأعلى -->

        <section class="top-content">

            <div class="small-label">
                خطوة واحدة فقط
            </div>

            <h1>
                مرحبًا بك
            </h1>

        </section>


        <!-- الجملة في منتصف الشاشة -->

        <section class="middle-content">

            <p class="message">
                تأخرت قليلًا...
                <br>
                لكن <strong>قرارك الآن</strong> قد يغيّر كل شيء.
            </p>

        </section>


        <!-- الزر في الأسفل -->

        <div class="bottom-action">

            <button
                id="startButton"
                type="button">

                <span id="buttonText">
                    ابدأ الآن
                </span>

            </button>

        </div>


        <div class="bottom-text">
            خذ لحظة. ثم ابدأ.
        </div>

    </main>


    <script>

        const startButton =
            document.getElementById("startButton");

        const buttonText =
            document.getElementById("buttonText");


        /* =========================================
           رابط Google Apps Script
        ========================================= */

        const API_URL =
            "https://script.google.com/macros/s/AKfycby4Bh4LqFrAH0igKlMdHyrYPpXbQL2NpbkUbzg8Ah6U0AtF4I1FgDqGBrGmr4r7HBW36g/exec";


        /* =========================================
           إنشاء Session ID
        ========================================= */

        function generateSessionId() {

            return (
                Date.now().toString(36) +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2, 12)
            );

        }


        let sessionId =
            sessionStorage.getItem("sessionId");


        if (!sessionId) {

            sessionId =
                generateSessionId();

            sessionStorage.setItem(
                "sessionId",
                sessionId
            );

        }


        /* =========================================
           وقت الدخول إلى الصفحة الأولى
        ========================================= */

        let page1EntryTimestamp =
            sessionStorage.getItem(
                "page1EntryTimestamp"
            );


        if (!page1EntryTimestamp) {

            page1EntryTimestamp =
                new Date().toISOString();

            sessionStorage.setItem(
                "page1EntryTimestamp",
                page1EntryTimestamp
            );

        }


        /* =========================================
           تحويل التاريخ إلى شكل الشيت
        ========================================= */

        function formatDateTime(date) {

            const hours =
                String(
                    date.getHours()
                ).padStart(2, "0");

            const minutes =
                String(
                    date.getMinutes()
                ).padStart(2, "0");

            const seconds =
                String(
                    date.getSeconds()
                ).padStart(2, "0");

            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");

            const year =
                date.getFullYear();


            return (
                hours +
                ":" +
                minutes +
                ":" +
                seconds +
                " " +
                day +
                "/" +
                month +
                "/" +
                year
            );

        }


        /* =========================================
           حساب مدة البقاء
        ========================================= */

        function getDuration(
            startTimestamp
        ) {

            if (!startTimestamp) {
                return "";
            }


            const start =
                new Date(
                    startTimestamp
                );

            const now =
                new Date();


            let totalSeconds =
                Math.floor(
                    (
                        now.getTime() -
                        start.getTime()
                    ) / 1000
                );


            if (totalSeconds < 0) {
                totalSeconds = 0;
            }


            const hours =
                Math.floor(
                    totalSeconds / 3600
                );


            totalSeconds =
                totalSeconds % 3600;


            const minutes =
                Math.floor(
                    totalSeconds / 60
                );


            const seconds =
                totalSeconds % 60;


            return (
                String(hours).padStart(2, "0") +
                ":" +
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0") +
                " sec"
            );

        }


        /* =========================================
           إرسال البيانات
        ========================================= */

        function sendTracking(data) {

            return fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(data),

                    keepalive: true
                }
            )
            .then(function () {
                return true;
            })
            .catch(function (error) {

                console.error(
                    "Tracking error:",
                    error
                );

                return false;

            });

        }


        /* =========================================
           تسجيل دخول الصفحة الأولى
        ========================================= */

        const page1AlreadyRegistered =
            sessionStorage.getItem(
                "page1Registered"
            );


        if (!page1AlreadyRegistered) {

            sessionStorage.setItem(
                "page1Registered",
                "true"
            );


            sendTracking({

                sessionId:
                    sessionId,

                entered:
                    "نعم",

                entryTime:
                    formatDateTime(
                        new Date(
                            page1EntryTimestamp
                        )
                    ),

                page1:
                    "1"

            });

        }


        /* =========================================
           زر الانتقال إلى form.html
        ========================================= */

        startButton.addEventListener(
            "click",
            async function () {

                if (
                    startButton.classList.contains(
                        "loading"
                    )
                ) {
                    return;
                }


                /* وقت الضغط */

                const transitionDate =
                    new Date();


                const transitionTime =
                    formatDateTime(
                        transitionDate
                    );


                /* مدة الصفحة الأولى */

                const duration1 =
                    getDuration(
                        page1EntryTimestamp
                    );


                /* حفظها للصفحة الثانية */

                sessionStorage.setItem(
                    "page1Duration",
                    duration1
                );


                sessionStorage.setItem(
                    "page2EntryTimestamp",
                    transitionDate.toISOString()
                );


                /* نفس شكل الزر الأصلي */

                startButton.classList.add(
                    "loading"
                );


                buttonText.textContent =
                    "جارٍ الانتقال...";


                /* تسجيل الانتقال */

                await sendTracking({

                    sessionId:
                        sessionId,

                    entered:
                        "نعم",

                    entryTime:
                        formatDateTime(
                            new Date(
                                page1EntryTimestamp
                            )
                        ),

                    page1:
                        "1",

                    duration1:
                        duration1,

                    movedToPage2:
                        "نعم",

                    page2Time:
                        transitionTime,

                    page2:
                        "2"

                });


                /* =================================
                   الرابط إلى الصفحة الثانية
                   ================================= */

                setTimeout(
                    function () {

                        window.location.href =
                            "form.html";

                    },
                    450
                );

            }
        );

    </script>

</body>
</html>
