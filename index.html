<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>360¹</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;

    color: #000000;

    font-family: Arial, sans-serif;
}


.welcome {

    width: 100%;

    height: 100vh;
    height: 100dvh;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    transition:
        transform 0.7s ease;
}


.main {

    width: 100%;

    text-align: center;

    user-select: none;

    transform:
        translateY(-55px);

    padding: 0 20px;
}


.logo {

    direction: ltr;

    font-size: 110px;

    font-weight: 800;

    line-height: 0.95;

    letter-spacing: -4px;

    color: #000000;
}


.logo .one {

    font-size: 0.38em;

    vertical-align: super;

    position: relative;

    top: -0.18em;

    letter-spacing: 0;
}


.statement {

    margin:
        30px auto 0;

    max-width: 720px;

    font-size: 25px;

    font-weight: 400;

    line-height: 1.55;

    color: #333333;
}


.bottom {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 26px;

    display: flex;

    flex-direction: column;

    align-items: center;

    user-select: none;
}


.hint {

    margin-bottom: 6px;

    font-size: 16px;

    color: #666666;
}


.arrow {

    font-size: 38px;

    font-weight: 300;

    line-height: 1;

    cursor: pointer;

    animation:
        arrowMove 1.8s ease-in-out infinite;
}


@keyframes arrowMove {

    0%,
    100% {

        transform:
            translateY(0);

        opacity: 0.55;
    }

    50% {

        transform:
            translateY(8px);

        opacity: 1;
    }

}


@media (max-width: 600px) {

    .main {

        transform:
            translateY(-62px);

        padding: 0 18px;
    }


    .logo {

        font-size: 78px;

        letter-spacing: -3px;
    }


    .statement {

        margin-top: 24px;

        width: 100%;

        max-width: 340px;

        font-size: 20px;

        line-height: 1.65;

        text-align: center;
    }


    .bottom {

        bottom: 20px;
    }


    .hint {

        margin-bottom: 5px;

        font-size: 14px;
    }


    .arrow {

        font-size: 34px;
    }

}


@media
(max-height: 650px)
and
(max-width: 600px) {

    .main {

        transform:
            translateY(-48px);
    }


    .logo {

        font-size: 70px;
    }


    .statement {

        margin-top: 20px;

        font-size: 18px;

        line-height: 1.5;

        max-width: 320px;
    }


    .bottom {

        bottom: 14px;
    }


    .hint {

        font-size: 13px;
    }


    .arrow {

        font-size: 31px;
    }

}

</style>

</head>


<body>


<section
    class="welcome"
    id="welcome"
>

    <div class="main">

        <div class="logo">

            360<span class="one">1</span>

        </div>


        <div class="statement">

            إذا كان العميل مهتمًا بالمنتج... فلماذا لا يشتريه؟

        </div>

    </div>


    <div class="bottom">

        <div class="hint">

            خطوة بسيطة للبدء

        </div>


        <div
            class="arrow"
            id="arrow"
        >

            ↓

        </div>

    </div>

</section>


<script>


const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx-leQ-ZWuA4LVjz-spCAhyY84_3YQer9vVgFPuHSYAiESgmGvnc9GMhAjXFYaWhtfNXw/exec";


const welcome =
    document.getElementById("welcome");


const arrow =
    document.getElementById("arrow");


let moved = false;

let startY = 0;


/* =========================
   تسجيل الدخول فور فتح الصفحة
   ========================= */

fetch(
    SCRIPT_URL,
    {

        method: "POST",

        body: JSON.stringify({

            type: "entry"

        })

    }
)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    if (
        data.success &&
        data.row
    ) {

        sessionStorage.setItem(
            "entryRow",
            data.row
        );

    }

})

.catch(function(error) {

    console.error(error);

});


/* =========================
   الانتقال
   ========================= */

function goToForm() {

    if (moved) return;

    moved = true;


    welcome.style.transform =
        "translateY(-100vh)";


    setTimeout(
        function() {

            const row =
                sessionStorage.getItem(
                    "entryRow"
                );


            if (row) {

                window.location.href =
                    "form.html?row=" + row;

            } else {

                window.location.href =
                    "form.html";

            }

        },
        700
    );

}


/* =========================
   السهم
   ========================= */

arrow.addEventListener(
    "click",
    function() {

        goToForm();

    }
);


/* =========================
   السحب
   ========================= */

document.addEventListener(
    "touchstart",
    function(event) {

        startY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchmove",
    function(event) {

        const currentY =
            event.touches[0].clientY;

        const distance =
            startY - currentY;


        if (distance > 35) {

            goToForm();

        }

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    function(event) {

        const endY =
            event.changedTouches[0].clientY;

        const distance =
            startY - endY;


        if (distance > 25) {

            goToForm();

        }

    },
    {
        passive: true
    }
);


/* =========================
   الماوس
   ========================= */

document.addEventListener(
    "wheel",
    function(event) {

        if (event.deltaY > 5) {

            goToForm();

        }

    },
    {
        passive: true
    }
);

</script>

</body>

</html>
