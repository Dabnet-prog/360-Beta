<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>360¹</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #ffffff;

    color: #000000;

    font-family: Arial, sans-serif;
}

body {

    display: flex;

    align-items: center;

    justify-content: center;

    transition:
        opacity 0.25s ease;
}

.container {

    width: 100%;

    max-width: 600px;

    padding: 30px 25px;

    text-align: center;
}

.logo {

    direction: ltr;

    font-size: 64px;

    font-weight: 800;

    line-height: 1;

    letter-spacing: -4px;

    margin-bottom: 70px;
}

.logo .one {

    font-size: 0.38em;

    vertical-align: super;

    position: relative;

    top: -0.18em;

    letter-spacing: 0;
}

.question {

    font-size: 24px;

    line-height: 1.7;

    font-weight: 500;

    color: #111111;

    margin-bottom: 65px;
}

.start {

    font-size: 16px;

    color: #333333;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;
}

.arrow {

    font-size: 28px;

    line-height: 1;

    animation:
        move 1.3s infinite;
}

@keyframes move {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(7px);
    }

    100% {
        transform: translateY(0);
    }

}


@media (max-width: 600px) {

    .container {

        padding: 25px 20px;
    }

    .logo {

        font-size: 52px;

        margin-bottom: 55px;
    }

    .question {

        font-size: 21px;

        line-height: 1.7;

        margin-bottom: 55px;
    }

}

</style>

</head>


<body>

<main class="container">

<div class="logo">

360<span class="one">1</span>

</div>


<div class="question">

إذا كان العميل مهتمًا بالمنتج...<br>
فلماذا لا يشتريه؟

</div>


<div class="start">

<div>
خطوة بسيطة للبدء
</div>

<div class="arrow">
↓
</div>

</div>

</main>


<script>

const scriptURL =
    "https://script.google.com/macros/s/AKfycbx-leQ-ZWuA4LVjz-spCAhyY84_3YQer9vVgFPuHSYAiESgmGvnc9GMhAjXFYaWhtfNXw/exec";


/*
 * إنشاء جلسة جديدة فور فتح الصفحة.
 */

function createSessionId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }


    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2)
    );

}


const sessionId =
    createSessionId();


/*
 * نحفظ الجلسة فورًا في الجهاز.
 */

sessionStorage.setItem(
    "sessionId",
    sessionId
);


/*
 * تسجيل الدخول مباشرة.
 */

const entryRequest =
    fetch(
        scriptURL,
        {

            method: "POST",

            body: JSON.stringify({

                type: "entry",

                sessionId: sessionId

            })

        }
    )
    .then(
        response =>
            response.json()
    )
    .then(
        data => {

            return data;

        }
    )
    .catch(
        function() {

            return {
                success: false
            };

        }
    );


let started = false;


function goToForm() {

    if (started) return;

    started = true;


    document.body.style.opacity =
        "0";


    /*
     * نعطي الصفحة وقتًا قصيرًا للحركة،
     * ثم ننتقل.
     *
     * لا نحتاج إلى رقم الصف.
     * sessionId محفوظ مسبقًا.
     */

    setTimeout(
        function() {

            window.location.href =
                "form.html";

        },
        250
    );

}


/*
 * الضغط
 */

document.addEventListener(
    "click",
    goToForm
);


/*
 * السحب
 */

let startY = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        startY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchmove",
    function(event) {

        const currentY =
            event.touches[0].clientY;


        const distance =
            startY - currentY;


        if (distance > 25) {

            goToForm();

        }

    },
    {
        passive: true
    }
);


/*
 * الماوس / Trackpad
 */

document.addEventListener(
    "wheel",
    function(event) {

        if (event.deltaY > 5) {

            goToForm();

        }

    },
    {
        passive: true
    }
);

</script>

</body>

</html>
