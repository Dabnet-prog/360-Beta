<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>360¹</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #ffffff;

    color: #000000;

    font-family: Arial, sans-serif;
}

body {

    display: flex;

    align-items: center;

    justify-content: center;
}

.container {

    width: 100%;

    max-width: 600px;

    padding: 30px 25px;

    text-align: center;
}

.logo {

    direction: ltr;

    font-size: 64px;

    font-weight: 800;

    line-height: 1;

    letter-spacing: -4px;

    margin-bottom: 70px;
}

.logo .one {

    font-size: 0.38em;

    vertical-align: super;

    position: relative;

    top: -0.18em;

    letter-spacing: 0;
}

.question {

    font-size: 24px;

    line-height: 1.7;

    font-weight: 500;

    color: #111111;

    margin-bottom: 65px;
}

.start {

    font-size: 16px;

    color: #333333;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;
}

.arrow {

    font-size: 28px;

    line-height: 1;

    animation: move 1.3s infinite;
}

@keyframes move {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(7px);
    }

    100% {
        transform: translateY(0);
    }

}


@media (max-width: 600px) {

    .container {

        padding: 25px 20px;
    }

    .logo {

        font-size: 52px;

        margin-bottom: 55px;
    }

    .question {

        font-size: 21px;

        line-height: 1.7;

        margin-bottom: 55px;
    }

}

</style>

</head>


<body>


<main class="container">


<div class="logo">

360<span class="one">1</span>

</div>


<div class="question">

إذا كان العميل مهتمًا بالمنتج...<br>
فلماذا لا يشتريه؟

</div>


<div class="start">

<div>

خطوة بسيطة للبدء

</div>

<div class="arrow">

↓ 

</div>

</div>


</main>


<script>


const scriptURL =
    "https://script.google.com/macros/s/AKfycbx-leQ-ZWuA4LVjz-spCAhyY84_3YQer9vVgFPuHSYAiESgmGvnc9GMhAjXFYaWhtfNXw/exec";


/*
 * نسجل الدخول فور فتح الصفحة.
 */

let entryPromise =
    fetch(
        scriptURL,
        {

            method: "POST",

            body: JSON.stringify({

                type: "entry"

            })

        }
    )
    .then(
        response =>
            response.json()
    )
    .then(
        data => {

            if (
                data.success &&
                data.row
            ) {

                sessionStorage.setItem(
                    "entryRow",
                    data.row
                );

                return data.row;

            }

            return null;

        }
    )
    .catch(
        function() {

            return null;

        }
    );


let started = false;


/*
 * الانتقال إلى الاستبيان
 */

function goToForm() {

    if (started) return;

    started = true;


    /*
     * نبدأ الانتقال مباشرة
     * حتى لا يشعر المستخدم بالانتظار.
     */

    document.body.style.transition =
        "opacity 0.35s ease";

    document.body.style.opacity =
        "0";


    /*
     * بعد الحركة ننتظر فقط
     * حتى يصل رقم صف الدخول.
     */

    setTimeout(
        async function() {

            let row =
                sessionStorage.getItem(
                    "entryRow"
                );


            /*
             * إذا لم يصل الرقم بعد،
             * ننتظر طلب الدخول.
             */

            if (!row) {

                row =
                    await entryPromise;

            }


            /*
             * إذا حصلنا على رقم الصف،
             * نرسله إلى صفحة الاستبيان.
             */

            if (row) {

                window.location.href =
                    "form.html?row=" + row;

                return;

            }


            /*
             * في حالة فشل تسجيل الدخول
             */

            document.body.style.opacity =
                "1";

            started = false;

            alert(
                "تعذر تسجيل الدخول. حاول مرة أخرى."
            );

        },
        350
    );

}


/*
 * الضغط
 */

document.addEventListener(
    "click",
    goToForm
);


/*
 * السحب للأعلى
 */

let startY = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        startY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchmove",
    function(event) {

        const currentY =
            event.touches[0].clientY;

        const distance =
            startY - currentY;


        if (distance > 30) {

            goToForm();

        }

    },
    {
        passive: true
    }
);


/*
 * السحب بالماوس / trackpad
 */

document.addEventListener(
    "wheel",
    function(event) {

        if (event.deltaY > 5) {

            goToForm();

        }

    },
    {
        passive: true
    }
);

</script>


</body>

</html>
