<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ELIT MAN</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 45%,
            #ffffff 0%,
            #f8f8f6 48%,
            #f2f2ef 100%
        );

    color:#171717;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    overflow-x:hidden;
}

body::before{

    content:"";

    position:fixed;

    width:380px;
    height:380px;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95),
            rgba(255,255,255,0) 70%
        );

    pointer-events:none;

    animation:
        breathe 8s ease-in-out infinite;
}

@keyframes breathe{

    0%,
    100%{
        opacity:.45;

        transform:
            translate(-50%,-50%)
            scale(.95);
    }

    50%{
        opacity:.9;

        transform:
            translate(-50%,-50%)
            scale(1.07);
    }
}

.page{

    width:100%;

    max-width:520px;

    min-height:100vh;

    margin:auto;

    padding:
        28px 22px
        24px;

    display:flex;

    flex-direction:column;

    position:relative;

    z-index:2;
}

.brand{

    align-self:center;

    padding:
        7px 15px;

    border:
        1px solid #deded9;

    border-radius:999px;

    background:
        rgba(255,255,255,.65);

    color:#555;

    font-size:10px;

    font-weight:600;

    letter-spacing:2.2px;

    opacity:0;

    transform:
        translateY(-8px);

    animation:
        fadeDown .8s
        cubic-bezier(.2,.8,.2,1)
        .15s forwards;
}

@keyframes fadeDown{

    to{
        opacity:1;

        transform:
            translateY(0);
    }
}

.content{

    flex:1;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:
        20px 0
        35px;
}

.intro{

    color:#999;

    font-size:12px;

    margin-bottom:17px;

    opacity:0;

    transform:
        translateY(10px);

    animation:
        fadeUp .8s
        cubic-bezier(.2,.8,.2,1)
        .55s forwards;
}

h1{

    max-width:370px;

    font-size:28px;

    font-weight:430;

    line-height:1.55;

    letter-spacing:-.8px;

    opacity:0;

    transform:
        translateY(13px)
        scale(.985);

    animation:
        titleIn 1s
        cubic-bezier(.2,.8,.2,1)
        .72s forwards;
}

h1 strong{
    font-weight:780;
}

@keyframes titleIn{

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}

.path-display{

    margin-top:18px;

    padding:
        8px 16px;

    border:
        1px solid #e2e2dd;

    border-radius:999px;

    background:#fff;

    color:#555;

    font-size:11px;

    opacity:0;

    transform:
        scale(.94)
        translateY(8px);

    animation:
        pathIn .7s
        cubic-bezier(.2,.8,.2,1)
        1.05s forwards;
}

@keyframes pathIn{

    to{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }
}

.options{

    width:100%;

    max-width:390px;

    margin-top:25px;

    display:flex;

    flex-direction:column;

    gap:10px;

    opacity:0;

    transform:
        translateY(15px);

    animation:
        fadeUp .8s
        cubic-bezier(.2,.8,.2,1)
        1.25s forwards;
}

.option{

    width:100%;

    padding:
        15px 16px;

    border:
        1px solid #deded9;

    border-radius:14px;

    background:#fff;

    color:#222;

    font-family:inherit;

    font-size:13px;

    cursor:pointer;

    transition:
        border .3s ease,
        box-shadow .3s ease,
        transform .3s ease,
        opacity .3s ease;
}

.option:hover{

    border-color:#aaa;

    transform:
        translateY(-1px);
}

.option.selected{

    border-color:#171717;

    box-shadow:
        0 10px 28px
        rgba(0,0,0,.06);

    transform:
        translateY(-1px);
}

.option.selected::before{

    content:"✓";

    margin-left:8px;

    font-size:12px;
}

.extra{

    width:100%;

    max-width:390px;

    margin-top:14px;

    display:none;

    opacity:0;
}

.extra.show{

    display:block;

    animation:
        extraIn .5s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes extraIn{

    from{
        opacity:0;

        transform:
            translateY(8px);
    }

    to{
        opacity:1;

        transform:
            translateY(0);
    }
}

.extra-label{

    color:#999;

    font-size:11px;

    margin-bottom:7px;
}

textarea{

    width:100%;

    min-height:100px;

    padding:14px;

    border:
        1px solid #deded9;

    border-radius:14px;

    background:#fff;

    outline:none;

    resize:none;

    font-family:inherit;

    font-size:13px;

    line-height:1.8;

    text-align:center;

    transition:
        border .3s ease,
        box-shadow .3s ease;
}

textarea:focus{

    border-color:#999;

    box-shadow:
        0 0 0 4px
        rgba(0,0,0,.035);
}

.bottom{

    padding-top:16px;

    opacity:0;

    transform:
        translateY(10px);

    animation:
        fadeUp .8s
        cubic-bezier(.2,.8,.2,1)
        1.7s forwards;
}

.next-btn{

    width:100%;

    padding:
        16px 20px;

    border:none;

    border-radius:14px;

    background:#171717;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    opacity:.3;

    transition:
        opacity .35s ease,
        transform .25s ease,
        box-shadow .35s ease;
}

.next-btn.active{
    opacity:1;
}

.next-btn.active:hover{

    transform:
        translateY(-1px);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.14);
}

.next-btn:active{

    transform:
        scale(.985);
}

.micro{

    margin-top:10px;

    text-align:center;

    color:#aaa;

    font-size:10px;
}

@keyframes fadeUp{

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}

@media(max-height:700px){

    .content{
        padding-top:12px;
        padding-bottom:20px;
    }

    h1{
        font-size:24px;
    }

    .options{
        margin-top:17px;
    }

    .option{
        padding:12px 14px;
    }

}

</style>
</head>

<body>

<iframe
    name="trackingFrame"
    style="display:none;"
></iframe>

<main class="page">

<div class="brand">
    ELIT MAN
</div>

<section class="content">

    <div class="intro">
        الآن نريد أن نعرف شيئًا واحدًا.
    </div>

    <h1>
        هل ترى هذا الطريق
        <br>
        <strong>ممكنًا فعلًا؟</strong>
    </h1>

    <div
        class="path-display"
        id="pathDisplay"
    >
        الطريق الذي اخترته
    </div>

    <div class="options">

        <button
            class="option"
            data-value="yes"
            type="button"
        >
            نعم، أستطيع
        </button>

        <button
            class="option"
            data-value="maybe"
            type="button"
        >
            ربما، لكن هناك شيء يمنعني
        </button>

        <button
            class="option"
            data-value="no"
            type="button"
        >
            لا، لا أستطيع
        </button>

    </div>

    <div
        class="extra"
        id="extra"
    >

        <div class="extra-label">
            ما الذي يجعله صعبًا؟
        </div>

        <textarea
            id="difficulty"
            placeholder="اكتب بطريقتك..."
        ></textarea>

    </div>

</section>

<div class="bottom">

    <button
        class="next-btn"
        id="nextBtn"
        type="button"
    >
        نكمل ←
    </button>

    <div class="micro">
        لا توجد إجابة صحيحة أو خاطئة
    </div>

</div>

</main>

<script>

/* =====================================================
   TRACKING CONFIG
===================================================== */

const TRACKING_URL =
    "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


/* =====================================================
   CLIENT ID
===================================================== */

const CLIENT_KEY =
    "closing_layer_client_id";


let clientId =
    localStorage.getItem(
        CLIENT_KEY
    );


if(!clientId){

    clientId =
        "CL-" +
        crypto.randomUUID();

    localStorage.setItem(
        CLIENT_KEY,
        clientId
    );

}


/* =====================================================
   SESSION ID
===================================================== */

const SESSION_KEY =
    "closing_layer_session_id";


let sessionId =
    sessionStorage.getItem(
        SESSION_KEY
    );


let isNewSession =
    false;


if(!sessionId){

    sessionId =
        "S-" +
        crypto.randomUUID();

    sessionStorage.setItem(
        SESSION_KEY,
        sessionId
    );

    isNewSession =
        true;

}


/* =====================================================
   RETURNED LATER
===================================================== */

const LAST_SESSION_KEY =
    "closing_layer_last_session_id";


const previousSessionId =
    localStorage.getItem(
        LAST_SESSION_KEY
    );


const returnedLater =
    isNewSession &&
    previousSessionId &&
    previousSessionId !== sessionId;


localStorage.setItem(
    LAST_SESSION_KEY,
    sessionId
);


/* =====================================================
   PAGE CONFIG
===================================================== */

const CURRENT_PAGE =
    "الصفحة 15";


const startedAt =
    Date.now();


const pageEnteredAt =
    new Date().toISOString();


let pageExitSent =
    false;

let pathExitSent =
    false;


/* =====================================================
   TRACKING TRANSPORT
   SEND BEACON + FETCH FALLBACK
===================================================== */

function sendTracking(data){

    try{

        const payload = {

            client_id:
                clientId,

            session_id:
                sessionId,

            ...data

        };


        const body =
            JSON.stringify(
                payload
            );


        const sent =
            navigator.sendBeacon(

                TRACKING_URL,

                new Blob(
                    [body],
                    {
                        type:
                            "text/plain;charset=UTF-8"
                    }
                )

            );


        if(!sent){

            fetch(
                TRACKING_URL,
                {
                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=UTF-8"
                    },

                    body:
                        body,

                    mode:
                        "no-cors",

                    keepalive:
                        true,

                    cache:
                        "no-store"
                }
            );

        }

    }
    catch(error){

        console.error(
            "Tracking error:",
            error
        );

    }

}


/* =====================================================
   SESSION START
===================================================== */

if(isNewSession){

    sendTracking({

        event:
            "session_start",

        page:
            CURRENT_PAGE,

        timestamp:
            pageEnteredAt

    });

}


/* =====================================================
   CENTRAL DATA RECOVERY
===================================================== */

let state = {};

try{

    state =
        JSON.parse(
            localStorage.getItem(
                "decision_state"
            ) || "{}"
        );

}
catch(error){

    state = {};

}


/* =====================================================
   PAGE 13 DATA
===================================================== */

const selectedPath =
    localStorage.getItem(
        "selected_financial_path"
    )
    ||
    state.selected_financial_path
    ||
    "";


const selectedPathText =
    localStorage.getItem(
        "selected_financial_path_text"
    )
    ||
    state.selected_financial_path_text
    ||
    "";


/* =====================================================
   PAGE 14 DATA
===================================================== */

const pathExplanation =
    localStorage.getItem(
        "financial_path_explanation"
    )
    ||
    localStorage.getItem(
        "page14_answer"
    )
    ||
    state.financial_path_explanation
    ||
    "";


/* =====================================================
   PREVIOUS FINANCIAL DATA
===================================================== */

const currentMoney =
    localStorage.getItem(
        "current_money"
    )
    ||
    state.current_money
    ||
    "";


const productPrice =
    localStorage.getItem(
        "selected_product_price"
    )
    ||
    state.selected_product_price
    ||
    "";


const financialGap =
    localStorage.getItem(
        "financial_gap"
    )
    ||
    state.financial_gap
    ||
    "";


const selectedProduct =
    localStorage.getItem(
        "selected_product_name"
    )
    ||
    state.selected_product_name
    ||
    "";


const selectedProducts =
    localStorage.getItem(
        "selected_products"
    )
    ||
    "";


const selectedIntent =
    localStorage.getItem(
        "selected_intent_text"
    )
    ||
    localStorage.getItem(
        "selected_intent"
    )
    ||
    "";


const selectedContext =
    localStorage.getItem(
        "selected_context_text"
    )
    ||
    localStorage.getItem(
        "selected_context"
    )
    ||
    "";


/* =====================================================
   PAGE 15 ENTRY
===================================================== */

const page15EnteredAt =
    new Date().toISOString();


localStorage.setItem(
    "page15_entered_at",
    page15EnteredAt
);


/* =====================================================
   PAGE VIEW
===================================================== */

sendTracking({

    event:
        "page_view",

    page:
        CURRENT_PAGE,

    timestamp:
        page15EnteredAt,

    product:
        selectedProduct,

    selected_products:
        selectedProducts,

    selected_intent:
        selectedIntent,

    selected_context:
        selectedContext,

    current_money:
        currentMoney,

    financial_gap:
        financialGap,

    product_price:
        productPrice,

    financial_path:
        selectedPathText,

    path_text:
        selectedPathText,

    path_explanation:
        pathExplanation

});


/* =====================================================
   BACK NAVIGATION
===================================================== */

window.addEventListener(
    "pageshow",
    function(event){

        if(
            event.persisted
        ){

            sendTracking({

                event:
                    "back_navigation",

                page:
                    CURRENT_PAGE,

                timestamp:
                    new Date().toISOString(),

                from:
                    CURRENT_PAGE

            });

        }

    }
);


/* =====================================================
   DISPLAY SELECTED PATH
===================================================== */

const pathLabels = {

    sell_asset:
        "نبيع شيئًا",

    ask_person:
        "نستعين بشخص",

    save_wait:
        "ننتظر ونجمعه",

    other:
        selectedPathText ||
        "عندي طريق آخر"

};


document.getElementById(
    "pathDisplay"
).textContent =
    pathLabels[selectedPath]
    ||
    selectedPathText
    ||
    "الطريق الذي اخترته";


/* =====================================================
   ELEMENTS
===================================================== */

const options =
    document.querySelectorAll(
        ".option"
    );


const extra =
    document.getElementById(
        "extra"
    );


const difficulty =
    document.getElementById(
        "difficulty"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


/* =====================================================
   SELECTED FEASIBILITY
===================================================== */

let feasibility =
    null;


/* =====================================================
   CHOICE CHANGE
   W / X / Y
===================================================== */

function sendChoiceChanged(
    previousOption,
    newOption
){

    if(
        !previousOption ||
        !newOption ||
        previousOption === newOption
    ){
        return;
    }


    const previousText =
        previousOption.textContent.trim();


    const newText =
        newOption.textContent.trim();


    sendTracking({

        event:
            "choice_changed",

        page:
            CURRENT_PAGE,

        path:
            CURRENT_PAGE,

        choice_changed:
            "نعم",

        choice_previous:
            previousText,

        choice_new:
            newText,

        previous_choice:
            previousText,

        new_choice:
            newText,

        timestamp:
            new Date().toISOString()

    });

}


/* =====================================================
   EXACT VISIBLE TEXT
===================================================== */

function getVisibleFeasibilityText(){

    if(!feasibility){

        return "";

    }


    const selectedOption =
        document.querySelector(
            `.option[data-value="${feasibility}"]`
        );


    if(!selectedOption){

        return "";

    }


    return selectedOption
        .textContent
        .trim();

}


/* =====================================================
   OPTION CLICK
===================================================== */

options.forEach(
    option => {

        option.addEventListener(
            "click",
            function(){

                const previousOption =
                    document.querySelector(
                        ".option.selected"
                    );


                if(
                    previousOption &&
                    previousOption !== this
                ){

                    sendChoiceChanged(
                        previousOption,
                        this
                    );

                }


                options.forEach(
                    item => {

                        item.classList.remove(
                            "selected"
                        );

                    }
                );


                this.classList.add(
                    "selected"
                );


                feasibility =
                    this.dataset.value;


                sendTracking({

                    event:
                        "interaction",

                    page:
                        CURRENT_PAGE,

                    interaction:
                        "feasibility_selected",

                    value:
                        this.textContent.trim(),

                    timestamp:
                        new Date().toISOString()

                });


                if(
                    feasibility ===
                    "yes"
                ){

                    extra.classList.remove(
                        "show"
                    );


                    difficulty.value =
                        "";


                    nextBtn.classList.add(
                        "active"
                    );


                    return;

                }


                extra.classList.add(
                    "show"
                );


                nextBtn.classList.remove(
                    "active"
                );

            }
        );

    }
);


/* =====================================================
   DIFFICULTY INPUT
===================================================== */

difficulty.addEventListener(
    "input",
    function(){

        if(
            feasibility ===
            "yes"
        ){

            nextBtn.classList.add(
                "active"
            );

            return;

        }


        const valid =
            this.value
                .trim()
                .length >= 2;


        nextBtn.classList.toggle(
            "active",
            valid
        );

    }
);


/* =====================================================
   FULL PATH — U
===================================================== */

function sendPathExit(){

    if(pathExitSent){
        return;
    }


    pathExitSent =
        true;


    const payload = {

        client_id:
            clientId,

        session_id:
            sessionId,

        event:
            "path_page_exit",

        page:
            CURRENT_PAGE,

        path_page:
            CURRENT_PAGE,

        timestamp:
            new Date().toISOString()

    };


    const body =
        JSON.stringify(payload);


    try{

        if(navigator.sendBeacon){

            const blob =
                new Blob(
                    [body],
                    {
                        type:
                            "text/plain;charset=UTF-8"
                    }
                );

            navigator.sendBeacon(
                TRACKING_URL,
                blob
            );

            return;
        }

    }
    catch(error){}


    fetch(
        TRACKING_URL,
        {
            method:
                "POST",

            headers:{
                "Content-Type":
                    "text/plain;charset=UTF-8"
            },

            body:
                body,

            mode:
                "no-cors",

            keepalive:
                true,

            cache:
                "no-store"
        }
    ).catch(
        function(){}
    );

}


/* =====================================================
   NEXT
===================================================== */

nextBtn.addEventListener(
    "click",
    function(){

        if(!feasibility){

            return;

        }


        const difficultyText =
            difficulty.value
                .trim();


        if(
            feasibility !== "yes"
            &&
            difficultyText.length < 2
        ){

            return;

        }


        const timestamp =
            new Date().toISOString();


        const timeOnPage =
            Date.now() -
            startedAt;


        const feasibilityText =
            getVisibleFeasibilityText();


        /* =================================================
           SAVE LOCAL STORAGE
        ================================================= */

        localStorage.setItem(
            "financial_path_feasibility",
            feasibility
        );


        localStorage.setItem(
            "financial_path_feasibility_text",
            feasibilityText
        );


        localStorage.setItem(
            "financial_path_difficulty",
            difficultyText
        );


        localStorage.setItem(
            "page15_completed_at",
            timestamp
        );


        /* =================================================
           UPDATE CENTRAL STATE
        ================================================= */

        state.selected_product_name =
            selectedProduct;


        state.selected_product_price =
            productPrice;


        state.current_money =
            currentMoney;


        state.financial_gap =
            financialGap;


        state.selected_financial_path =
            selectedPath;


        state.selected_financial_path_text =
            selectedPathText;


        state.financial_path_explanation =
            pathExplanation;


        state.financial_path_feasibility =
            feasibilityText;


        state.financial_path_difficulty =
            difficultyText;


        state.page15_completed =
            true;


        state.page15_completed_at =
            timestamp;


        localStorage.setItem(
            "decision_state",
            JSON.stringify(
                state
            )
        );


        /* =================================================
           LOCAL EVENT HISTORY
        ================================================= */

        let events = [];


        try{

            events =
                JSON.parse(
                    localStorage.getItem(
                        "decision_events"
                    ) || "[]"
                );

        }
        catch(error){

            events = [];

        }


        events.push({

            event:
                "financial_path_feasibility",

            page:
                "page15",

            timestamp:
                timestamp,

            product:
                selectedProduct,

            product_price:
                productPrice,

            current_money:
                currentMoney,

            financial_gap:
                financialGap,

            selected_path:
                selectedPath,

            selected_path_text:
                selectedPathText,

            path_explanation:
                pathExplanation,

            feasibility:
                feasibilityText,

            difficulty:
                difficultyText,

            time_on_page:
                timeOnPage

        });


        localStorage.setItem(
            "decision_events",
            JSON.stringify(
                events
            )
        );


        /* =================================================
           SERVER EVENT
           360-2 L = feasibility
        ================================================= */

        sendTracking({

            event:
                "financial_path_feasibility",

            page:
                CURRENT_PAGE,

            timestamp:
                timestamp,

            product:
                selectedProduct,

            selected_products:
                selectedProducts,

            product_price:
                productPrice,

            current_money:
                currentMoney,

            financial_gap:
                financialGap,

            selected_path:
                selectedPath,

            selected_path_text:
                selectedPathText,

            financial_path:
                selectedPathText,

            path_explanation:
                pathExplanation,

            financial_path_feasibility:
                feasibilityText,

            feasibility:
                feasibilityText,

            financial_path_difficulty:
                difficultyText,

            difficulty:
                difficultyText,

            time_on_page:
                timeOnPage

        });


        /* =================================================
           PAGE 15 COMPLETED
        ================================================= */

        sendTracking({

            event:
                "page15_completed",

            page:
                CURRENT_PAGE,

            timestamp:
                timestamp,

            product:
                selectedProduct,

            selected_products:
                selectedProducts,

            product_price:
                productPrice,

            current_money:
                currentMoney,

            financial_gap:
                financialGap,

            selected_path:
                selectedPath,

            selected_path_text:
                selectedPathText,

            financial_path:
                selectedPathText,

            path_explanation:
                pathExplanation,

            financial_path_feasibility:
                feasibilityText,

            feasibility:
                feasibilityText,

            financial_path_difficulty:
                difficultyText,

            difficulty:
                difficultyText,

            time_on_page:
                timeOnPage,

            completed:
                true,

            next_page:
                "page16"

        });


        /* =================================================
           EXIT
        ================================================= */

        sendPathExit();


        if(!pageExitSent){

            pageExitSent =
                true;


            sendTracking({

                event:
                    "page_exit",

                page:
                    CURRENT_PAGE,

                timestamp:
                    new Date().toISOString(),

                duration:
                    Date.now() -
                    startedAt

            });

        }


        /* =================================================
           REDIRECT
        ================================================= */

        window.location.href =
            "page16.html";

    }
);


/* =====================================================
   PAGE EXIT / PAGEHIDE
===================================================== */

window.addEventListener(
    "pagehide",
    function(){

        sendPathExit();


        if(pageExitSent){

            return;

        }


        pageExitSent =
            true;


        sendTracking({

            event:
                "page_exit",

            page:
                CURRENT_PAGE,

            timestamp:
                new Date().toISOString(),

            duration:
                Date.now() -
                startedAt

        });

    }
);

</script>
