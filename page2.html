<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>السبب</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            line-height: 1.5;
            font-weight: 700;
            margin-bottom: 28px;
        }

        p {
            font-size: 21px;
            line-height: 1.9;
            font-weight: 400;
            color: #333333;
            margin: 0 auto 40px;
            max-width: 600px;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 21px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s ease;
        }

        button.clicked {
            background: #000000;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            قد يعجب الشخص بالمنتج،
            ويسأل عن السعر، ثم لا يشتري.
        </h1>

        <p>
            فماذا يجعله يتراجع رغم أنه كان مهتمًا؟
        </p>

        <button id="whatsappButton">
            اعرف السبب →
        </button>

    </div>

    <script>

        const trackerURL =
            "https://script.google.com/macros/s/AKfycbzpcGySNVeu3mKM2ROvO03Z1KUXWLJdGqD2Kw8wtA6A0u8zyZJspy8UBJ5qUtqeXI34gA/exec";


        let sessionId =
            sessionStorage.getItem("session_id");


        function track(step) {

            const params =
                new URLSearchParams({

                    session_id: sessionId,
                    step: step

                });


            fetch(
                trackerURL + "?" + params.toString(),
                {
                    method: "GET",
                    mode: "no-cors",
                    keepalive: true
                }
            );
        }


        // تسجيل دخول الصفحة الثانية
        track("page2_view");


        // زر اعرف السبب
        document
            .getElementById("whatsappButton")
            .addEventListener("click", function () {

                this.classList.add("clicked");

                track("whatsapp");


                const phone =
                    "212776346152";


                const message =
                    "أريد معرفة السبب";


                const whatsappURL =
                    "https://wa.me/" +
                    phone +
                    "?text=" +
                    encodeURIComponent(message);


                setTimeout(function () {

                    window.location.href =
                        whatsappURL;

                }, 300);

            });

    </script>

</body>

</html>
