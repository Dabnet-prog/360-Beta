<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نبدأ</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;

      margin: auto;

      padding: 30px 22px 25px;

      display: flex;
      flex-direction: column;
    }


    /* =========================
       اسم المتجر
    ========================== */

    .brand {
      text-align: center;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 2px;
    }


    /* =========================
       المنطقة الوسطى
    ========================== */

    .center {

      flex: 1;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding-bottom: 55px;

      animation:
        enter .9s cubic-bezier(.2,.7,.2,1)
        both;
    }


    /* =========================
       قبل البداية
    ========================== */

    .pause {

      font-size: 12px;

      color: #999;

      margin-bottom: 18px;
    }


    /* =========================
       خذ لحظة
    ========================== */

    .moment {

      font-size: 17px;

      color: #444;

      margin-bottom: 4px;

      line-height: 1.4;
    }


    /* =========================
       ركز جيدًا
    ========================== */

    .focus {

      font-size: 31px;

      font-weight: 700;

      line-height: 1.25;

      letter-spacing: -.7px;
    }


    /* =========================
       السبب
    ========================== */

    .reason {

      margin-top: 19px;

      font-size: 13px;

      color: #888;

      line-height: 1.7;

      max-width: 285px;
    }


    .reason strong {

      color: #444;

      font-weight: 600;
    }


    /* =========================
       منطقة الزر
    ========================== */

    .action {

      width: 100%;

      max-width: 420px;

      text-align: center;
    }


    .button {

      width: 100%;

      border: none;

      border-radius: 16px;

      background: #111;

      color: #fff;

      padding: 18px 20px;

      font-family: inherit;

      font-size: 15px;

      cursor: pointer;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }


    .button:active {

      transform: scale(.985);
    }


    .under-button {

      margin-top: 13px;

      font-size: 11px;

      color: #aaa;
    }


    /* =========================
       الحركة
    ========================== */

    @keyframes enter {

      from {

        opacity: 0;

        transform: translateY(15px);
      }

      to {

        opacity: 1;

        transform: translateY(0);
      }

    }

  </style>

</head>


<body>

  <!-- ==================================
       HIDDEN TRACKING FRAME
  =================================== -->

  <iframe
    name="trackingFrame"
    style="display:none;">
  </iframe>


  <main class="page">


    <!-- =========================
         اسم المتجر
    ========================== -->

    <div class="brand">
      ELIT MAN
    </div>


    <!-- =========================
         الرسالة المركزية
    ========================== -->

    <section class="center">


      <div class="pause">
        قبل أن نبدأ...
      </div>


      <div class="moment">
        خذ لحظة واحدة.
      </div>


      <div class="focus">
        ركّز جيدًا.
      </div>


      <p class="reason">

        لأن الخطوة القادمة
        تعتمد على <strong>اختيارك أنت.</strong>

      </p>


    </section>


    <!-- =========================
         الزر
    ========================== -->

    <div class="action">

      <button
        id="startButton"
        class="button"
      >
        أبدأ الآن ←
      </button>


      <div class="under-button">
        هنا تبدأ العملية
      </div>

    </div>


  </main>


  <script>

    /* =====================================================
       TRACKING CONFIG
    ===================================================== */

    const TRACKING_URL =
      "https://script.google.com/macros/s/AKfycby-S633ZoJlCFrxYIwPhv1CtxHe9OwppAOzSd1i16gClDmiZyvMsZXygwz2Hh2ivM6tsw/exec";


    /* =====================================================
       SAME BROWSER ID
    ===================================================== */

    function getBrowserId() {

      let browserId =
        localStorage.getItem(
          "closing_layer_browser_id"
        );

      if (!browserId) {

        browserId =
          "browser_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2, 10);

        localStorage.setItem(
          "closing_layer_browser_id",
          browserId
        );
      }

      return browserId;
    }


    /* =====================================================
       SEND TRACKING
    ===================================================== */

    function sendTracking(data) {

      const form =
        document.createElement("form");

      form.method = "POST";

      form.target = "trackingFrame";

      form.action = TRACKING_URL;

      form.style.display = "none";


      const payload = {

        browser_id:
          getBrowserId(),

        ...data

      };


      Object.keys(payload).forEach(
        function (key) {

          const input =
            document.createElement("input");

          input.type = "hidden";

          input.name = key;

          const value =
            payload[key];

          input.value =
            typeof value === "object"
              ? JSON.stringify(value)
              : String(value ?? "");

          form.appendChild(input);

        }
      );


      document.body.appendChild(form);

      form.submit();


      setTimeout(
        function () {

          if (form.parentNode) {
            form.parentNode.removeChild(form);
          }

        },
        1000
      );
    }


    /* =====================================================
       PREVIOUS DATA
    ===================================================== */

    const selectedProduct =
      localStorage.getItem(
        "selected_product"
      ) || "";

    const selectedProducts =
      localStorage.getItem(
        "selected_products"
      ) || "";

    const selectedIntent =
      localStorage.getItem(
        "selected_intent"
      ) || "";

    const selectedIntentText =
      localStorage.getItem(
        "selected_intent_text"
      ) || "";

    const selectedContext =
      localStorage.getItem(
        "selected_context"
      ) || "";

    const selectedContextText =
      localStorage.getItem(
        "selected_context_text"
      ) || "";


    /* =====================================================
       بداية الصفحة
    ===================================================== */

    const page8StartedAt =
      Date.now();

    const page8StartedISO =
      new Date().toISOString();


    localStorage.setItem(
      "page8_entered_at",
      page8StartedISO
    );


    /* =====================================================
       نظام الأحداث المحلي
    ===================================================== */

    let events =
      JSON.parse(
        localStorage.getItem("events")
        || "[]"
      );


    function logEvent(type, data = {}) {

      events.push({

        type: type,

        page: "page8",

        timestamp:
          new Date().toISOString(),

        data: data

      });


      localStorage.setItem(
        "events",
        JSON.stringify(events)
      );

    }


    /* =====================================================
       تسجيل الدخول محليًا
    ===================================================== */

    logEvent(
      "page8_entered"
    );


    /* =====================================================
       تسجيل الدخول في السيرفر
    ===================================================== */

    sendTracking({

      event:
        "page_view",

      page:
        "page8",

      product:
        selectedProduct,

      selected_products:
        selectedProducts,

      intent:
        selectedIntent,

      intent_text:
        selectedIntentText,

      context:
        selectedContext,

      context_text:
        selectedContextText,

      timestamp:
        page8StartedISO

    });


    /* =====================================================
       زر البداية
    ===================================================== */

    const startButton =
      document.getElementById(
        "startButton"
      );


    startButton.addEventListener(
      "click",
      function () {


        /* وقت الضغط */

        const clickedAt =
          new Date().toISOString();


        /* مدة البقاء */

        const timeOnPage =
          Date.now() -
          page8StartedAt;


        /* حفظ البيانات */

        localStorage.setItem(
          "page8_started",
          "true"
        );


        localStorage.setItem(
          "process_started_at",
          clickedAt
        );


        localStorage.setItem(
          "page8_time_on_page",
          timeOnPage
        );


        /* =================================================
           تسجيل الحدث محليًا
        ================================================= */

        logEvent(
          "process_started",
          {
            time_on_page:
              timeOnPage
          }
        );


        /* =================================================
           إرسال التتبع
           PAGE 8 → PAGE 9
        ================================================= */

        sendTracking({

          event:
            "page8_completed",

          page:
            "page8",

          product:
            selectedProduct,

          selected_products:
            selectedProducts,

          intent:
            selectedIntent,

          intent_text:
            selectedIntentText,

          context:
            selectedContext,

          context_text:
            selectedContextText,

          time_on_page:
            timeOnPage,

          next_page:
            "page9",

          timestamp:
            clickedAt

        });


        /* =================================================
           الانتقال إلى الصفحة 9
        ================================================= */

        window.location.href =
          "page9.html";

      }
    );

  </script>

</body>

</html>
